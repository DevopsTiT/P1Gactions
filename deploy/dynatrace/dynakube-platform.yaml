# Platform monitoring DynaKube for Minikube (lighter)
# 1) Replace ENVIRONMENTID below with your Dynatrace environment ID
# 2) From repo ROOT (not aws-simulate): kubectl apply -f deploy/dynatrace/dynakube-platform.yaml
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
spec:
  apiUrl: https://ENVIRONMENTID.live.dynatrace.com/api

  metadataEnrichment:
    enabled: true

  activeGate:
    capabilities:
      - kubernetes-monitoring
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
