# L1 / App Dynatrace dashboard — layout visual tile spec
# Matches DASHBOARD LAYOUT VISUAL (11 rows)
dashboard_name: App-Health-Layout
variable:
  name: app
  values: [All, EIP, API, Payment]

rows:
  - id: 1
    role: filter
    title: APPLICATION SELECTOR
    tiles: [variable_app_chips]
  - id: 2
    role: header
    title: CRITICAL ALERTS & AI ROOT CAUSE
    tiles: [markdown_header]
  - id: 3
    role: metrics
    title: alert_row
    tiles:
      - name: Problems
        type: problems_list
      - name: Root Cause
        type: problems_root_cause_or_link
      - name: Alert Summary
        type: problems_by_severity
  - id: 4
    role: header
    title: APPLICATION PERFORMANCE METRICS
    tiles: [markdown_header]
  - id: 5
    role: metrics
    title: app_golden_signals
    tiles:
      - name: Requests
        type: timeseries
        metric: service_request_count
      - name: Errors
        type: timeseries
        metric: service_failure_rate
      - name: Response Time
        type: timeseries
        metric: service_response_time
  - id: 6
    role: header
    title: INFRASTRUCTURE STATUS
    tiles: [markdown_header]
  - id: 7
    role: metrics
    title: host_resources
    tiles:
      - name: Windows CPU
        type: timeseries
        metric: host_cpu
        os: windows
      - name: Linux CPU
        type: timeseries
        metric: host_cpu
        os: linux
      - name: Memory
        type: timeseries
        metric: host_memory
  - id: 8
    role: header
    title: LOGS & ERRORS
    tiles: [markdown_header]
  - id: 9
    role: metrics
    title: logs_row
    tiles:
      - name: Error Logs
        type: logs
        query_hint: 'status="ERROR"'
      - name: Exception Traces
        type: logs_or_exceptions
        query_hint: Exception OR stacktrace
  - id: 10
    role: header
    title: DATABASE & DEPENDENCIES
    tiles: [markdown_header]
  - id: 11
    role: metrics
    title: backend_row
    tiles:
      - name: DB Connections
        type: timeseries_or_single
        metric: db_connections
      - name: Queries
        type: timeseries
        metric: db_query_time
      - name: External Services
        type: table_or_timeseries
        metric: called_services_errors_or_latency

acceptance:
  - app_variable_filters_all_data_tiles
  - headers_match_visual_labels
  - no_cross_app_bleed
