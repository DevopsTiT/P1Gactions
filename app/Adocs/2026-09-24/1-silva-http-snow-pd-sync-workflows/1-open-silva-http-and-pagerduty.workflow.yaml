# OPEN — Problem ACTIVE → SILVA (HTTP, no SNOW connector) + PagerDuty (parallel)
# Situation: cannot use dynatrace.servicenow snow-* connector → use run-javascript fetch instead.
# SILVA / SNOW instance example: https://silvastg.service-now.com
# Sync keys:
#   SNOW correlation_id = <problemId>
#   PD  dedup_key       = dt-problem-<problemId>
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com , events.pagerduty.com
#   2) Replace __SNOW_PASSWORD__ and __PD_ROUTING_KEY__
#   3) Keep classic SNOW Problem notification ITSM OFF (avoid duplicate INC)
#   4) SILVA may skip INC if CMDB says host retired — that is expected gatekeeper logic
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem OPEN to SILVA HTTP and PagerDuty (sync)
  description: >-
    No ServiceNow connector. On Problem open, HTTP POST to SILVA/SNOW Table API
    and PagerDuty Events API in parallel. Same problemId syncs both sides.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
        event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-payload:
      name: prepare-payload
      description: Build shared fields for SILVA INC and PagerDuty trigger (sync keys).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};

            const problemTitle =
              ev["event.name"] ||
              ev["problem.title"] ||
              ev.title ||
              "Dynatrace Problem";
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              "";
            const severity = String(
              ev["problem.severity"] ||
                ev["event.severity"] ||
                ev.severity ||
                "ERROR"
            ).toUpperCase();
            const hostName =
              ev["host.name"] ||
              ev["dt.entity.host.name"] ||
              ev["affected_entity_name"] ||
              "";

            let pdSeverity = "warning";
            let snowImpact = "3";
            let snowUrgency = "3";
            if (severity.includes("AVAILABILITY") || severity.includes("CRITICAL")) {
              pdSeverity = "critical";
              snowImpact = "1";
              snowUrgency = "1";
            } else if (severity.includes("ERROR")) {
              pdSeverity = "error";
              snowImpact = "2";
              snowUrgency = "2";
            }

            const notificationDescription =
              "[OPEN] " + problemId + ": Problem " + problemTitle + " " + problemUrl;

            return {
              problemId: problemId,
              problemUrl: problemUrl,
              problemTitle: problemTitle,
              hostName: hostName,
              severity: severity,
              pdSeverity: pdSeverity,
              snowImpact: snowImpact,
              snowUrgency: snowUrgency,
              notificationDescription: notificationDescription,
              shortDescription: "[Dynatrace] " + problemTitle,
              // SYNC KEYS — must match CLOSE workflow
              correlationId: problemId,
              dedupKey: "dt-problem-" + problemId,
              silvaBaseUrl: "https://silvastg.service-now.com",
              silvaUsername: "Tech_DynatraceJP_WS"
            };
          }

    post-silva-incident-http:
      name: post-silva-incident-http
      description: >-
        HTTP POST to SILVA/SNOW (no snow connector). SILVA/CMDB may skip retired hosts.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");

            const baseUrl = String(p.silvaBaseUrl || "https://silvastg.service-now.com").replace(/\/$/, "");
            const username = p.silvaUsername || "Tech_DynatraceJP_WS";
            const password = "__SNOW_PASSWORD__";
            const headers = {
              Authorization: basicAuthHeader(username, password),
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            // Table API create — same sync field CLOSE will search
            const body = {
              short_description: p.shortDescription,
              description: p.notificationDescription,
              correlation_id: p.correlationId,
              impact: p.snowImpact,
              urgency: p.snowUrgency,
              caller_id: username,
              u_host: p.hostName,
              work_notes:
                "Opened by Dynatrace workflow (HTTP, no SNOW connector). " +
                "Sync correlation_id=" + p.correlationId +
                " PD dedup_key=" + p.dedupKey +
                " problem_url=" + p.problemUrl
            };

            const res = await fetch(baseUrl + "/api/now/v2/table/incident", {
              method: "POST",
              headers: headers,
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }

            // SILVA gatekeeper: retired host / policy skip may return non-create
            if (!res.ok) {
              throw new Error(
                "SILVA/SNOW HTTP create failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for silvastg.service-now.com"
              );
            }

            const row = json.result || json;
            return {
              created: true,
              incidentNumber: row.number || "",
              incidentSysId: row.sys_id || "",
              correlationId: p.correlationId,
              dedupKey: p.dedupKey,
              raw: json
            };
          }

    trigger-pagerduty:
      name: trigger-pagerduty
      description: HTTP POST PagerDuty Events API v2 trigger (parallel with SILVA).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const routingKey = "__PD_ROUTING_KEY__";

            const body = {
              routing_key: routingKey,
              event_action: "trigger",
              dedup_key: p.dedupKey,
              client: "Dynatrace",
              client_url: p.problemUrl,
              payload: {
                summary: p.shortDescription,
                source: "dynatrace",
                severity: p.pdSeverity,
                custom_details: {
                  problem_id: p.problemId,
                  problem_url: p.problemUrl,
                  host_name: p.hostName,
                  snow_correlation_id: p.correlationId,
                  silva_path: "HTTP Table API (no snow connector)",
                  sync_note: "CLOSE uses same dedup_key + correlation_id"
                }
              }
            };

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) {
              throw new Error(
                "PagerDuty trigger failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for events.pagerduty.com"
              );
            }
            return {
              status: json.status || "ok",
              dedupKey: json.dedup_key || p.dedupKey,
              correlationId: p.correlationId,
              raw: json
            };
          }
