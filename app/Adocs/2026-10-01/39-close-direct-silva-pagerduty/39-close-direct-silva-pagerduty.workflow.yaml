# CLOSE direct v1: Dynatrace problem CLOSED -> resolve SILVA incident(s) and PagerDuty in parallel. No preview tasks.
# Pair of: 36-standard-flow-preview-then-post (OPEN). Same sync keys:
#   SILVA      correlation_id = <problem display id>    e.g. P-261090
#   PagerDuty  dedup_key      = dt-problem-<display id>  e.g. dt-problem-P-261090
#
#   1 prepare-close           problem id, times, duration, cause (Problems API)
#   2a close-silva-incident   GET open incidents by correlation_id, check state/close_code choices, PATCH each to Resolved
#   2b close-pagerduty        POST /v2/enqueue event_action resolve
#   2a and 2b run in parallel, so PagerDuty is resolved even if SILVA fails.
#
# Press Run (no event) = sample close of SAMPLE_EVENT.display_id. Both close tasks skip it unless ALLOW_SAMPLE_POST = true.
# Set DRY_RUN = true in 2a and 2b to test without sending.
# BEFORE ACTIVATE: allowlist silvastg.service-now.com and events.pagerduty.com. Save / Deploy (Drafts are not triggered).
# Use either this workflow or 37 (preview then resolve), not both, so one close is not handled twice.
# Contains the SILVA password and PD routing key: local copy only, never commit.
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - CLOSE Problem direct to SILVA and PagerDuty v1
  description: >-
    On Dynatrace problem close: resolves every open SILVA incident with correlation_id = problem id, and resolves
    PagerDuty with dedup_key dt-problem-<problem id>. Both run in parallel.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "CLOSED"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: true
          entityTags: {}
          onProblemClose: true
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-close:
      name: prepare-close
      description: Problem id, correlation_id, dedup_key, start and end time, duration and cause for the close notes.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- settings (edit) ----------
          const USE_PROBLEM_API = true;
          // Used only when the workflow is started with Run (no trigger event). display_id is the only required value.
          const SAMPLE_EVENT = {
            "event.kind": "DAVIS_PROBLEM",
            "event.status": "CLOSED",
            "display_id": "P-261090",
            "event.name": "Error in the Windows Application Log with an eventID 258 on TS12.hk.intraxa",
            "root_cause_entity_name": "ts12.hk.intraxa"
          };
          // -------------------------------------

          const first = v => Array.isArray(v) ? v[0] : v;
          function toMs(v) {
            if (v === undefined || v === null || v === "") return 0;
            const n = Number(v);
            if (!isNaN(n)) return n > 1e15 ? Math.round(n / 1e6) : n;
            const p = Date.parse(v);
            return isNaN(p) ? 0 : p;
          }
          function duration(ms) {
            if (!ms || ms < 0) return "unknown";
            const m = Math.round(ms / 60000);
            return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const live = ex.event() || {};
            const usedSample = !live["event.kind"] && !live["event.id"];
            const ev = usedSample ? SAMPLE_EVENT : live;
            const envUrl = getEnvironmentUrl().replace(/\/$/, "");

            let prob = {};
            let problemApi = usedSample ? "skipped (sample event)" : (USE_PROBLEM_API ? "ok" : "off");
            if (!usedSample && USE_PROBLEM_API && ev["event.id"]) {
              try {
                prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
              } catch (e) {
                prob = {};
                problemApi = "failed: " + String((e && e.message) || e).slice(0, 200);
              }
            }

            const internalId = String(ev["event.id"] || prob.problemId || "");
            const displayId = String(ev["display_id"] || prob.displayId || internalId);
            const start = prob.startTime > 0 ? prob.startTime : toMs(ev["event.start"]);
            const end = prob.endTime > 0 ? prob.endTime : (toMs(ev["event.end"]) || Date.now());
            const root = prob.rootCauseEntity || (prob.affectedEntities || [])[0] || {};
            const where = root.name || first(ev["root_cause_entity_name"]) || first(ev["affected_entity_names"]) || "";

            return {
              problem_id: displayId,
              internal_id: internalId,
              correlation_id: displayId,
              dedup_key: "dt-problem-" + displayId,
              status: String(prob.status || ev["event.status"] || ""),
              title: String(prob.title || ev["event.name"] || ""),
              where: String(where),
              start_time: start ? new Date(start).toISOString() : "",
              end_time: new Date(end).toISOString(),
              duration: start ? duration(end - start) : "unknown",
              problem_url: internalId ? envUrl + "/ui/apps/dynatrace.davis.problems/problem/" + internalId : "",
              problem_api: problemApi,
              used_sample_event: usedSample
            };
          }

    close-silva-incident:
      name: close-silva-incident
      description: Find open SILVA incidents by correlation_id and PATCH each one to Resolved with close code and notes.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-close
      conditions:
        states:
          prepare-close: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const BASE_URL = "https://silvastg.service-now.com";
          const USERNAME = "Tech_DynatraceJP_WS";
          const PASSWORD = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
          // Value or label both work; matched against the SILVA choice list before sending.
          const RESOLVED_STATE = "Resolved";
          const CLOSE_CODE = "Solved (Permanently)";
          // "work_notes" = internal note, "comments" = visible to the caller (may email them)
          const NOTES_FIELD = "work_notes";
          // Extra fields SILVA may require to resolve, e.g. { u_resolution_type: "Automatic" }
          const EXTRA_FIELDS = {};
          const DRY_RUN = false;            // true = build and log only, never PATCH
          const ALLOW_SAMPLE_POST = false;  // manual Run uses SAMPLE_EVENT; true = really resolve it
          // -------------------------------------

          const headers = {
            Authorization: "Basic " + Buffer.from(USERNAME + ":" + PASSWORD).toString("base64"),
            Accept: "application/json",
            "Content-Type": "application/json"
          };
          const val = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].value || "") : String((row && row[f]) || "");
          const dv = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].display_value || "") : String((row && row[f]) || "");

          async function getRows(table, query, fields, limit) {
            const url = BASE_URL + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent(query) +
              "&sysparm_fields=" + fields.join(",") +
              "&sysparm_display_value=all&sysparm_exclude_reference_link=true&sysparm_limit=" + limit;
            const res = await fetch(url, { method: "GET", headers: headers });
            const text = await res.text();
            if (!res.ok) throw new Error("SILVA GET " + table + " failed " + res.status + ": " + text.slice(0, 300));
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = {}; }
            return json.result || [];
          }
          // Returns the SILVA value for a dropdown; throws if SILVA's list is readable and has no match.
          async function choiceValue(element, wanted) {
            let rows = [];
            try {
              rows = await getRows("sys_choice", "name=incident^element=" + element + "^inactive=false^language=en", ["value", "label"], 100);
            } catch (e) {
              return { value: wanted, check: "UNVERIFIED (choice list not readable)" };
            }
            if (!rows.length) return { value: wanted, check: "UNVERIFIED (choice list empty)" };
            const w = String(wanted).toLowerCase();
            const list = rows.map(x => ({ value: val(x, "value"), label: dv(x, "label") || val(x, "label") }));
            const hit = list.find(x => x.value.toLowerCase() === w) || list.find(x => x.label.toLowerCase() === w);
            if (!hit) {
              throw new Error(element + " '" + wanted + "' is not a SILVA choice. Allowed: " + list.map(x => x.label + " (" + x.value + ")").join(", ").slice(0, 800));
            }
            return { value: hit.value, check: "OK (" + hit.label + ")" };
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const c = await ex.result("prepare-close");

            const open = await getRows("incident", "correlation_id=" + c.correlation_id + "^active=true^ORDERBYDESCsys_created_on",
              ["sys_id", "number", "state", "assignment_group", "u_business_service", "cmdb_ci", "u_configuration_item"], 5);
            if (!open.length) {
              return { action: "skipped", reason: "no open SILVA incident with correlation_id " + c.correlation_id + " (already resolved, or OPEN skipped it)", correlation_id: c.correlation_id };
            }
            if (c.used_sample_event && !ALLOW_SAMPLE_POST) {
              return { action: "skipped", reason: "sample event (set ALLOW_SAMPLE_POST = true to resolve)", would_resolve: open.map(x => dv(x, "number")), correlation_id: c.correlation_id };
            }

            const state = await choiceValue("state", RESOLVED_STATE);
            const closeCode = await choiceValue("close_code", CLOSE_CODE);
            const where = c.where || "unknown entity";
            const closeNotes = [
              "Dynatrace problem " + c.problem_id + " closed automatically at " + c.end_time + ".",
              "Duration: " + c.duration + (c.start_time ? " (" + c.start_time + " to " + c.end_time + ")" : "") + ".",
              "Cause: " + c.title + " on " + where + ".",
              "Recovery confirmed by Dynatrace: the problem condition is no longer detected."
            ].join("\n").slice(0, 3900);

            const results = [];
            for (const inc of open) {
              const sysId = val(inc, "sys_id");
              const number = dv(inc, "number");
              const note = [
                "=== Dynatrace problem closed (" + c.problem_id + ") ===",
                "Duration          : " + c.duration,
                "Cause             : " + c.title + " on " + where,
                "Assignment group  : " + (dv(inc, "assignment_group") || "n/a"),
                "Business service  : " + (dv(inc, "u_business_service") || "n/a"),
                "Service offering  : " + (dv(inc, "cmdb_ci") || "n/a"),
                "Configuration item: " + (dv(inc, "u_configuration_item") || "n/a"),
                "Dynatrace problem : " + (c.problem_url || "n/a"),
                "PagerDuty         : resolved with dedup_key " + c.dedup_key
              ].join("\n").slice(0, 3900);
              const body = Object.assign({
                state: state.value,
                close_code: closeCode.value,
                close_notes: closeNotes,
                [NOTES_FIELD]: note
              }, EXTRA_FIELDS);

              if (DRY_RUN) {
                results.push({ number: number, action: "dry_run", payload: body });
                continue;
              }
              const res = await fetch(BASE_URL + "/api/now/v2/table/incident/" + sysId + "?sysparm_display_value=all&sysparm_exclude_reference_link=true", {
                method: "PATCH",
                headers: headers,
                body: JSON.stringify(body)
              });
              const text = await res.text();
              let json = {};
              try { json = JSON.parse(text); } catch (e) { json = {}; }
              const after = json.result || {};
              const ok = res.ok && val(after, "state") === String(state.value);
              results.push({
                number: number,
                action: ok ? "resolved" : "failed",
                http: res.status,
                state: dv(after, "state"),
                close_code: dv(after, "close_code"),
                error: ok ? "" : (res.ok ? "state did not change; SILVA may need more close fields (EXTRA_FIELDS)" : text.slice(0, 300)),
                url: BASE_URL + "/nav_to.do?uri=incident.do?sys_id=" + sysId
              });
            }

            const out = {
              action: DRY_RUN ? "dry_run" : (results.every(r => r.action === "resolved") ? "resolved" : "partly_failed"),
              correlation_id: c.correlation_id,
              value_check: { state: state.check, close_code: closeCode.check },
              incidents: results
            };
            console.log(JSON.stringify(out, null, 2));
            if (out.action === "partly_failed") {
              throw new Error("SILVA resolve failed: " + results.filter(r => r.action === "failed").map(r => r.number + " " + r.error).join("; "));
            }
            return out;
          }

    close-pagerduty:
      name: close-pagerduty
      description: Send the PagerDuty resolve with the same dedup_key OPEN used (in parallel with SILVA).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-close
      conditions:
        states:
          prepare-close: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const ROUTING_KEY = "222651dbacb04403c0bf52d3b48499e8";
          const DRY_RUN = false;
          const ALLOW_SAMPLE_POST = false;  // manual Run uses SAMPLE_EVENT; true = really resolve it
          // -------------------------------------

          // PagerDuty ignores a resolve when no open alert has this dedup_key, so it is safe to always send.
          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const c = await ex.result("prepare-close");

            if (!/^dt-problem-.+/.test(c.dedup_key || "")) {
              return { action: "skipped", reason: "no problem id, dedup_key is " + c.dedup_key };
            }
            if (c.used_sample_event && !ALLOW_SAMPLE_POST) {
              return { action: "skipped", reason: "sample event (set ALLOW_SAMPLE_POST = true to send)", dedup_key: c.dedup_key };
            }

            const event = { routing_key: ROUTING_KEY, event_action: "resolve", dedup_key: c.dedup_key };
            if (DRY_RUN) {
              return { action: "dry_run", payload: Object.assign({}, event, { routing_key: "__hidden__" }) };
            }

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(event)
            });
            const text = await res.text();
            if (!res.ok) {
              throw new Error("PagerDuty resolve failed " + res.status + ": " + text.slice(0, 500));
            }
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = {}; }
            return {
              action: "resolved",
              status: json.status,
              dedup_key: json.dedup_key || event.dedup_key,
              snow_correlation_id: c.correlation_id
            };
          }
