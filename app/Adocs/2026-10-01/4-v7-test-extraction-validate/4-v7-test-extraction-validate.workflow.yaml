# TEST workflow v7: Davis problem -> extract -> resolve in SILVA -> build payload (preview) -> VALIDATE.
# Nothing is created. There is NO POST / PATCH to SILVA and NO call to PagerDuty. Only GET lookups.
#
#   1 extract-event-tags     read the event and tags (fixed: dt.security_context, env PRE, app code, [object Object])
#   2 resolve-snow-values    SILVA lookups; final group follows GROUP_ORDER (tag > servicenow_enrichment > CI > default)
#   3 build-payload          the SNOW body exactly as OPEN would send it, plus where every field came from
#   4 validate-extraction    GET checks of every payload value in SILVA: PASS / WARN / FAIL table and a verdict
#
# Fixes compared with OPEN v6 (seen on P-260916863):
#   - Assignment group came from DEFAULT_GROUP; now it comes from servicenow_enrichment (the business service's
#     assignment group) unless a group tag exists.
#   - Environment "env:PRE" and "dt.security_context" were ignored, so the default set forced "PoC / VoA / Demo".
#   - Service offering was the Production offering for a PRE problem; now it prefers the offering for the environment.
#   - event_properties showed [object Object]; Summary carried a raw JSON dump; both cleaned.
#   - caller_id / u_on_behalf_of were sent as names; task 4 looks up the sys_id you should use.
#
# Press Run (no event) to test the sample event P-260916863 below.
# The trigger is active so real problems are also checked; it is read-only, set isActive: false to stop it.
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: TEST v7 - validate extraction and SNOW payload (no POST)
  description: >-
    Read-only test of the OPEN workflow logic. Extracts the event, resolves group, business service and offering in
    SILVA, builds the SNOW incident body as a preview, then validates every value with GET lookups. Never creates
    a SILVA incident and never calls PagerDuty.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        event.status_transition == "CREATED"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: true
          entityTags: {}
          onProblemClose: false
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 200
  tasks:
    extract-event-tags:
      name: extract-event-tags
      description: Parse tags and alert fields; build the SNOW inputs (group tags, environment, app code, host).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- settings (edit) ----------
          const USE_PROBLEM_API = true;
          // Task 4 lists the real SILVA environment labels. If it reports FAIL, change PREPROD_LABEL to the right one.
          const PREPROD_LABEL = "Pre-Production";
          const ENVIRONMENT = {
            production: "Production", prod: "Production", prd: "Production",
            development: "Development", dev: "Development",
            "integration-test": "Integration / Test", "integration / test": "Integration / Test",
            integration: "Integration / Test", test: "Integration / Test", tst: "Integration / Test",
            acceptance: "Integration / Test", acc: "Integration / Test", uat: "Integration / Test",
            pre: PREPROD_LABEL, preprod: PREPROD_LABEL, "pre-prod": PREPROD_LABEL, "pre-production": PREPROD_LABEL,
            stg: PREPROD_LABEL, staging: PREPROD_LABEL
          };
          const DEFAULT_ENVIRONMENT = "Development";
          const SERVICE_TAG_KEYS = ["snow-service", "ago_axa_businessservice", "business-service", "u_business_service"];
          const APP_CODE_TAG_KEYS = ["dt.cost.product", "ago_axaappcode", "app_code", "appcode"];
          const APP_NAME_TAG_KEYS = ["app", "app.kubernetes.io/name"];
          const OPCO_TAG_KEYS = ["company", "dt.cost.costcenter"];
          // Used only when the workflow is started with Run (no trigger event). Copied from P-260916863.
          const SAMPLE_EVENT = {
            "event.kind": "DAVIS_PROBLEM",
            "event.status": "ACTIVE",
            "event.status_transition": "CREATED",
            "event.name": "Failure rate increase",
            "event.category": "ERROR",
            "event.description": "Failure rate increase. The error rate increased to 10.29 %.",
            "display_id": "P-260916863",
            "dt.davis.impact_level": ["Services"],
            "labels.alerting_profile": ["ALJ NewSilvaSTG", "test_ocms", "EEP Test", "Default"],
            "affected_entity_types": ["dt.entity.service"],
            "dt.entity.service": ["SERVICE-034688DB8318AA41"],
            "affected_entity_ids": ["SERVICE-034688DB8318AA41"],
            "affected_entity_names": ["[AGPOCLOUDWEBNGINX.PRE] agpo-cloud-web-proxy-*-8080"],
            "root_cause_entity_id": "SERVICE-034688DB8318AA41",
            "root_cause_entity_name": "[AGPOCLOUDWEBNGINX.PRE] agpo-cloud-web-proxy-*-8080",
            "dt.security_context": ["ALJ_ALJ_PRE", "ALJ_STG", "ALJ_TST"],
            "maintenance.is_under_maintenance": false,
            "entity_tags": [
              "[Environment]DT_RELEASE_PRODUCT",
              "[Environment]DT_RELEASE_VERSION",
              "[Kubernetes]app:agpo-cloud-web-proxy",
              "app:agpo-cloud-web-proxy",
              "bu:APPLICATION",
              "company:ALJ",
              "dt.cost.costcenter:ALJ",
              "dt.cost.product:AGPOCLOUDWEBNGINX",
              "env:PRE",
              "host:agpo-cloud-web-proxy-654cf4dddd-6pgmp",
              "host:agpo-cloud-web-proxy-654cf4dddd-m9946",
              "k8s.namespace.name:agportalfrontend-preprod-axa-li-jp",
              "tier:JAVA"
            ]
          };
          // -------------------------------------

          function asList(v) {
            return [].concat(v === undefined || v === null ? [] : v)
              .flatMap(x => typeof x === "string" ? x.split(",") : [x])
              .map(x => String(x).trim()).filter(s => s !== "");
          }
          const unique = a => a.filter((v, i) => v && a.indexOf(v) === i);
          const fmt = v => Array.isArray(v)
            ? v.map(x => (x && typeof x === "object") ? JSON.stringify(x) : String(x)).join(", ")
            : (v && typeof v === "object") ? JSON.stringify(v) : String(v);

          function parseTag(raw) {
            const s = String(raw).trim();
            const x = s.replace(/^\[[^\]]+\]/, "");
            const i = x.indexOf(":");
            return { raw: s, key: i > 0 ? x.slice(0, i).trim() : x.trim(), value: i > 0 ? x.slice(i + 1).trim() : "" };
          }
          function findByKey(parsed, test) {
            const hit = parsed.find(t => t.value && test(t.key.toLowerCase()));
            return hit ? { key: hit.key, value: hit.value } : null;
          }
          function allByKey(parsed, tests) {
            const out = [];
            for (const test of tests) {
              for (const t of parsed) {
                if (t.value && test(t.key.toLowerCase()) && !out.some(o => o.value.toLowerCase() === t.value.toLowerCase())) {
                  out.push({ key: t.key, value: t.value });
                }
              }
            }
            return out;
          }
          // Whole value first ("PRE"), then each token ("agportalfrontend-preprod-axa-li-jp" -> "preprod")
          function envLabel(value) {
            const v = String(value || "").toLowerCase();
            if (ENVIRONMENT[v]) return ENVIRONMENT[v];
            const tok = v.split(/[^a-z]+/).find(x => ENVIRONMENT[x]);
            return tok ? ENVIRONMENT[tok] : "";
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const live = ex.event() || {};
            const usedSample = !live["event.kind"] && !live["event.id"];
            const ev = usedSample ? SAMPLE_EVENT : live;
            const envUrl = getEnvironmentUrl().replace(/\/$/, "");

            let prob = {};
            let problemApi = usedSample ? "skipped (sample event)" : (USE_PROBLEM_API ? "ok" : "off");
            if (!usedSample && USE_PROBLEM_API && ev["event.id"]) {
              try {
                prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
              } catch (e) {
                prob = {};
                problemApi = "failed: " + String((e && e.message) || e).slice(0, 200);
              }
            }

            const rawTags = [].concat(ev["entity_tags"] || []).map(String);
            for (const t of prob.entityTags || []) {
              const s = t.stringRepresentation || (t.value ? t.key + ":" + t.value : t.key);
              if (s && !rawTags.includes(s)) rawTags.push(s);
            }
            const parsed = rawTags.map(parseTag);

            const groupCandidates = allByKey(parsed, [
              k => k === "ago_axa_supportgroup",
              k => /(assignment_group|support_?group)$/.test(k) && k !== "ago_default_assignment_group" && k !== "ago_axa_supportgroup",
              k => k === "ago_default_assignment_group"
            ]);
            const serviceTag = findByKey(parsed, k => SERVICE_TAG_KEYS.includes(k));

            // Environment: env tags -> namespace -> security context -> patch environment -> default
            const envCandidates = allByKey(parsed, [
              k => k === "ago_axaenvironmentname",
              k => k === "env" || k === "environment",
              k => /environment/.test(k) && !/patch/.test(k),
              k => k === "k8s.namespace.name",
              k => /patch.*environment/.test(k)
            ]);
            const securityContext = unique(asList(ev["dt.security_context"]).concat(asList(ev["dt.security.context"])));
            const envHit = envCandidates.find(c => envLabel(c.value));
            const ctxHit = securityContext.slice().sort((a, b) => b.split("_").length - a.split("_").length)
              .map(c => ({ ctx: c, label: envLabel(c.split("_").pop()) })).find(c => c.label);
            const environment = envHit
              ? { tag_value: envHit.value, label: envLabel(envHit.value), from: "tag " + envHit.key }
              : ctxHit
                ? { tag_value: ctxHit.ctx, label: ctxHit.label, from: "dt.security_context " + ctxHit.ctx }
                : { tag_value: (envCandidates[0] || {}).value || "", label: DEFAULT_ENVIRONMENT, from: "default" };

            const rootName = (prob.rootCauseEntity && prob.rootCauseEntity.name) || String(ev["root_cause_entity_name"] || "");
            const affectedNames = asList(ev["affected_entity_names"]);
            const affectedTypes = asList(ev["affected_entity_types"]);
            const typeNames = affectedTypes.flatMap(t => asList(ev[t]));
            const entityIds = asList(ev["affected_entity_ids"]);

            // App code: tag first, else the "[CODE.ENV]" prefix of the service name
            const appCodeTag = findByKey(parsed, k => APP_CODE_TAG_KEYS.includes(k));
            const bracket = (String(rootName || affectedNames[0] || "").match(/^\[([^\].]+)/) || [])[1] || "";
            const appCode = appCodeTag || (bracket ? { key: "service name prefix", value: bracket } : null);
            const appName = findByKey(parsed, k => APP_NAME_TAG_KEYS.includes(k));

            const dbType = findByKey(parsed, k => k === "ago_db");
            const domain = findByKey(parsed, k => k === "ago_domain") || findByKey(parsed, k => /domain/.test(k));
            const trigram = findByKey(parsed, k => /trigram/.test(k)) || findByKey(parsed, k => OPCO_TAG_KEYS.includes(k));
            const platform = findByKey(parsed, k => /platform/.test(k));
            const region = findByKey(parsed, k => /region/.test(k));
            const hostTag = findByKey(parsed, k => k === "host");
            const maintTag = findByKey(parsed, k => k === "ago_maintenance");
            const maintField = ev["maintenance.is_under_maintenance"];
            const maintenance = maintField === true || String(maintField).toLowerCase() === "true"
              ? { value: true, from: "event maintenance.is_under_maintenance" }
              : maintTag && maintTag.value.toLowerCase() === "true"
                ? { value: true, from: "tag " + maintTag.key }
                : { value: false, from: maintField !== undefined ? "event maintenance.is_under_maintenance" : "none" };

            const hostName = (hostTag && hostTag.value) || asList(ev["host.name"])[0] || asList(ev["dt.entity.host.name"])[0] || "";
            const hosts = parsed.filter(t => t.key.toLowerCase() === "host" && t.value).map(t => t.value);
            const serviceName = rootName || affectedNames[0] || typeNames[0] || hostName || entityIds[0] || "";
            const props = ((prob.evidenceDetails && prob.evidenceDetails.details) || []).flatMap(d => (d.data && d.data.properties) || []);
            const rateProp = props.find(p => /fail(ure)?.?rate|error.?rate/i.test(String(p.key)));
            let errorRate = rateProp ? String(rateProp.value) : ((String(ev["event.description"] || "").match(/(\d+(\.\d+)?)\s*%/) || [])[1] || "");
            if (errorRate && /^\d+(\.\d+)?$/.test(errorRate)) errorRate = Number(errorRate).toFixed(2) + "%";
            const problemUrl = ev["problem.url"] || ev["event.url"] ||
              (ev["event.id"] ? envUrl + "/ui/apps/dynatrace.davis.problems/problem/" + ev["event.id"] : "");

            // Names usable for CI search: no Dynatrace IDs, no "[CODE.ENV]" prefix, no wildcards
            const ciNames = unique(affectedNames.concat(typeNames, rootName || [])
              .map(n => n.replace(/^\[[^\]]+\]\s*/, ""))
              .filter(n => !/^[A-Z_]+-[0-9A-F]{16}$/.test(n) && !n.includes("*")));

            return {
              usedSample: usedSample,
              problemApi: problemApi,
              dynatrace_alert: {
                service_name: serviceName,
                alerting_profile: asList(ev["labels.alerting_profile"]).join(", "),
                severity: String(ev["event.severity"] || ev["event.category"] || prob.severityLevel || ""),
                event_name: String(ev["event.name"] || prob.title || ""),
                event_description: String(ev["event.description"] || "").slice(0, 1000),
                error_rate: errorRate,
                problem_id: String(ev["display_id"] || prob.displayId || ""),
                problem_url: problemUrl,
                impact_level: asList(ev["dt.davis.impact_level"])[0] || String(prob.impactLevel || ""),
                host: hostName,
                hosts: hosts,
                entity_id: entityIds[0] || String(ev["root_cause_entity_id"] || ""),
                entity_type: affectedTypes[0] || "",
                environment: environment.label,
                environment_tag: environment.tag_value,
                app_code: appCode ? appCode.value : "",
                app_name: appName ? appName.value : "",
                db_type: dbType ? dbType.value : "",
                trigram: trigram ? trigram.value : "",
                platform: platform ? platform.value : "",
                region: region ? region.value : "",
                maintenance: maintenance.value
              },
              snow_inputs: {
                group_candidates: groupCandidates,
                service_tag: serviceTag,
                environment: environment,
                environment_candidates: envCandidates,
                security_context: securityContext,
                maintenance: maintenance,
                app_code: appCode,
                app_name: appName,
                db_type: dbType,
                domain: domain,
                trigram: trigram,
                region: region,
                host: hostName,
                db_or_entity_names: ciNames
              },
              tags: { count: parsed.length, raw: rawTags },
              dt_environment_id: envUrl.replace(/^https?:\/\//, "").split(".")[0],
              event_properties: Object.keys(ev).sort()
                .filter(k => k !== "entity_tags")
                .map(k => ({ key: k, value: fmt(ev[k]).slice(0, 300) }))
            };
          }

    resolve-snow-values:
      name: resolve-snow-values
      description: Read-only SILVA lookups for business service, offering and the final assignment group (GROUP_ORDER).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - extract-event-tags
      conditions:
        states:
          extract-event-tags: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const BASE_URL = "https://silvastg.service-now.com";
          const USERNAME = "Tech_DynatraceJP_WS";
          const PASSWORD = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
          const SERVICE_MAP = {
            // AGPOCLOUDWEBNGINX: "<exact business service name in SILVA>"
          };
          const GROUP_MAP = {
            // AGPOCLOUDWEBNGINX: "<exact assignment group name in SILVA>"
          };
          // Where the final assignment group comes from, first hit wins:
          //   tag        = group tag on the entity (or GROUP_MAP)
          //   enrichment = assignment_group of the business service (servicenow_enrichment)
          //   enrichment_support = support_group of the business service
          //   ci         = support_group of the host / DB CI
          //   default    = DEFAULT_GROUP
          const GROUP_ORDER = ["tag", "enrichment", "enrichment_support", "ci", "default"];
          const DEFAULT_GROUP = "Ops_Middleware_Monitoring_AXAJP";
          const DEFAULT_BUSINESS_SERVICE = "QA Platforms";
          const DEFAULT_SERVICE_OFFERING = "QA Platforms - AXA GROUP OPERATIONS";   // offering name starts with this
          const DEFAULT_ENVIRONMENT_LABEL = "PoC / VoA / Demo";                     // only when the event has no environment
          const DOMAINS = ["axa-id.intraxa", "hk.intraxa", "jp.intraxa", "intraxa"];
          const MIN_SCORE = 5;
          const SERVICE_FIELDS = [
            "sys_id", "name", "number", "category", "service_classification",
            "assignment_group", "support_group", "company", "managed_by",
            "u_bbsa_id", "u_business_range", "business_criticality", "u_cmdb_properties", "comments",
            "operational_status", "sys_class_name", "parent"
          ];
          // service_offering extends cmdb_ci_service, so every business-service query must exclude it
          const NOT_OFFERING = "^sys_class_name!=service_offering";
          const CI_FIELDS = ["sys_id", "name", "fqdn", "sys_class_name", "install_status", "operational_status",
            "company", "support_group", "assignment_group", "service", "business_service"];
          const OFFERING_FIELDS = ["sys_id", "name", "u_environment", "operational_status", "parent"];
          // -------------------------------------

          const headers = {
            Authorization: "Basic " + Buffer.from(USERNAME + ":" + PASSWORD).toString("base64"),
            Accept: "application/json"
          };
          const steps = [];

          async function getRows(label, table, query, fields, limit) {
            const url = BASE_URL + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent(query) +
              "&sysparm_fields=" + fields.join(",") +
              "&sysparm_display_value=all&sysparm_exclude_reference_link=true&sysparm_limit=" + limit;
            let out;
            try {
              const res = await fetch(url, { method: "GET", headers: headers });
              const text = await res.text();
              let json = {};
              try { json = JSON.parse(text); } catch (e) { json = {}; }
              out = { status: res.status, rows: json.result || [], error: res.ok ? "" : text.slice(0, 200) };
            } catch (e) {
              out = { status: 0, rows: [], error: String((e && e.message) || e).slice(0, 200) };
            }
            steps.push({ step: label, table: table, query: query, status: out.status, matches: out.rows.length, error: out.error });
            return out;
          }

          const dv = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].display_value || "") : String((row && row[f]) || "");
          const val = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].value || "") : String((row && row[f]) || "");
          const active = rows => rows.find(r => val(r, "operational_status") === "1" || val(r, "install_status") === "1") || rows[0];
          const isSysId = v => /^[0-9a-f]{32}$/.test(v);
          const has = (text, word) => !!word && String(text).toUpperCase().includes(String(word).toUpperCase());

          async function groupByName(label, name) {
            if (!name) return null;
            const r = await getRows(label, "sys_user_group", "name=" + name + "^active=true", ["sys_id", "name", "active", "company"], 1);
            return r.rows.length
              ? { name: dv(r.rows[0], "name"), sys_id: val(r.rows[0], "sys_id"), company: { name: dv(r.rows[0], "company"), sys_id: val(r.rows[0], "company") } }
              : null;
          }
          async function serviceByName(label, name) {
            const r = await getRows(label, "cmdb_ci_service", "name=" + name + NOT_OFFERING, SERVICE_FIELDS, 10);
            return r.rows.length ? active(r.rows) : null;
          }
          async function serviceById(id) {
            const r = await getRows("service by sys_id", "cmdb_ci_service", "sys_id=" + id, SERVICE_FIELDS, 1);
            return r.rows[0] || null;
          }
          async function findCis(host, names, domains) {
            const found = [];
            const add = row => { if (row && !found.some(f => val(f, "sys_id") === val(row, "sys_id"))) found.push(row); };
            if (host) {
              const full = String(host).toLowerCase();
              const short = full.split(".")[0];
              const q = ["name=" + host, "name=" + full, "name=" + short, "fqdn=" + full]
                .concat(domains.map(d => "fqdn=" + short + "." + d), domains.map(d => "name=" + short + "." + d)).join("^OR");
              let r = await getRows("host by name or fqdn", "cmdb_ci", q, CI_FIELDS, 10);
              if (!r.rows.length) r = await getRows("host starts with", "cmdb_ci",
                "nameSTARTSWITH" + short + ".^ORfqdnSTARTSWITH" + short + ".", CI_FIELDS, 10);
              add(active(r.rows));
            }
            for (const n of names) {
              let r = await getRows("ci exact " + n, "cmdb_ci", "name=" + n, CI_FIELDS, 5);
              if (!r.rows.length) r = await getRows("ci contains " + n, "cmdb_ci", "nameLIKE" + n, CI_FIELDS, 5);
              add(active(r.rows));
            }
            return found.slice(0, 4);
          }
          async function serviceForCi(ci) {
            const own = ["business_service", "service"].find(f => isSysId(val(ci, f)));
            if (own) return { id: val(ci, own), via: "CI " + own + " field" };
            const id = val(ci, "sys_id");
            const a = await getRows("svc_ci_assoc", "svc_ci_assoc", "ci_id=" + id, ["service_id"], 5);
            const sid = a.rows.map(x => val(x, "service_id")).find(Boolean);
            if (sid) return { id: sid, via: "svc_ci_assoc" };
            const rel = await getRows("cmdb_rel_ci", "cmdb_rel_ci", "child=" + id, ["parent", "parent.sys_class_name", "type"], 50);
            const hit = rel.rows.find(x => /service/i.test(val(x, "parent.sys_class_name") || dv(x, "parent.sys_class_name")));
            return hit ? { id: val(hit, "parent"), via: "cmdb_rel_ci (" + dv(hit, "type") + ")" } : null;
          }
          function score(row, t) {
            const name = dv(row, "name");
            const reasons = [];
            let s = 0;
            if (t.groupId && (val(row, "assignment_group") === t.groupId || val(row, "support_group") === t.groupId)) { s += 3; reasons.push("group " + t.groupName); }
            if (has(name, t.appCode)) { s += 3; reasons.push("name has app code " + t.appCode); }
            if (has(name, t.dbType)) { s += 2; reasons.push("name has " + t.dbType); }
            if (has(name, t.envTag)) { s += 2; reasons.push("name has " + t.envTag); }
            if (has(name, t.regionPrefix)) { s += 1; reasons.push("name has " + t.regionPrefix); }
            if (t.trigram && new RegExp("(^|[^A-Z0-9])" + t.trigram + "([^A-Z0-9]|$)", "i").test(name)) { s += 2; reasons.push("name has trigram " + t.trigram); }
            if (val(row, "operational_status") === "1") { s += 1; reasons.push("operational"); }
            if (val(row, "sys_class_name") === "cmdb_ci_service" || /business/i.test(dv(row, "service_classification"))) { s += 1; reasons.push("business service"); }
            return { score: s, reasons: reasons };
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("extract-event-tags");
            const si = p.snow_inputs || {};
            const appCode = si.app_code ? si.app_code.value : "";
            const mapKeys = [appCode, si.trigram && si.trigram.value, si.service_tag && si.service_tag.value]
              .concat(si.db_or_entity_names || []).filter(Boolean);
            const fromMap = map => mapKeys.map(k => map[k] || map[String(k).toUpperCase()]).find(Boolean) || "";

            // ===== 1) Group from GROUP_MAP or tags (the "tag" source) =====
            let tagGroup = null;
            const groupChecks = [];
            const mappedGroup = fromMap(GROUP_MAP);
            if (mappedGroup) {
              const g = await groupByName("group from GROUP_MAP", mappedGroup);
              groupChecks.push({ name: mappedGroup, from: "GROUP_MAP", exists: !!g });
              if (g) tagGroup = Object.assign(g, { from: "GROUP_MAP" });
            }
            for (const c of si.group_candidates || []) {
              if (tagGroup) break;
              const g = await groupByName("group from tag " + c.key, c.value);
              groupChecks.push({ name: c.value, from: "tag " + c.key, exists: !!g });
              if (g) tagGroup = Object.assign(g, { from: "tag " + c.key });
            }
            const firstTag = (si.group_candidates || [])[0];
            if (!tagGroup && firstTag) tagGroup = { name: firstTag.value, sys_id: "", from: "tag " + firstTag.key + " (not verified in SILVA)" };

            // ===== 2) Business service =====
            let service = null;
            let method = "";
            let ranked = [];
            let firstRows = [];
            const t = {
              groupId: tagGroup ? tagGroup.sys_id : "",
              groupName: tagGroup ? tagGroup.name : "",
              appCode: appCode,
              dbType: si.db_type ? si.db_type.value : "",
              envTag: si.environment ? si.environment.tag_value : "",
              regionPrefix: si.region ? si.region.value.replace(/-\d+$/, "") : "",
              trigram: si.trigram ? si.trigram.value : ""
            };

            // A) SERVICE_MAP or service tag
            const wanted = fromMap(SERVICE_MAP) || (si.service_tag && si.service_tag.value) || "";
            if (wanted) {
              service = await serviceByName("service by name", wanted);
              if (service) method = fromMap(SERVICE_MAP) ? "SERVICE_MAP" : "tag " + si.service_tag.key;
            }

            // B) Host / entity / app code CI -> service
            const domains = [si.domain && si.domain.value].concat(DOMAINS).filter((v, i, x) => v && x.indexOf(v) === i);
            const ciNames = (si.db_or_entity_names || []).concat(appCode ? [appCode] : []);
            const cis = await findCis(si.host, ciNames, domains);
            if (!service) {
              for (const ci of cis) {
                const s = await serviceForCi(ci);
                if (s) {
                  service = await serviceById(s.id);
                  if (service) { method = "CI " + dv(ci, "name") + " -> " + s.via; break; }
                }
              }
            }

            // C) Searches, merged and scored
            if (!service) {
              const searches = [];
              if (t.appCode) searches.push(["search 0 by app code", "cmdb_ci_service", "nameLIKE" + t.appCode]);
              if (t.groupId) searches.push(["search 1 by group sys_id", "cmdb_ci_service",
                "assignment_group=" + t.groupId + "^ORsupport_group=" + t.groupId]);
              if (t.dbType && t.envTag) searches.push(["search 2 by db type + environment", "cmdb_ci_service",
                "nameLIKE" + t.dbType + "^nameLIKE" + t.envTag]);
              if (t.dbType && t.regionPrefix) searches.push(["search 3 by db type + region", "cmdb_ci_service",
                "nameLIKE" + t.dbType + "^nameLIKE" + t.regionPrefix]);
              if (t.trigram && t.trigram.length <= 4) searches.push(["search 4 by trigram", "cmdb_ci_service", "nameLIKE" + t.trigram]);
              const pool = {};
              for (const [label, table, q] of searches) {
                const r = await getRows(label, table, q + NOT_OFFERING, SERVICE_FIELDS, 50);
                for (const row of r.rows) {
                  const id = val(row, "sys_id");
                  if (!pool[id]) pool[id] = { row: row, found_by: [] };
                  pool[id].found_by.push(label.split(" by ")[0]);
                }
              }
              ranked = Object.values(pool)
                .map(x => { const sc = score(x.row, t); return { row: x.row, found_by: x.found_by, reasons: sc.reasons, score: sc.score + x.found_by.length - 1 }; })
                .sort((x, y) => y.score - x.score);
              const best = ranked[0];
              const second = ranked[1];
              if (best && best.score >= MIN_SCORE && (!second || best.score > second.score)) {
                service = best.row;
                method = "search (score " + best.score + ": " + best.reasons.join(", ") + ")";
              }
            }

            // D) First answer with known info
            if (!service) {
              const envWords = [si.environment && si.environment.label, si.environment && si.environment.tag_value].filter(Boolean);
              const known = [];
              if (t.appCode) known.push(["first answer by app code", "nameLIKE" + t.appCode]);
              if (tagGroup) known.push(["first answer by assignment group", "assignment_group.nameLIKE" + tagGroup.name]);
              if (tagGroup) known.push(["first answer by support group", "support_group.nameLIKE" + tagGroup.name]);
              if (t.dbType) known.push(["first answer by db type", "nameLIKE" + t.dbType]);
              for (const [label, q] of known) {
                const r = await getRows(label, "cmdb_ci_service", q + NOT_OFFERING, SERVICE_FIELDS, 20);
                if (!r.rows.length) continue;
                firstRows = r.rows;
                const envHit = r.rows.find(x => envWords.some(w => has(dv(x, "name"), w)));
                service = envHit || r.rows[0];
                method = label + (envHit ? " (name matches environment)" : " (first row)");
                break;
              }
            }

            // E) Default business service. Default set = no service AND no group tag.
            const defaultSet = !service && !tagGroup;
            if (!service && DEFAULT_BUSINESS_SERVICE) {
              service = await serviceByName("default business service", DEFAULT_BUSINESS_SERVICE);
              if (service) method = defaultSet ? "default set (DEFAULT_BUSINESS_SERVICE)" : "default (DEFAULT_BUSINESS_SERVICE)";
            }

            let offeringFromService = null;
            if (service && val(service, "sys_class_name") === "service_offering" && val(service, "parent")) {
              const parent = await serviceById(val(service, "parent"));
              if (parent) { offeringFromService = service; service = parent; method += " -> parent of offering"; }
            }

            // The event environment is kept; the default label is used only when the event had none
            let environment = Object.assign({}, si.environment || {});
            if (defaultSet && (!environment.from || environment.from === "default")) {
              environment = { tag_value: environment.tag_value || "", label: DEFAULT_ENVIRONMENT_LABEL, from: "default set" };
            }

            const ci = cis[0] || null;

            // ===== 3) Final assignment group, by GROUP_ORDER =====
            const groupSources = {
              tag: tagGroup,
              enrichment: val(service, "assignment_group")
                ? { name: dv(service, "assignment_group"), sys_id: val(service, "assignment_group"), from: "servicenow_enrichment.assignment_group" } : null,
              enrichment_support: val(service, "support_group")
                ? { name: dv(service, "support_group"), sys_id: val(service, "support_group"), from: "servicenow_enrichment.support_group" } : null,
              ci: val(ci, "support_group")
                ? { name: dv(ci, "support_group"), sys_id: val(ci, "support_group"), from: "CI support group" } : null,
              default: null
            };
            let group = null;
            for (const src of GROUP_ORDER) {
              if (group) break;
              if (src === "default") {
                const g = await groupByName("default group", DEFAULT_GROUP);
                group = { name: DEFAULT_GROUP, sys_id: g ? g.sys_id : "", from: "default (DEFAULT_GROUP)" };
                groupSources.default = group;
              } else if (groupSources[src]) {
                group = groupSources[src];
              }
            }

            // ===== 4) Offering: the service's offering for this environment first =====
            const envLabel = environment.label || "";
            const envMatch = rows => rows.find(o => dv(o, "u_environment") === envLabel) ||
              rows.find(o => envLabel && new RegExp("(^|[^A-Za-z-])" + envLabel.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&") + "([^A-Za-z-]|$)").test(dv(o, "name")));
            let offering = null;
            let offeringFrom = "";
            let offeringCandidates = [];
            if (service) {
              const r = await getRows("offerings of service", "service_offering", "parent=" + val(service, "sys_id"), OFFERING_FIELDS, 50);
              offeringCandidates = r.rows;
              offering = envMatch(r.rows) || null;
              if (offering) offeringFrom = "offering of the business service for " + envLabel;
            }
            if (!offering && offeringFromService) {
              offering = offeringFromService;
              offeringFrom = "offering found by the service search";
            }
            if (!offering && defaultSet) {
              const r = await getRows("default offerings", "service_offering", "nameSTARTSWITH" + DEFAULT_SERVICE_OFFERING, OFFERING_FIELDS, 50);
              offering = envMatch(r.rows) || r.rows[0] || null;
              if (offering) offeringFrom = "default set (DEFAULT_SERVICE_OFFERING" + (envMatch(r.rows) ? ", environment match)" : ", first row - environment NOT matched)");
            }
            if (!offering && offeringCandidates.length) {
              offering = offeringCandidates[0];
              offeringFrom = "first offering of the business service (environment NOT matched)";
            }
            if (!offering && group && group.name) {
              const r = await getRows("first offering by group", "service_offering", "assignment_group.nameLIKE" + group.name, OFFERING_FIELDS, 20);
              offering = envMatch(r.rows) || r.rows[0] || null;
              if (offering) offeringFrom = "first offering by group";
            }

            const company = val(service, "company")
              ? { name: dv(service, "company"), sys_id: val(service, "company"), from: "servicenow_enrichment.company" }
              : val(ci, "company")
                ? { name: dv(ci, "company"), sys_id: val(ci, "company"), from: "CI company" }
                : group && group.company && group.company.sys_id
                  ? { name: group.company.name, sys_id: group.company.sys_id, from: "assignment group company" }
                  : { name: "", sys_id: "", from: "not found (task 3 uses DEFAULT_COMPANY)" };

            const snowRequired = {
              default_set_used: defaultSet,
              assignment_group: { name: group.name, sys_id: group.sys_id, from: group.from },
              business_service: service
                ? { name: dv(service, "name"), sys_id: val(service, "sys_id"), number: dv(service, "number"), from: method }
                : { name: "", sys_id: "", number: "", from: "not found" },
              service_offering: {
                name: dv(offering, "name"), sys_id: val(offering, "sys_id"), environment: dv(offering, "u_environment"),
                parent_id: val(offering, "parent"), from: offering ? offeringFrom : "not found"
              },
              company: company,
              cmdb_ci: { name: dv(ci, "name"), sys_id: val(ci, "sys_id"), class: dv(ci, "sys_class_name"), fqdn: dv(ci, "fqdn") },
              environment: environment
            };

            const enrichment = {
              found: !!service,
              match_method: method || "not found",
              sys_id: val(service, "sys_id"),
              business_service: dv(service, "name"),
              number: dv(service, "number"),
              category: dv(service, "category"),
              service_classification: dv(service, "service_classification"),
              assignment_group: dv(service, "assignment_group"),
              assignment_group_id: val(service, "assignment_group"),
              support_group: dv(service, "support_group"),
              support_group_id: val(service, "support_group"),
              company: dv(service, "company"),
              company_id: val(service, "company"),
              managed_by: val(service, "managed_by"),
              u_bbsa_id: dv(service, "u_bbsa_id"),
              u_business_range: dv(service, "u_business_range"),
              business_criticality: val(service, "business_criticality")
            };

            return {
              snow_required: snowRequired,
              servicenow_enrichment: enrichment,
              group_order: GROUP_ORDER,
              group_sources: groupSources,
              group_checks: groupChecks,
              search_terms: t,
              offering_candidates: offeringCandidates.slice(0, 20).map(o => ({
                name: dv(o, "name"), sys_id: val(o, "sys_id"), environment: dv(o, "u_environment"), status: dv(o, "operational_status")
              })),
              first_answer_rows: firstRows.slice(0, 20).map(x => ({
                name: dv(x, "name"), number: dv(x, "number"), sys_id: val(x, "sys_id"), assignment_group: dv(x, "assignment_group")
              })),
              service_candidates: ranked.slice(0, 10).map(x => ({
                score: x.score, name: dv(x.row, "name"), number: dv(x.row, "number"), sys_id: val(x.row, "sys_id"),
                assignment_group: dv(x.row, "assignment_group"), found_by: x.found_by, reasons: x.reasons
              })),
              cis_found: cis.map(c => ({ name: dv(c, "name"), fqdn: dv(c, "fqdn"), sys_id: val(c, "sys_id"), class: dv(c, "sys_class_name") })),
              steps: steps
            };
          }

    build-payload:
      name: build-payload
      description: Build the SNOW incident body exactly as OPEN would send it (preview only) and show the source of each field.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - resolve-snow-values
      conditions:
        states:
          resolve-snow-values: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit, then copy the same values into OPEN) ----------
          const SHORT_PREFIX = "[DYNATRACE JAPAN]";
          const CALLER = "Dynatrace JP";            // name; task 4 looks up its sys_id
          const CALLER_SYS_ID = "8ddef691fb34cf547b0dfe7b4eefdcbc";        // Dynatrace JP, from INC30340215
          const ON_BEHALF_OF = "Dynatrace JP";
          const ON_BEHALF_OF_SYS_ID = "8ddef691fb34cf547b0dfe7b4eefdcbc";
          const CONTACT_TYPE = "event";
          const HOST_CI_FIELD = "u_configuration_item";   // form label "Configuration item" (task, reference cmdb_ci)
          const DEFAULT_COMPANY = "AXA GROUP OPERATIONS";
          const CATEGORY = "other";
          const SUBCATEGORY = "other";
          const IMPACT = "4";
          const URGENCY = "4";
          const DT_ENVIRONMENT_NAME = "AXA AS STG";
          // SILVA environment label -> stored value of incident.u_environment (task 4 checks it)
          const ENV_VALUE = {};
          // --------------------------------------------------------------------------

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const e = await ex.result("extract-event-tags");
            const s = await ex.result("resolve-snow-values");
            const a = e.dynatrace_alert;
            const req = s.snow_required;
            const en = s.servicenow_enrichment;

            const target = req.cmdb_ci.fqdn || req.cmdb_ci.name || a.service_name.replace(/^\[[^\]]+\]\s*/, "") || a.host;
            const shortDescription = (SHORT_PREFIX + "[" + target + "] - " + a.event_name).slice(0, 160);

            const additional = [
              "problem_displayId: " + a.problem_id,
              "u_external_url: " + (a.problem_url || "<<UNKNOWN>>"),
              "correlation_id: " + a.entity_id,
              "discovered_name: " + a.service_name,
              "dynatrace_severity: " + a.severity,
              "error_rate: " + (a.error_rate || "-"),
              "environmentId: " + e.dt_environment_id,
              "environmentName: " + DT_ENVIRONMENT_NAME,
              "environment: " + req.environment.label + " (" + req.environment.from + ")",
              "app_code: " + (a.app_code || "-"),
              "hosts: " + ((a.hosts || []).join(", ") || a.host || "-"),
              "alerting_profile: " + (a.alerting_profile || "-"),
              "entity_tags: " + e.tags.raw.join(", ")
            ].join("\n");

            const envLabel = req.environment.label || req.service_offering.environment || "";
            const fields = [
              ["caller_id", CALLER_SYS_ID || CALLER, CALLER_SYS_ID ? "setting CALLER_SYS_ID" : "setting CALLER (name)"],
              ["u_on_behalf_of", ON_BEHALF_OF_SYS_ID || ON_BEHALF_OF, ON_BEHALF_OF_SYS_ID ? "setting ON_BEHALF_OF_SYS_ID" : "setting ON_BEHALF_OF (name)"],
              ["contact_type", CONTACT_TYPE, "setting CONTACT_TYPE"],
              ["company", en.company_id || req.company.sys_id || DEFAULT_COMPANY,
                en.company_id ? "servicenow_enrichment.company_id" : req.company.sys_id ? req.company.from : "setting DEFAULT_COMPANY"],
              ["u_environment", ENV_VALUE[envLabel] || envLabel, "environment " + req.environment.from],
              // SILVA form "Business service" = u_business_service, form "Service Offering" = cmdb_ci.
              // business_service and service_offering are labelled "ZZZ-Do-not-use" in SILVA.
              ["u_business_service", en.sys_id || req.business_service.sys_id,
                en.sys_id ? "servicenow_enrichment.sys_id (" + en.match_method + ")" : "not found"],
              ["cmdb_ci", req.service_offering.sys_id, "service offering: " + req.service_offering.from],
              [HOST_CI_FIELD, HOST_CI_FIELD ? req.cmdb_ci.sys_id : "", req.cmdb_ci.sys_id ? "host CI found by host / name" : "none"],
              ["category", CATEGORY, "setting CATEGORY"],
              ["subcategory", SUBCATEGORY, "setting SUBCATEGORY"],
              ["impact", IMPACT, "setting IMPACT"],
              ["urgency", URGENCY, "setting URGENCY"],
              ["assignment_group", req.assignment_group.sys_id || req.assignment_group.name, req.assignment_group.from],
              ["short_description", shortDescription, "SHORT_PREFIX + target + event name"],
              ["description", (a.event_description || a.event_name) + "\n\nAdditional Information:\n" + additional, "event description + additional info"],
              ["correlation_id", a.problem_id, "display_id"]
            ];

            const snowIncident = {};
            for (const [f, v] of fields) if (f && v) snowIncident[f] = v;

            const display = {
              company: en.company_id ? en.company : req.company.name || DEFAULT_COMPANY,
              u_business_service: en.business_service || req.business_service.name,
              cmdb_ci: req.service_offering.name,
              assignment_group: req.assignment_group.name,
              u_environment: envLabel
            };
            if (HOST_CI_FIELD) display[HOST_CI_FIELD] = req.cmdb_ci.name;
            const fieldSources = fields.filter(([f]) => f).map(([f, v, src]) => ({
              field: f,
              value: String(v || "").split("\n")[0].slice(0, 120),
              display_name: display[f] || "",
              source: src
            }));

            const out = {
              note: "PREVIEW ONLY - this test workflow never sends this body",
              snow_incident_payload: snowIncident,
              field_sources: fieldSources,
              servicenow_enrichment: en,
              environment: req.environment,
              default_set_used: req.default_set_used
            };
            console.log(JSON.stringify(out, null, 2));
            return out;
          }

    validate-extraction:
      name: validate-extraction
      description: GET-only checks of every payload value in SILVA. PASS / WARN / FAIL table and a verdict. Sends nothing.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 4
      predecessors:
        - build-payload
      conditions:
        states:
          build-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const BASE_URL = "https://silvastg.service-now.com";
          const USERNAME = "Tech_DynatraceJP_WS";
          const PASSWORD = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
          const REFERENCE_INCIDENT = "INC30340215";   // a known-good incident to compare with
          // Fill in what YOU expect for this problem (display names). Empty = not compared.
          const EXPECTED = {
            assignment_group: "",      // e.g. "AGS_FR_QAS_Service-Managers"
            business_service: "",      // e.g. "QA Platforms"
            service_offering: "",
            company: "",               // e.g. "AXA GROUP OPERATIONS"
            u_environment: ""          // e.g. "Pre-Production"
          };
          const CHOICE_FIELDS = ["u_environment", "category", "subcategory", "impact", "urgency", "contact_type"];
          // -------------------------------------

          const headers = {
            Authorization: "Basic " + Buffer.from(USERNAME + ":" + PASSWORD).toString("base64"),
            Accept: "application/json"
          };
          const calls = [];
          async function getRows(table, query, fields, limit) {
            const url = BASE_URL + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent(query) +
              "&sysparm_fields=" + fields.join(",") +
              "&sysparm_display_value=all&sysparm_exclude_reference_link=true&sysparm_limit=" + (limit || 1);
            try {
              const res = await fetch(url, { method: "GET", headers: headers });
              const text = await res.text();
              let json = {};
              try { json = JSON.parse(text); } catch (e) { json = {}; }
              calls.push({ table: table, query: query, status: res.status, rows: (json.result || []).length });
              return { status: res.status, rows: json.result || [] };
            } catch (e) {
              calls.push({ table: table, query: query, status: 0, error: String((e && e.message) || e).slice(0, 200) });
              return { status: 0, rows: [] };
            }
          }
          const dv = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].display_value || "") : String((row && row[f]) || "");
          const val = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].value || "") : String((row && row[f]) || "");
          const isSysId = v => /^[0-9a-f]{32}$/.test(String(v || ""));
          const same = (x, y) => String(x || "").trim().toLowerCase() === String(y || "").trim().toLowerCase();

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const e = await ex.result("extract-event-tags");
            const s = await ex.result("resolve-snow-values");
            const b = await ex.result("build-payload");
            const a = e.dynatrace_alert;
            const req = s.snow_required;
            const en = s.servicenow_enrichment;
            const pl = b.snow_incident_payload;

            const checks = [];
            const add = (area, field, value, silva, status, note) =>
              checks.push({ status: status, area: area, field: field, value: String(value || "").slice(0, 120), silva: String(silva || "").slice(0, 120), note: note || "" });
            const expect = (field, silvaName) => {
              if (!EXPECTED[field]) return;
              add("expected", field, EXPECTED[field], silvaName, same(EXPECTED[field], silvaName) ? "PASS" : "FAIL",
                same(EXPECTED[field], silvaName) ? "matches EXPECTED" : "differs from EXPECTED");
            };

            // ===== 1) Extraction =====
            add("extract", "problem_id", a.problem_id, "", a.problem_id ? "PASS" : "FAIL", "used as correlation_id and PD dedup_key");
            add("extract", "event_name", a.event_name, "", a.event_name ? "PASS" : "FAIL", "");
            add("extract", "environment", req.environment.label, req.environment.from,
              /default/.test(req.environment.from || "") ? "WARN" : "PASS",
              /default/.test(req.environment.from || "") ? "no environment found in tags or security context" : "taken from the event");
            add("extract", "app_code", a.app_code, (e.snow_inputs.app_code || {}).key, a.app_code ? "PASS" : "WARN", "used to search the business service");
            add("extract", "group tag", (s.group_sources.tag || {}).name, (s.group_sources.tag || {}).from,
              s.group_sources.tag ? "PASS" : "WARN", s.group_sources.tag ? "" : "no group tag on the entity; group comes from " + req.assignment_group.from);
            add("extract", "maintenance", String(a.maintenance), e.snow_inputs.maintenance.from, a.maintenance ? "WARN" : "PASS",
              a.maintenance ? "OPEN would skip this problem" : "");
            add("resolve", "business service method", en.match_method, "", /default/.test(en.match_method) ? "WARN" : "PASS",
              /default/.test(en.match_method) ? "fell back to the default service; add SERVICE_MAP or a service tag" : "");

            // ===== 2) Assignment group =====
            if (isSysId(pl.assignment_group)) {
              const r = await getRows("sys_user_group", "sys_id=" + pl.assignment_group, ["sys_id", "name", "active"], 1);
              const g = r.rows[0];
              add("silva", "assignment_group", pl.assignment_group, g ? dv(g, "name") + " (active " + dv(g, "active") + ")" : "HTTP " + r.status,
                g && val(g, "active") === "true" ? "PASS" : "FAIL", g ? "exists in sys_user_group" : "sys_id not found");
              expect("assignment_group", g ? dv(g, "name") : "");
            } else {
              add("silva", "assignment_group", pl.assignment_group, "", pl.assignment_group ? "WARN" : "FAIL",
                pl.assignment_group ? "sent as a name, not a sys_id" : "empty");
              expect("assignment_group", pl.assignment_group);
            }
            const fromTag = /^tag |^GROUP_MAP/.test(req.assignment_group.from || "");
            add("rule", "assignment_group = servicenow_enrichment", req.assignment_group.name, en.assignment_group,
              fromTag ? "INFO" : (same(req.assignment_group.sys_id, en.assignment_group_id) && en.assignment_group_id ? "PASS" : "FAIL"),
              fromTag ? "group tag wins over enrichment (GROUP_ORDER)" : "payload group must equal the business service assignment group");

            // ===== 3) Business service =====
            if (isSysId(pl.u_business_service)) {
              const r = await getRows("cmdb_ci_service", "sys_id=" + pl.u_business_service, ["sys_id", "name", "number", "assignment_group", "company", "sys_class_name"], 1);
              const sv = r.rows[0];
              add("silva", "u_business_service", pl.u_business_service, sv ? dv(sv, "name") + " " + dv(sv, "number") : "HTTP " + r.status,
                sv && val(sv, "sys_class_name") !== "service_offering" ? "PASS" : "FAIL",
                !sv ? "sys_id not found" : val(sv, "sys_class_name") === "service_offering" ? "this is an offering, not a business service" : "exists in cmdb_ci_service");
              expect("business_service", sv ? dv(sv, "name") : "");
            } else {
              add("silva", "u_business_service", pl.u_business_service, "", "FAIL", "missing or not a sys_id");
            }

            // ===== 4) Service offering (SILVA stores it in cmdb_ci) =====
            if (isSysId(pl.cmdb_ci)) {
              const r = await getRows("service_offering", "sys_id=" + pl.cmdb_ci, ["sys_id", "name", "parent", "u_environment", "operational_status"], 1);
              const o = r.rows[0];
              add("silva", "cmdb_ci (service offering)", pl.cmdb_ci, o ? dv(o, "name") : "HTTP " + r.status, o ? "PASS" : "FAIL", o ? "exists in service_offering" : "not a service_offering sys_id");
              if (o) {
                add("rule", "offering parent = u_business_service", dv(o, "parent"), en.business_service,
                  val(o, "parent") === pl.u_business_service ? "PASS" : "FAIL", "offering must belong to the business service");
                // SILVA offerings have no u_environment field; the environment is part of the name ("... - Production - Silver_...")
                const envInName = !!req.environment.label && dv(o, "name").toLowerCase().includes(req.environment.label.toLowerCase());
                add("rule", "offering name contains incident environment", dv(o, "name"), req.environment.label,
                  envInName ? "PASS" : "WARN", "a " + req.environment.label + " problem should use the " + req.environment.label + " offering");
                add("info", "offering operational status", dv(o, "operational_status"), "", "INFO", "");
              }
              expect("service_offering", o ? dv(o, "name") : "");
            } else {
              add("silva", "cmdb_ci (service offering)", pl.cmdb_ci, "", "FAIL", "missing or not a sys_id");
            }
            if ((s.offering_candidates || []).length) {
              add("info", "offerings of the business service", s.offering_candidates.map(o => o.name || "?").join(" | "), "", "INFO",
                "offerings available under " + en.business_service);
            }

            // ===== 4b) Host CI (form "Configuration item" = u_configuration_item) =====
            if (isSysId(pl.u_configuration_item)) {
              const r = await getRows("cmdb_ci", "sys_id=" + pl.u_configuration_item, ["sys_id", "name", "fqdn", "sys_class_name"], 1);
              const h = r.rows[0];
              add("silva", "u_configuration_item (host)", pl.u_configuration_item, h ? dv(h, "name") + " (" + dv(h, "sys_class_name") + ")" : "HTTP " + r.status,
                h ? "PASS" : "FAIL", h ? "exists in cmdb_ci" : "sys_id not found");
            } else {
              add("silva", "u_configuration_item (host)", pl.u_configuration_item, "", "WARN", "host CI not found; incident will have no Configuration item");
            }

            // ===== 5) Company =====
            if (isSysId(pl.company)) {
              const r = await getRows("core_company", "sys_id=" + pl.company, ["sys_id", "name"], 1);
              const c = r.rows[0];
              add("silva", "company", pl.company, c ? dv(c, "name") : "HTTP " + r.status, c ? "PASS" : (r.status === 403 ? "WARN" : "FAIL"),
                c ? "exists in core_company" : r.status === 403 ? "no read access to core_company" : "sys_id not found");
              add("rule", "company = servicenow_enrichment", pl.company, en.company_id, same(pl.company, en.company_id) ? "PASS" : "FAIL", "");
              expect("company", c ? dv(c, "name") : en.company);
            } else {
              add("silva", "company", pl.company, "", "WARN", "sent as a name; SILVA needs sys_id or sysparm_input_display_value=true");
            }

            // ===== 6) Caller and On Behalf Of (reference to sys_user) =====
            for (const f of ["caller_id", "u_on_behalf_of"]) {
              const v = pl[f];
              if (!v) { add("silva", f, "", "", "WARN", "empty"); continue; }
              const r = await getRows("sys_user", isSysId(v) ? "sys_id=" + v : "name=" + v + "^ORuser_name=" + v, ["sys_id", "name", "user_name", "active"], 2);
              const u = r.rows[0];
              if (isSysId(v)) add("silva", f, v, u ? dv(u, "name") : "HTTP " + r.status, u ? "PASS" : "FAIL", u ? "user exists" : "sys_id not found");
              else add("silva", f, v, u ? "sys_id " + val(u, "sys_id") : "HTTP " + r.status, u ? "WARN" : "FAIL",
                u ? "a name in a reference field is ignored by the Table API; put this sys_id in build-payload settings" : "no sys_user with this name");
            }

            // ===== 7) Choice values =====
            const choices = {};
            for (const f of CHOICE_FIELDS) {
              const r = await getRows("sys_choice", "name=incident^element=" + f + "^inactive=false", ["value", "label", "dependent_value"], 100);
              choices[f] = r.rows.map(x => ({ value: val(x, "value"), label: dv(x, "label"), depends_on: val(x, "dependent_value") }));
              const v = pl[f];
              if (!r.rows.length) {
                add("choice", f, v, "HTTP " + r.status + ", 0 choices", "WARN", "not a choice field or no read access; compare with " + REFERENCE_INCIDENT);
                continue;
              }
              const hit = choices[f].find(c => c.value === v);
              const byLabel = choices[f].find(c => same(c.label, v));
              add("choice", f, v, hit ? hit.label : byLabel ? "label of value " + byLabel.value : "valid: " + choices[f].map(c => c.value).slice(0, 15).join(", "),
                hit ? "PASS" : "FAIL", hit ? "valid stored value" : byLabel ? "this is the label; send value " + byLabel.value : "not a valid value");
              if (f === "u_environment") expect("u_environment", hit ? hit.label : v);
            }

            // ===== 8) Side by side with the reference incident =====
            const refFields = ["caller_id", "u_on_behalf_of", "contact_type", "company", "u_environment", "u_business_service",
              "cmdb_ci", "u_configuration_item", "category", "subcategory", "impact", "urgency", "assignment_group"];
            const rr = await getRows("incident", "number=" + REFERENCE_INCIDENT, refFields, 1);
            const ref = rr.rows[0];
            const reference = refFields.map(f => ({
              field: f,
              reference_value: val(ref, f),
              reference_label: dv(ref, f),
              payload_value: String(pl[f] || ""),
              same_value: !!ref && val(ref, f) === String(pl[f] || "")
            }));

            const count = st => checks.filter(c => c.status === st).length;
            const verdict = count("FAIL") ? "FAIL - " + count("FAIL") + " check(s) failed" : count("WARN") ? "PASS WITH WARNINGS" : "PASS";
            const order = { FAIL: 0, WARN: 1, INFO: 2, PASS: 3 };
            const out = {
              verdict: verdict,
              counts: { fail: count("FAIL"), warn: count("WARN"), pass: count("PASS"), info: count("INFO") },
              used_sample_event: e.usedSample,
              problem_id: a.problem_id,
              checks: checks.slice().sort((x, y) => order[x.status] - order[y.status]),
              reference_incident: { number: REFERENCE_INCIDENT, found: !!ref, fields: reference },
              valid_choices: choices,
              payload_preview: pl,
              silva_calls: calls
            };
            console.log(JSON.stringify(out, null, 2));
            return out;
          }
