# Inventory from screenshots of KTA - TH EMMA PRD → clone targets for STG
reference_dashboard: "KTA - TH EMMA PRD"
reference_owner: "jenne.pang@axa.com"
reference_timeframe: "Last 2 hours"
stg_dashboard_name_options:
  - "KTA - TH EMMA STG"
  - "L1-Health-STG"

sections:
  - name: Overview
    tiles:
      - name: Service health
        type: honeycomb_health
        prd_signal: "All fine ~61"
        stg_action: filter_services_env_stg_or_mz_stg
        maps_to_todo: [1, 5]
      - name: Host health
        type: honeycomb_health
        prd_signal: "All fine ~45"
        stg_action: filter_hosts_env_stg_or_mz_stg
        maps_to_todo: [1, 3]
      - name: Problems
        type: problem_count
        prd_signal: "0 when calm"
        stg_action: filter_problems_stg_only
        maps_to_todo: [2, 10]
      - name: Network status
        type: network_overview
        prd_signal: "talkers/processes/volume + host count"
        stg_action: filter_stg_hosts
        maps_to_todo: [3]

  - name: Mobile
    tiles:
      - name: Mobile app TH EMMA MOBILE
        type: mobile_app
        prd_signal: "Permission denied"
        stg_action: skip_or_retarget_if_stg_rum_exists
        maps_to_todo: []
      - name: User Sessions
        type: rum_sessions
        prd_signal: "0 / no data"
        stg_action: defer_unless_stg_mobile
        maps_to_todo: []
      - name: User by City
        type: rum_geo
        prd_signal: "No data"
        stg_action: defer
        maps_to_todo: []
      - name: Crashes by City
        type: rum_crashes
        prd_signal: "No data"
        stg_action: defer
        maps_to_todo: []
      - name: User Apdex
        type: rum_apdex
        prd_signal: "No data"
        stg_action: defer
        maps_to_todo: []

  - name: Web Services, Requests, Response time and Failures
    tiles:
      - name: Request count
        type: timeseries_stacked
        stg_action: stg_services_plus_synthetic_and_curl
        maps_to_todo: [5, 6]
      - name: Top requests Last 10min
        type: top_list
        stg_action: auto_top_n_filtered_stg
        maps_to_todo: [6]
      - name: Failure rate HTTP 5xx errors
        type: timeseries
        stg_action: inject_controlled_5xx_in_stg
        maps_to_todo: [5, 6, 10]
      - name: Top failure rate Last 10min
        type: top_list
        stg_action: auto_top_n_filtered_stg
        maps_to_todo: [6]
      - name: 99th percent response time
        type: timeseries
        stg_action: slow_stub_in_stg
        maps_to_todo: [5, 6]
      - name: Top latency Last 10min
        type: top_list
        stg_action: auto_top_n_filtered_stg
        maps_to_todo: [6]

  - name: Infrastructure
    tiles:
      - name: Garbage collection time
        type: timeseries
        stg_action: filter_stg_jvm_processes
        maps_to_todo: [4]
      - name: CPU usage percent chart
        type: timeseries
        stg_action: filter_stg_hosts_processes
        maps_to_todo: [3, 4]
      - name: CPU usage percent top lists
        type: top_list
        stg_action: filter_stg_processes
        maps_to_todo: [3, 4]
      - name: Memory used percent last 7 days
        type: timeseries
        stg_action: filter_stg_accept_thin_history_day1
        maps_to_todo: [3]
      - name: Memory used percent current and last 1 min lists
        type: top_list
        stg_action: filter_stg_processes
        maps_to_todo: [3, 4]
      - name: Disk used percent last 7 days
        type: timeseries
        stg_action: filter_stg_hosts
        maps_to_todo: [3]

gaps_not_on_screenshots_add_on_stg:
  - todo: 7
    add: logs_error_exception_tile
  - todo: 8
    add: database_or_stub_health_tiles
  - todo: 9
    add: aws_health_if_in_scope
  - todo: 10
    add: l1_action_markdown_checklist
  - todo: 11
    add: architecture_or_smartscape_link
