# EXTRACT ONLY — Problem ACTIVE → read all event tags → read-only SILVA lookup → display result
# No incident is created in SILVA and nothing is sent to PagerDuty. SILVA is only read (HTTP GET).
# Output (task display-result) has the same shape as correctoutput.sh:
#   { dynatrace_alert: {...}, tags: {...}, servicenow_enrichment: {...}, lookup: {...} }
# Test without a real problem: press Run. With no trigger event the SAMPLE_EVENT below is used.
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com
#   2) Workflow actor needs problems read (optional; used for error rate and extra tags)
#   3) SNOW password is filled in (local copy only — never commit this file)
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem tags extract and SILVA enrichment (read only)
  description: >-
    Reads every tag and key field from the Davis problem event, looks up the business
    service and groups in SILVA with GET calls only, and returns a dynatrace_alert +
    servicenow_enrichment result. No SNOW incident, no PagerDuty.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        event.status_transition == "CREATED"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    extract-event-tags:
      name: extract-event-tags
      description: Parse all entity tags and the main alert fields from the trigger event (plus Problems API if allowed).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';

          // ---------- settings (edit) ----------
          const USE_PROBLEM_API = true;
          // Used only when the workflow is started with Run (no trigger event)
          const SAMPLE_EVENT = {
            "event.kind": "DAVIS_PROBLEM",
            "event.status": "ACTIVE",
            "event.name": "Oracle DB instance down",
            "event.severity": "3",
            "display_id": "P-SAMPLE",
            "dt.davis.impact_level": ["Infrastructure"],
            "labels.alerting_profile": ["Default"],
            "affected_entity_types": ["dt.entity.sql:com_dynatrace_extension_sql-oracle_instance"],
            "affected_entity_ids": ["CUSTOM_DEVICE-C782F52B95F89F6F"],
            "affected_entity_names": [],
            "entity_tags": [
              "AGO_AXAOPCOTRIGRAM_ORACLE:ALJ",
              "AGO_AXAPATCHENVIRONMENT_ORACLE:ACCEPTANCE",
              "AGO_AXAPLATFORM_ORACLE:AWS_IAAS",
              "AGO_CSP_REGION_ORACLE:AP-SOUTHEAST-1",
              "AGO_DB:ORACLE",
              "AGO_DEFAULT_ASSIGNMENT_GROUP:Database_AXAJP",
              "AGO_Maintenance:True",
              "AGO_ORACLE_ASSIGNMENT_GROUP:Database_AXAJP",
              "AGO_ORACLE_DBROLE:PRIMARY",
              "AGO_ORACLE_LOG_MODE:NOARCHIVELOG",
              "AGO_ORACLE_ROLE:PRIMARY_INSTANCE",
              "Test_Maintenance:True",
              "host:deaa310b"
            ]
          };
          // -------------------------------------

          function asList(v) {
            return [].concat(v === undefined || v === null ? [] : v).map(String).filter(s => s !== "");
          }

          // "[Context]KEY:value" or "KEY:value" or "KEY"
          function parseTag(raw) {
            const s = String(raw).trim();
            const ctx = (s.match(/^\[([^\]]+)\]/) || [])[1] || "";
            const x = s.replace(/^\[[^\]]+\]/, "");
            const i = x.indexOf(":");
            return {
              raw: s,
              context: ctx,
              key: i > 0 ? x.slice(0, i).trim() : x.trim(),
              value: i > 0 ? x.slice(i + 1).trim() : ""
            };
          }

          function findByKey(parsed, test) {
            const hit = parsed.find(t => t.value && test(t.key.toLowerCase()));
            return hit ? { key: hit.key, value: hit.value } : null;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const live = ex.event() || {};
            const usedSample = !live["event.kind"] && !live["event.id"];
            const ev = usedSample ? SAMPLE_EVENT : live;

            let prob = {};
            let problemApi = usedSample ? "skipped (sample event)" : (USE_PROBLEM_API ? "ok" : "off");
            if (!usedSample && USE_PROBLEM_API && ev["event.id"]) {
              try {
                prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
              } catch (e) {
                prob = {};
                problemApi = "failed: " + String((e && e.message) || e).slice(0, 200);
              }
            }

            // All tags: event entity_tags first, then problem entity tags
            const rawTags = asList(ev["entity_tags"]);
            for (const t of prob.entityTags || []) {
              const s = t.stringRepresentation || (t.value ? t.key + ":" + t.value : t.key);
              if (s && !rawTags.includes(s)) rawTags.push(s);
            }
            const parsed = rawTags.map(parseTag);

            const byKey = {};
            for (const t of parsed) {
              if (!(t.key in byKey)) byKey[t.key] = t.value;
              else byKey[t.key] = [].concat(byKey[t.key], t.value);
            }
            const agoTags = {};
            const otherTags = {};
            for (const k of Object.keys(byKey).sort()) {
              if (/^ago_/i.test(k)) agoTags[k] = byKey[k]; else otherTags[k] = byKey[k];
            }

            // Hints for SILVA lookup, found by key pattern
            const hints = {
              assignment_group: findByKey(parsed, k => k === "ago_axa_supportgroup") ||
                findByKey(parsed, k => k === "ago_default_assignment_group") ||
                findByKey(parsed, k => /assignment_group$|support_?group$/.test(k)),
              business_service: findByKey(parsed, k =>
                ["snow-service", "ago_axa_businessservice", "business-service", "u_business_service"].includes(k)),
              environment: findByKey(parsed, k => k === "ago_axaenvironmentname") ||
                findByKey(parsed, k => /environment/.test(k)) ||
                findByKey(parsed, k => k === "env"),
              trigram: findByKey(parsed, k => /trigram/.test(k)),
              platform: findByKey(parsed, k => /platform/.test(k)),
              region: findByKey(parsed, k => /region/.test(k)),
              maintenance: findByKey(parsed, k => /maintenance/.test(k)),
              host: findByKey(parsed, k => k === "host")
            };

            // Alert fields like "dynatrace_alert" in correctoutput.sh
            const affectedNames = asList(ev["affected_entity_names"]);
            const affectedTypes = asList(ev["affected_entity_types"]);
            const typeNames = affectedTypes.flatMap(t => asList(ev[t]));
            const rootName = (prob.rootCauseEntity && prob.rootCauseEntity.name) || String(ev["root_cause_entity_name"] || "");
            const affectedFromProblem = (prob.affectedEntities || []).map(e => e.name).filter(Boolean);

            const props = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .flatMap(d => (d.data && d.data.properties) || []);
            const rateProp = props.find(p => /fail(ure)?.?rate|error.?rate/i.test(String(p.key)));
            const rateField = Object.keys(ev).find(k => /fail(ure)?.?rate|error.?rate/i.test(k));
            let errorRate = rateProp ? String(rateProp.value) : (rateField ? String(asList(ev[rateField])[0] || "") : "");
            if (errorRate && /^\d+(\.\d+)?$/.test(errorRate)) errorRate = Number(errorRate).toFixed(2) + "%";

            const dynatraceAlert = {
              service_name: rootName || affectedNames[0] || typeNames[0] || affectedFromProblem[0] ||
                (hints.host && hints.host.value) || asList(ev["affected_entity_ids"])[0] || "",
              alerting_profile: asList(ev["labels.alerting_profile"])[0] || "",
              severity: String(ev["event.severity"] || ev["event.category"] || prob.severityLevel || ""),
              event_name: String(ev["event.name"] || prob.title || ""),
              error_rate: errorRate,
              problem_id: String(ev["display_id"] || prob.displayId || ""),
              impact_level: asList(ev["dt.davis.impact_level"])[0] || String(prob.impactLevel || ""),
              affected_entity_ids: asList(ev["affected_entity_ids"]),
              affected_entity_types: affectedTypes,
              affected_entity_names: affectedNames.concat(typeNames, affectedFromProblem)
                .filter((v, i, a) => v && a.indexOf(v) === i)
            };

            return {
              usedSample: usedSample,
              problemApi: problemApi,
              dynatrace_alert: dynatraceAlert,
              tags: {
                count: parsed.length,
                raw: rawTags,
                ago: agoTags,
                other: otherTags,
                hints: hints
              },
              hostCandidates: [hints.host && hints.host.value]
                .concat(asList(ev["host.name"]), asList(ev["dt.entity.host.name"]))
                .filter((v, i, a) => v && a.indexOf(v) === i),
              ciCandidates: dynatraceAlert.affected_entity_names.concat(rootName || [])
                .filter((v, i, a) => v && a.indexOf(v) === i),
              eventKeys: Object.keys(ev).sort()
            };
          }

    lookup-silva:
      name: lookup-silva
      description: Read-only SILVA lookup (HTTP GET) of the business service and groups for this alert.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - extract-event-tags
      conditions:
        states:
          extract-event-tags: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const ENABLED = true;
          const BASE_URL = "https://silvastg.service-now.com";
          const USERNAME = "Tech_DynatraceJP_WS";
          const PASSWORD = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
          // Optional: tag value (trigram, system) -> exact SILVA business service name
          const SERVICE_MAP = {
            // ALJ: "<exact business service name in SILVA>"
          };
          // Same fields as correctoutput.sh
          const SERVICE_FIELDS = [
            "sys_id", "name", "number", "category", "service_classification",
            "assignment_group", "support_group", "company", "managed_by",
            "u_bbsa_id", "u_business_range", "business_criticality", "u_cmdb_properties", "comments",
            "operational_status"
          ];
          // -------------------------------------

          const headers = {
            Authorization: "Basic " + Buffer.from(USERNAME + ":" + PASSWORD).toString("base64"),
            Accept: "application/json"
          };

          async function getRows(table, query, fields, limit) {
            const url = BASE_URL + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent(query) +
              "&sysparm_fields=" + fields.join(",") +
              "&sysparm_display_value=all&sysparm_exclude_reference_link=true&sysparm_limit=" + limit;
            try {
              const res = await fetch(url, { method: "GET", headers: headers });
              const text = await res.text();
              let json = {};
              try { json = JSON.parse(text); } catch (e) { json = {}; }
              return { status: res.status, rows: json.result || [], error: res.ok ? "" : text.slice(0, 200) };
            } catch (e) {
              return { status: 0, rows: [], error: String((e && e.message) || e).slice(0, 200) };
            }
          }

          // sysparm_display_value=all returns { display_value, value } per field
          const dv = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].display_value || "") : String((row && row[f]) || "");
          const val = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].value || "") : String((row && row[f]) || "");
          const pickActive = rows => rows.find(r => val(r, "operational_status") === "1" || val(r, "install_status") === "1") || rows[0];

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("extract-event-tags");
            const hints = (p.tags && p.tags.hints) || {};
            const steps = [];

            if (!ENABLED) {
              return { found: false, reason: "SILVA lookup disabled", steps: steps };
            }

            let service = null;
            let method = "";

            // 1) Business service tag or SERVICE_MAP (trigram / system tag)
            const mapped = [hints.trigram, hints.business_service]
              .filter(Boolean)
              .map(h => SERVICE_MAP[h.value] || SERVICE_MAP[String(h.value).toUpperCase()])
              .find(Boolean);
            const serviceName = (hints.business_service && hints.business_service.value) || mapped || "";
            if (serviceName) {
              const r = await getRows("cmdb_ci_service", "name=" + serviceName, SERVICE_FIELDS, 10);
              steps.push({ step: "service by name", query: serviceName, status: r.status, matches: r.rows.length, error: r.error });
              if (r.rows.length) { service = pickActive(r.rows); method = hints.business_service ? "tag " + hints.business_service.key : "SERVICE_MAP"; }
            }

            // 2) CI (host tag, host fields, affected entity names) -> svc_ci_assoc -> service
            let ci = null;
            if (!service) {
              const names = [].concat(p.hostCandidates || [], p.ciCandidates || []);
              for (const n of names) {
                const full = String(n).toLowerCase();
                const short = full.split(".")[0];
                const r = await getRows("cmdb_ci",
                  "name=" + full + "^ORname=" + n + "^ORname=" + short + "^ORfqdn=" + full,
                  ["sys_id", "name", "sys_class_name", "install_status", "support_group", "assignment_group"], 5);
                steps.push({ step: "ci by name", query: n, status: r.status, matches: r.rows.length, error: r.error });
                if (r.rows.length) { ci = pickActive(r.rows); break; }
              }
              if (ci) {
                const a = await getRows("svc_ci_assoc", "ci_id=" + val(ci, "sys_id"), ["service_id"], 5);
                steps.push({ step: "svc_ci_assoc", query: dv(ci, "name"), status: a.status, matches: a.rows.length, error: a.error });
                const serviceId = a.rows.map(x => val(x, "service_id")).find(Boolean);
                if (serviceId) {
                  const s = await getRows("cmdb_ci_service", "sys_id=" + serviceId, SERVICE_FIELDS, 1);
                  steps.push({ step: "service by sys_id", query: serviceId, status: s.status, matches: s.rows.length, error: s.error });
                  if (s.rows.length) { service = s.rows[0]; method = "CI " + dv(ci, "name") + " -> svc_ci_assoc"; }
                }
              }
            }

            // 3) Group from the tag, checked in sys_user_group
            let tagGroup = null;
            if (hints.assignment_group) {
              const g = await getRows("sys_user_group", "name=" + hints.assignment_group.value, ["sys_id", "name", "active"], 1);
              steps.push({ step: "group by name", query: hints.assignment_group.value, status: g.status, matches: g.rows.length, error: g.error });
              tagGroup = {
                from_tag: hints.assignment_group.key,
                name: hints.assignment_group.value,
                sys_id: g.rows.length ? val(g.rows[0], "sys_id") : "",
                exists_in_silva: g.rows.length > 0,
                active: g.rows.length ? val(g.rows[0], "active") : ""
              };
            }

            const enrichment = service ? {
              sys_id: val(service, "sys_id"),
              business_service: dv(service, "name"),
              number: dv(service, "number"),
              category: dv(service, "category"),
              service_classification: dv(service, "service_classification"),
              assignment_group: dv(service, "assignment_group"),
              assignment_group_id: val(service, "assignment_group"),
              support_group: dv(service, "support_group"),
              support_group_id: val(service, "support_group"),
              company: dv(service, "company"),
              company_id: val(service, "company"),
              managed_by: val(service, "managed_by"),
              u_bbsa_id: dv(service, "u_bbsa_id"),
              u_business_range: dv(service, "u_business_range"),
              business_criticality: val(service, "business_criticality"),
              u_cmdb_properties: dv(service, "u_cmdb_properties"),
              comments: dv(service, "comments")
            } : {
              found: false,
              reason: "No business service tag, SERVICE_MAP match or CI link in SILVA"
            };

            return {
              found: !!service,
              method: method,
              servicenow_enrichment: enrichment,
              configuration_item: ci ? {
                sys_id: val(ci, "sys_id"),
                name: dv(ci, "name"),
                class: dv(ci, "sys_class_name"),
                support_group: dv(ci, "support_group"),
                assignment_group: dv(ci, "assignment_group")
              } : null,
              tag_assignment_group: tagGroup,
              steps: steps
            };
          }

    display-result:
      name: display-result
      description: Combine event tags and SILVA enrichment into the final output (see task result and log).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - lookup-silva
      conditions:
        states:
          lookup-silva: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const e = await ex.result("extract-event-tags");
            const s = await ex.result("lookup-silva");

            const output = {
              dynatrace_alert: e.dynatrace_alert,
              servicenow_enrichment: s.servicenow_enrichment,
              routing: {
                assignment_group_from_tag: s.tag_assignment_group,
                configuration_item: s.configuration_item,
                environment_tag: e.tags.hints.environment,
                trigram_tag: e.tags.hints.trigram,
                maintenance_tag: e.tags.hints.maintenance
              },
              tags: {
                count: e.tags.count,
                ago: e.tags.ago,
                other: e.tags.other,
                raw: e.tags.raw
              },
              lookup: {
                found: s.found,
                method: s.method,
                steps: s.steps,
                used_sample_event: e.usedSample,
                problem_api: e.problemApi
              }
            };

            console.log(JSON.stringify(output, null, 2));
            return output;
          }
