# WORKING YAML — OPEN
# Achieve Problem-notification-like SNOW push INSIDE the workflow via run-javascript (REST).
# Matches your servicenowstg pic intent:
#   URL: https://silvastg.service-now.com
#   User: Tech_DynatraceJP_WS
#   Message: [{State}] {ProblemID}: Problem {ProblemTitle} {ProblemURL}
#   ITSM: create incident  |  ITOM: create em_event
#
# IMPORTANT:
#   - This does NOT call the Settings "Problem notification" object.
#   - It calls ServiceNow REST the same way (Basic auth + create INC/event).
#   - Turn OFF classic servicenowstg ITSM+ITOM while using this (avoid duplicate INC/events).
#   - Allowlist: silvastg.service-now.com + events.pagerduty.com
#
# BEFORE ACTIVATE: replace __SNOW_PASSWORD__ and __PD_ROUTING_KEY__
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem to SNOW (JS REST like notification) and PagerDuty
  description: >-
    On Problem open, create ServiceNow INC + ITOM event via run-javascript REST
    (same instance/user as servicenowstg), and trigger PagerDuty in parallel.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
        event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-payload:
      name: prepare-payload
      description: Build notification-style message and PD/SNOW fields from Problem.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};

            const title =
              ev["event.name"] ||
              ev["problem.title"] ||
              ev.title ||
              "Dynatrace Problem";
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              "";
            const severity = String(
              ev["problem.severity"] ||
                ev["event.severity"] ||
                ev.severity ||
                "ERROR"
            ).toUpperCase();
            const impactLevel =
              ev["problem.impact"] ||
              ev["event.impact"] ||
              "APPLICATION";

            // Same idea as notification Description template in your pic
            const state = "OPEN";
            const notificationDescription =
              "[" + state + "] " + problemId + ": Problem " + title + " " + problemUrl;

            let pLevel = "P4";
            let pdSeverity = "warning";
            let snowImpact = "3";
            let snowUrgency = "3";
            let emSeverity = "2";
            if (severity.includes("AVAILABILITY") || severity.includes("CRITICAL")) {
              pLevel = "P3";
              pdSeverity = "critical";
              snowImpact = "1";
              snowUrgency = "1";
              emSeverity = "1";
            } else if (severity.includes("ERROR")) {
              pLevel = "P3";
              pdSeverity = "error";
              snowImpact = "2";
              snowUrgency = "2";
              emSeverity = "2";
            }

            return {
              problemId,
              problemUrl,
              problemTitle: title,
              impactLevel,
              severity,
              state,
              notificationDescription,
              pLevel,
              pdSeverity,
              snowImpact,
              snowUrgency,
              emSeverity,
              dedupKey: "dt-problem-" + problemId,
              shortDescription: "[Dynatrace] " + title,
              snowBaseUrl: "https://silvastg.service-now.com",
              snowUsername: "Tech_DynatraceJP_WS"
            };
          }

    create-snow-itsm-and-itom-js:
      name: create-snow-itsm-and-itom-js
      description: >-
        run-javascript REST — create ITSM incident + ITOM em_event
        (notification-like; uses silvastg + Tech_DynatraceJP_WS).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");

            const baseUrl = (p.snowBaseUrl || "https://silvastg.service-now.com").replace(/\/$/, "");
            const username = p.snowUsername || "Tech_DynatraceJP_WS";
            // REQUIRED: replace with real password (prefer a secret store in production)
            const password = "__SNOW_PASSWORD__";
            const auth = basicAuthHeader(username, password);
            const headers = {
              Authorization: auth,
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            // --- ITSM: create Incident (like Send incidents ITSM ON) ---
            const incidentBody = {
              short_description: p.shortDescription,
              description: p.notificationDescription,
              correlation_id: p.problemId,
              impact: p.snowImpact,
              urgency: p.snowUrgency,
              caller_id: username
            };

            const incRes = await fetch(baseUrl + "/api/now/table/incident", {
              method: "POST",
              headers,
              body: JSON.stringify(incidentBody)
            });
            const incText = await incRes.text();
            let incJson = {};
            try { incJson = JSON.parse(incText); } catch (e) { incJson = { raw: incText }; }
            if (!incRes.ok) {
              throw new Error("SNOW ITSM create failed HTTP " + incRes.status + ": " + incText);
            }
            const inc = (incJson.result) || incJson;
            const incidentNumber = inc.number || "";
            const incidentSysId = inc.sys_id || "";

            // --- ITOM: create Event (like Send events ITOM ON) ---
            const eventBody = {
              source: "Dynatrace",
              event_class: "Dynatrace Problem",
              node: p.impactLevel,
              resource: p.problemId,
              type: "PROBLEM",
              severity: String(p.emSeverity),
              description: p.notificationDescription,
              message_key: p.dedupKey,
              additional_info: JSON.stringify({
                problem_id: p.problemId,
                problem_url: p.problemUrl,
                problem_title: p.problemTitle,
                state: p.state,
                severity: p.severity
              })
            };

            const evRes = await fetch(baseUrl + "/api/now/table/em_event", {
              method: "POST",
              headers,
              body: JSON.stringify(eventBody)
            });
            const evText = await evRes.text();
            let evJson = {};
            try { evJson = JSON.parse(evText); } catch (e) { evJson = { raw: evText }; }
            if (!evRes.ok) {
              throw new Error(
                "SNOW ITOM em_event failed HTTP " + evRes.status + ": " + evText +
                " (INC may already exist: " + incidentNumber + ")"
              );
            }

            return {
              incidentNumber,
              incidentSysId,
              incidentRaw: incJson,
              eventSysId: (evJson.result && evJson.result.sys_id) || "",
              eventRaw: evJson,
              correlationId: p.problemId,
              message: p.notificationDescription
            };
          }

    create-pagerduty-incident:
      name: create-pagerduty-incident
      description: Trigger PagerDuty in parallel with SNOW JS REST tasks.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const routingKey = "__PD_ROUTING_KEY__";

            const body = {
              routing_key: routingKey,
              event_action: "trigger",
              dedup_key: p.dedupKey,
              client: "Dynatrace",
              client_url: p.problemUrl,
              payload: {
                summary: p.shortDescription,
                source: "dynatrace",
                severity: p.pdSeverity,
                custom_details: {
                  problem_id: p.problemId,
                  problem_url: p.problemUrl,
                  snow_message: p.notificationDescription
                }
              }
            };

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) throw new Error("PagerDuty failed HTTP " + res.status + ": " + text);
            return { status: json.status, dedupKey: json.dedup_key || p.dedupKey, raw: json };
          }
