# WORKING YAML — CLOSE
# Resolve PagerDuty + resolve SNOW INC found by correlation_id (JS REST)
# Turn OFF classic servicenowstg ITSM while using these workflows (no duplicates)
#
# BEFORE ACTIVATE: same __SNOW_PASSWORD__ and __PD_ROUTING_KEY__ as OPEN
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem closed resolve SNOW (JS REST) and PagerDuty
  description: >-
    On Problem close, resolve ServiceNow INC by correlation_id via run-javascript
    REST and resolve PagerDuty with the same dedup_key.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND
        (event.status == "CLOSED" OR event.status_transition == "RESOLVED" OR
        event.status_transition == "CLOSED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-close-ids:
      name: prepare-close-ids
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              "";
            return {
              problemId,
              problemUrl,
              dedupKey: "dt-problem-" + problemId,
              closeDescription:
                "[RESOLVED] " + problemId + ": Problem closed " + problemUrl,
              snowBaseUrl: "https://silvastg.service-now.com",
              snowUsername: "Tech_DynatraceJP_WS"
            };
          }

    resolve-snow-incident-js:
      name: resolve-snow-incident-js
      description: Find INC by correlation_id and set state Resolved via REST.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-close-ids
      conditions:
        states:
          prepare-close-ids: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-close-ids");

            const baseUrl = (p.snowBaseUrl || "https://silvastg.service-now.com").replace(/\/$/, "");
            const username = p.snowUsername || "Tech_DynatraceJP_WS";
            const password = "__SNOW_PASSWORD__";
            const auth = basicAuthHeader(username, password);
            const headers = {
              Authorization: auth,
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            const q = encodeURIComponent("correlation_id=" + p.problemId);
            const searchUrl =
              baseUrl +
              "/api/now/table/incident?sysparm_query=" +
              q +
              "&sysparm_limit=1&sysparm_fields=number,sys_id,state,correlation_id";

            const searchRes = await fetch(searchUrl, { method: "GET", headers });
            const searchText = await searchRes.text();
            let searchJson = {};
            try { searchJson = JSON.parse(searchText); } catch (e) { searchJson = { raw: searchText }; }
            if (!searchRes.ok) {
              throw new Error("SNOW search failed HTTP " + searchRes.status + ": " + searchText);
            }

            const rows = searchJson.result || [];
            if (!rows.length) {
              return {
                found: false,
                problemId: p.problemId,
                note: "No INC with correlation_id=" + p.problemId
              };
            }

            const row = rows[0];
            const sysId = row.sys_id;
            const patchBody = {
              state: "6",
              close_code: "Solved (Permanently)",
              close_notes: p.closeDescription
            };

            const patchRes = await fetch(baseUrl + "/api/now/table/incident/" + sysId, {
              method: "PATCH",
              headers,
              body: JSON.stringify(patchBody)
            });
            const patchText = await patchRes.text();
            if (!patchRes.ok) {
              throw new Error("SNOW resolve failed HTTP " + patchRes.status + ": " + patchText);
            }

            return {
              found: true,
              number: row.number,
              sysId,
              problemId: p.problemId
            };
          }

    resolve-pagerduty:
      name: resolve-pagerduty
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-close-ids
      conditions:
        states:
          prepare-close-ids: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-close-ids");
            const routingKey = "__PD_ROUTING_KEY__";

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                routing_key: routingKey,
                event_action: "resolve",
                dedup_key: p.dedupKey
              })
            });
            const text = await res.text();
            if (!res.ok) throw new Error("PD resolve failed: " + text);
            return { dedupKey: p.dedupKey, raw: text };
          }
