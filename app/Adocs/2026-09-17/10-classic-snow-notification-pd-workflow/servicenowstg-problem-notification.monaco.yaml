# Monaco / Monitoring as Code — classic Problem notification (matches UI pic)
# Schema: builtin:problem.notifications
# UI: Settings → Integration → Problem notifications → servicenowstg
#
# This is NOT a Workflow ServiceNow Connection.
# ITSM OFF / ITOM ON → ServiceNow events (not rich Workflow INC fields).
#
# BEFORE APPLY:
#   1) Replace __ALERTING_PROFILE_ID__ (Default profile object id)
#   2) Replace __SNOW_PASSWORD__ (or Monaco secret)
#   3) Allowlist: silvastg.service-now.com

configs:
  - id: problem-notification-servicenowstg
    type:
      settings:
        schema: builtin:problem.notifications
        scope: environment
    config:
      template: servicenowstg-problem-notification.template.json
      parameters:
        alertingProfile:
          type: value
          value: "__ALERTING_PROFILE_ID__"
        snowPassword:
          type: value
          value: "__SNOW_PASSWORD__"
