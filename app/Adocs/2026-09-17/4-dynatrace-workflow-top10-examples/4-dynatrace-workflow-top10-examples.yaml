# Dynatrace Workflow Top 10 — compact syntax snippets
# Prefer full guide: 4-dynatrace-workflow-top10-examples.md
# Upload real workflows as complete single-workflow YAML files (one workflow per file).

# ----- 1) Hello (schedule + JS) -----
# title: Example 01 - Hello Workflow
# trigger.schedule.rule: "0 * * * *"
# task hello: dynatrace.automations:run-javascript
#   return { message: "hello from dynatrace workflow" }

# ----- 2) Problem OPEN filterQuery -----
# event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
# (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
#  event.status_transition == "REOPENED")

# ----- 3) Problem CLOSED filterQuery -----
# event.kind == "DAVIS_PROBLEM" AND
# (event.status == "CLOSED" OR event.status_transition == "RESOLVED" OR
#  event.status_transition == "CLOSED")

# ----- 4) Tag restrict (example) -----
# entityTags:
#   env: ["prod"]

# ----- 5) Prepare JS keys -----
# problemId, title, dedupKey = "dt-problem-" + problemId, problemUrl

# ----- 6) HTTP via fetch -----
# await fetch("https://HOST/path", { method: "POST", headers: {...}, body: JSON.stringify(...) })
# Allowlist HOST in Settings → External requests

# ----- 7) Parallel -----
# both tasks predecessors: [prepare-payload]
# positions: snow x:0 y:2 , pd x:1 y:2

# ----- 8) Join -----
# predecessors: [create-snow, create-pd]
# conditions.states both OK

# ----- 9) ServiceNow action -----
# action: dynatrace.servicenow:snow-create-incident
# metadata.inputs connection → connectionId
# correlationId: '{{ result("prepare-payload").problemId }}'

# ----- 10) PagerDuty -----
# POST https://events.pagerduty.com/v2/enqueue
# open:  event_action = "trigger"
# close: event_action = "resolve"
# same dedup_key both sides

# ===== Full minimal OPEN workflow (uploadable sketch) =====
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: Example 02 - Problem Open Prepare Only
  description: Top10 sample — Problem open → prepare payload (extend with PD/SNOW)
  schemaVersion: 3
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
        event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  tasks:
    prepare-payload:
      name: prepare-payload
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              "unknown";
            const title =
              ev["event.name"] ||
              ev["problem.title"] ||
              "Dynatrace Problem";
            return {
              problemId,
              title,
              dedupKey: "dt-problem-" + problemId,
              problemUrl: ev["problem.url"] || ev["event.url"] || ""
            };
          }
