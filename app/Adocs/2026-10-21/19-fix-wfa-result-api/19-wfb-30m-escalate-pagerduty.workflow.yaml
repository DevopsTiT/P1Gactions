# FIXED SDK usage:
#   - Previous task: import { result } + await result("task-name")
#   - NOT: const ex = execution(); await ex.result("task-name")
#   - Trigger event: const ex = await execution(); const event = ex.event() || {}
# WF-B (replacement companion): still Active 30m → preview PD → trigger PD → optional Slack webhook note
# TEMPLATE — no secrets.
# After import:
#   1) Trigger UI: Minimum duration = 30 minutes
#   2) Set PD_ROUTING_KEY in preview-pagerduty AND trigger-pagerduty (Dynatrace UI only)
#   3) Keep DRY_RUN = true until preview looks right
#   4) Optional: set SLACK_WEBHOOK_URL in notify-slack-webhook for a chat note after page
#   5) Allowlist events.pagerduty.com (and hooks.slack.com if you enable Slack note)
# Never commit routing keys or webhook URLs.
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: WF-B 30m escalate PagerDuty plus optional Slack webhook (fixed result API)
  description: >-
    After the problem has been Active long enough (set Minimum duration 30m in UI),
    preview then POST PagerDuty Events API v2 once (dedup_key dynatrace-<problem_id>).
    Optionally POST a short note to Slack Incoming Webhook. DRY_RUN skips real posts.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: false
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: false
          entityTags: {}
          onProblemClose: false
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 200
  tasks:
    extract-problem:
      name: extract-problem
      description: Read problem fields for PD payload.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          export default async function () {
            const ex = await execution();
            const event = (typeof ex.event === "function" ? ex.event() : null) || {};
            const envUrl = (getEnvironmentUrl() || "").replace(/\/$/, "");
            const problemId =
              event.display_id ||
              event["display_id"] ||
              "UNKNOWN";
            const title =
              event["event.name"] ||
              "Dynatrace problem still open";
            const description =
              event["event.description"] ||
              "";
            const problemUrl = envUrl
              ? `${envUrl}/ui/problems/${encodeURIComponent(problemId)}`
              : "";
            return {
              problem_id: String(problemId),
              title: String(title).slice(0, 200),
              description: String(description).slice(0, 2000),
              problem_url: problemUrl,
              still_active: String(event["event.status"] || "").toUpperCase() === "ACTIVE"
            };
          }
    preview-pagerduty:
      name: preview-pagerduty
      description: Build Events API v2 body; hide routing key; decide ready.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - extract-problem
      input:
        script: |
          import { result } from '@dynatrace-sdk/automation-utils';

          // ----- settings (edit in Dynatrace UI only) -----
          const DRY_RUN = true;
          const PD_ROUTING_KEY = "";

          export default async function () {
            const p = await result("extract-problem");
            const problems = [];
            if (!p.still_active) problems.push("problem_not_active");
            if (!p.problem_id || p.problem_id === "UNKNOWN") problems.push("missing_problem_id");
            if (!PD_ROUTING_KEY) problems.push("missing_PD_ROUTING_KEY_set_in_Dynatrace_UI");

            const dedupKey = `dynatrace-${p.problem_id}`;
            const payload = {
              routing_key: PD_ROUTING_KEY ? "***REDACTED***" : "",
              event_action: "trigger",
              dedup_key: dedupKey,
              payload: {
                summary: `[DT 30m] ${p.title}`.slice(0, 1024),
                severity: "error",
                source: "dynatrace",
                custom_details: {
                  problem_id: p.problem_id,
                  problem_url: p.problem_url,
                  description: p.description,
                  reason: "Still Active after configured minimum duration (set 30m on trigger)"
                }
              }
            };

            return {
              ready: problems.length === 0,
              dry_run: DRY_RUN,
              problems,
              dedup_key: dedupKey,
              preview: payload,
              has_routing_key: Boolean(PD_ROUTING_KEY)
            };
          }
    trigger-pagerduty:
      name: trigger-pagerduty
      description: POST to events.pagerduty.com/v2/enqueue when preview ready and DRY_RUN is false.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - preview-pagerduty
      input:
        script: |
          import { result } from '@dynatrace-sdk/automation-utils';
          import { httpClient } from '@dynatrace-sdk/http-client';

          // ----- settings (must match preview-pagerduty) -----
          const DRY_RUN = true;
          const PD_ROUTING_KEY = "";
          const PD_URL = "https://events.pagerduty.com/v2/enqueue";

          export default async function () {
            const prev = await result("preview-pagerduty");
            const p = await result("extract-problem");

            if (!prev.ready) {
              return { skipped: true, reason: "preview_not_ready", problems: prev.problems };
            }
            if (DRY_RUN) {
              return {
                skipped: true,
                reason: "DRY_RUN_true",
                would_post_dedup_key: prev.dedup_key,
                preview: prev.preview
              };
            }
            if (!PD_ROUTING_KEY) {
              return { skipped: true, reason: "missing_PD_ROUTING_KEY" };
            }

            const body = {
              routing_key: PD_ROUTING_KEY,
              event_action: "trigger",
              dedup_key: prev.dedup_key,
              payload: {
                summary: `[DT 30m] ${p.title}`.slice(0, 1024),
                severity: "error",
                source: "dynatrace",
                custom_details: {
                  problem_id: p.problem_id,
                  problem_url: p.problem_url,
                  description: p.description,
                  reason: "Still Active after 30m minimum duration"
                }
              }
            };

            const res = await httpClient.fetch(PD_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            return {
              skipped: false,
              status: res.status,
              dedup_key: prev.dedup_key,
              response: text.slice(0, 2000)
            };
          }
    notify-slack-webhook:
      name: notify-slack-webhook
      description: Optional short Slack note after PD step. Skips if URL empty or DRY_RUN true.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 4
      predecessors:
        - trigger-pagerduty
      input:
        script: |
          import { result } from '@dynatrace-sdk/automation-utils';
          import { httpClient } from '@dynatrace-sdk/http-client';

          // ----- settings (edit in Dynatrace UI only — never commit) -----
          const DRY_RUN = true;
          const SLACK_WEBHOOK_URL = "";

          export default async function () {
            const p = await result("extract-problem");
            const pd = await result("trigger-pagerduty");
            const prev = await result("preview-pagerduty");

            if (!SLACK_WEBHOOK_URL) {
              return { skipped: true, reason: "SLACK_WEBHOOK_URL_empty_optional" };
            }
            if (DRY_RUN) {
              return {
                skipped: true,
                reason: "DRY_RUN_true",
                would_text: `[WF-B] Paged / would page for ${p.problem_id}: ${p.title}\n${p.problem_url}\ndedup=${prev.dedup_key}\npd_step=${pd.reason || pd.status || "ok"}`
              };
            }

            const text =
              `[WF-B] PagerDuty escalate for ${p.problem_id}\n` +
              `${p.title}\n${p.problem_url}\n` +
              `dedup_key=${prev.dedup_key}\n` +
              `pd_status=${pd.skipped ? pd.reason : pd.status}`;

            const res = await httpClient.fetch(SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: text.slice(0, 3500) })
            });
            const body = await res.text();
            return {
              skipped: false,
              status: res.status,
              ok: res.ok || body.trim() === "ok",
              response: body.slice(0, 500)
            };
          }
