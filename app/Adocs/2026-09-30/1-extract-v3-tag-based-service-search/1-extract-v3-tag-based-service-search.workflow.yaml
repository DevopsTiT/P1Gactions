# EXTRACT v3 — Problem ACTIVE → all tags → SILVA search built from the tags (read only) → output like correctoutput.sh
# Nothing is sent. The result carries the SILVA incident body and PagerDuty event body as a preview.
# v3 uses the query style that worked in query.sh:
#   host:     cmdb_ci name=<host> ^OR fqdn=<host>.<domain>   (fields include service, business_service)
#   search 1: cmdb_ci_service assignment_group.nameLIKE<group tag>
#   search 2: cmdb_ci_service nameLIKE<db type> ^ nameLIKE<environment tag>
#   search 3: cmdb_ci_service nameLIKE<db type> ^ nameLIKE<region prefix>
#   search 4: cmdb_ci_service nameLIKE<trigram>
#   search 5: cmdb_ci_service_technical nameLIKE<db type> ^ nameLIKE<environment tag>
# All search results are merged and scored against the tags; the best one wins if it is clear.
# Test without a real problem: press Run (SAMPLE_EVENT = your Oracle event).
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com
#   2) Workflow Settings → Authorization: add environment-api:problems:read
#   3) SNOW password is filled in (local copy only — never commit this file)
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem tags extract and SILVA enrichment v3 (tag-based search, read only)
  description: >-
    Reads every tag from the Davis problem event, searches SILVA with GET calls built from the
    tags (host, assignment group, DB type + environment, DB type + region, trigram), scores the
    services found, and returns dynatrace_alert + servicenow_enrichment plus SNOW and PagerDuty
    payload previews. Nothing is posted.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        event.status_transition == "CREATED"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    extract-event-tags:
      name: extract-event-tags
      description: Parse all entity tags and the main alert fields from the trigger event (plus Problems API if allowed).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- settings (edit) ----------
          const USE_PROBLEM_API = true;
          // Tag value (lower case) -> SILVA environment label. Check "acceptance" with your SILVA team.
          const ENVIRONMENT = {
            production: "Production", prod: "Production", prd: "Production",
            development: "Development", dev: "Development",
            "integration-test": "Integration / Test", "integration / test": "Integration / Test",
            integration: "Integration / Test", test: "Integration / Test", tst: "Integration / Test",
            acceptance: "Integration / Test", acc: "Integration / Test", uat: "Integration / Test"
          };
          const DEFAULT_ENVIRONMENT = "Development";
          // Used only when the workflow is started with Run (no trigger event)
          const SAMPLE_EVENT = {
            "event.kind": "DAVIS_PROBLEM",
            "event.status": "ACTIVE",
            "event.name": "Oracle DB Instance down",
            "event.severity": "3",
            "display_id": "P-SAMPLE",
            "dt.davis.impact_level": ["Infrastructure"],
            "labels.alerting_profile": ["Default"],
            "affected_entity_types": ["dt.entity.sql:com_dynatrace_extension_sql-oracle_instance"],
            "dt.entity.sql:com_dynatrace_extension_sql-oracle_instance": ["DEA10B01"],
            "affected_entity_ids": ["CUSTOM_DEVICE-C782F52B95F89F6F"],
            "affected_entity_names": [],
            "entity_tags": [
              "AGO_AXAOPCOTRIGRAM_ORACLE:ALJ",
              "AGO_AXAPATCHENVIRONMENT_ORACLE:ACCEPTANCE",
              "AGO_AXAPLATFORM_ORACLE:AWS_IAAS",
              "AGO_CSP_REGION_ORACLE:AP-SOUTHEAST-1",
              "AGO_DB:ORACLE",
              "AGO_DEFAULT_ASSIGNMENT_GROUP:Database_AXAJP",
              "AGO_Maintenance:True",
              "AGO_ORACLE_ASSIGNMENT_GROUP:Database_AXAJP",
              "AGO_ORACLE_DBROLE:PRIMARY",
              "AGO_ORACLE_LOG_MODE:NOARCHIVELOG",
              "AGO_ORACLE_ROLE:PRIMARY_INSTANCE",
              "Test_Maintenance:True",
              "host:deaa310b"
            ]
          };
          // -------------------------------------

          function asList(v) {
            return [].concat(v === undefined || v === null ? [] : v).map(String).filter(s => s !== "");
          }
          const unique = a => a.filter((v, i) => v && a.indexOf(v) === i);

          // "[Context]KEY:value" or "KEY:value" or "KEY"
          function parseTag(raw) {
            const s = String(raw).trim();
            const ctx = (s.match(/^\[([^\]]+)\]/) || [])[1] || "";
            const x = s.replace(/^\[[^\]]+\]/, "");
            const i = x.indexOf(":");
            return {
              raw: s,
              context: ctx,
              key: i > 0 ? x.slice(0, i).trim() : x.trim(),
              value: i > 0 ? x.slice(i + 1).trim() : ""
            };
          }

          function findByKey(parsed, test) {
            const hit = parsed.find(t => t.value && test(t.key.toLowerCase()));
            return hit ? { key: hit.key, value: hit.value } : null;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const live = ex.event() || {};
            const usedSample = !live["event.kind"] && !live["event.id"];
            const ev = usedSample ? SAMPLE_EVENT : live;
            const envUrl = getEnvironmentUrl().replace(/\/$/, "");

            let prob = {};
            let problemApi = usedSample ? "skipped (sample event)" : (USE_PROBLEM_API ? "ok" : "off");
            if (!usedSample && USE_PROBLEM_API && ev["event.id"]) {
              try {
                prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
              } catch (e) {
                prob = {};
                problemApi = "failed: " + String((e && e.message) || e).slice(0, 200);
              }
            }

            const rawTags = asList(ev["entity_tags"]);
            for (const t of prob.entityTags || []) {
              const s = t.stringRepresentation || (t.value ? t.key + ":" + t.value : t.key);
              if (s && !rawTags.includes(s)) rawTags.push(s);
            }
            const parsed = rawTags.map(parseTag);

            const byKey = {};
            for (const t of parsed) {
              if (!(t.key in byKey)) byKey[t.key] = t.value;
              else byKey[t.key] = [].concat(byKey[t.key], t.value);
            }
            const agoTags = {};
            const otherTags = {};
            for (const k of Object.keys(byKey).sort()) {
              if (/^ago_/i.test(k)) agoTags[k] = byKey[k]; else otherTags[k] = byKey[k];
            }

            const hints = {
              assignment_group: findByKey(parsed, k => k === "ago_axa_supportgroup") ||
                findByKey(parsed, k => k === "ago_default_assignment_group") ||
                findByKey(parsed, k => /assignment_group$|support_?group$/.test(k)),
              business_service: findByKey(parsed, k =>
                ["snow-service", "ago_axa_businessservice", "business-service", "u_business_service"].includes(k)),
              environment: findByKey(parsed, k => k === "ago_axaenvironmentname") ||
                findByKey(parsed, k => /environment/.test(k)) ||
                findByKey(parsed, k => k === "env"),
              db_type: findByKey(parsed, k => k === "ago_db") || findByKey(parsed, k => /^ago_db(type)?$|database_?type/.test(k)),
              domain: findByKey(parsed, k => k === "ago_domain") || findByKey(parsed, k => /domain/.test(k)),
              trigram: findByKey(parsed, k => /trigram/.test(k)),
              platform: findByKey(parsed, k => /platform/.test(k)),
              region: findByKey(parsed, k => /region/.test(k)),
              maintenance: findByKey(parsed, k => /^ago_maintenance$/.test(k)) || findByKey(parsed, k => /maintenance/.test(k)),
              host: findByKey(parsed, k => k === "host")
            };

            const affectedNames = asList(ev["affected_entity_names"]);
            const affectedTypes = asList(ev["affected_entity_types"]);
            const typeNames = affectedTypes.flatMap(t => asList(ev[t]));
            const rootName = (prob.rootCauseEntity && prob.rootCauseEntity.name) || String(ev["root_cause_entity_name"] || "");
            const affectedFromProblem = (prob.affectedEntities || []).map(e => e.name).filter(Boolean);
            const entityIds = asList(ev["affected_entity_ids"]);

            const props = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .flatMap(d => (d.data && d.data.properties) || []);
            const rateProp = props.find(p => /fail(ure)?.?rate|error.?rate/i.test(String(p.key)));
            const rateField = Object.keys(ev).find(k => /fail(ure)?.?rate|error.?rate/i.test(k));
            let errorRate = rateProp ? String(rateProp.value) : (rateField ? String(asList(ev[rateField])[0] || "") : "");
            if (errorRate && /^\d+(\.\d+)?$/.test(errorRate)) errorRate = Number(errorRate).toFixed(2) + "%";

            const envValue = hints.environment ? hints.environment.value : "";
            const envLabel = ENVIRONMENT[envValue.toLowerCase()] || DEFAULT_ENVIRONMENT;
            const hostName = (hints.host && hints.host.value) || asList(ev["host.name"])[0] || asList(ev["dt.entity.host.name"])[0] || "";
            const serviceName = rootName || affectedNames[0] || typeNames[0] || affectedFromProblem[0] || hostName || entityIds[0] || "";
            const problemUrl = ev["problem.url"] || ev["event.url"] ||
              (ev["event.id"] ? envUrl + "/ui/apps/dynatrace.davis.problems/problem/" + ev["event.id"] : "");

            const dynatraceAlert = {
              service_name: serviceName,
              alerting_profile: asList(ev["labels.alerting_profile"])[0] || "",
              severity: String(ev["event.severity"] || ev["event.category"] || prob.severityLevel || ""),
              event_name: String(ev["event.name"] || prob.title || ""),
              error_rate: errorRate,
              problem_id: String(ev["display_id"] || prob.displayId || ""),
              problem_url: problemUrl,
              impact_level: asList(ev["dt.davis.impact_level"])[0] || String(prob.impactLevel || ""),
              host: hostName,
              entity_id: entityIds[0] || "",
              entity_type: affectedTypes[0] || "",
              environment_tag: envValue,
              environment: envLabel,
              db_type: hints.db_type ? hints.db_type.value : "",
              trigram: hints.trigram ? hints.trigram.value : "",
              platform: hints.platform ? hints.platform.value : "",
              region: hints.region ? hints.region.value : "",
              maintenance: hints.maintenance ? String(hints.maintenance.value).toLowerCase() === "true" : false,
              affected_entity_ids: entityIds,
              affected_entity_types: affectedTypes,
              affected_entity_names: unique(affectedNames.concat(typeNames, affectedFromProblem))
            };

            return {
              usedSample: usedSample,
              problemApi: problemApi,
              dynatrace_alert: dynatraceAlert,
              tags: { count: parsed.length, raw: rawTags, ago: agoTags, other: otherTags, hints: hints },
              hostCandidates: unique([hostName].concat(asList(ev["host.name"]), asList(ev["dt.entity.host.name"]))),
              // Dynatrace ids like CUSTOM_DEVICE-C782F52B95F89F6F never exist in SILVA
              ciCandidates: unique(dynatraceAlert.affected_entity_names.concat(rootName || []))
                .filter(n => !/^[A-Z_]+-[0-9A-F]{16}$/.test(n)),
              eventKeys: Object.keys(ev).sort()
            };
          }

    lookup-silva:
      name: lookup-silva
      description: Read-only SILVA search built from the tags (host, group, DB type + env, DB type + region, trigram), scored.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - extract-event-tags
      conditions:
        states:
          extract-event-tags: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit) ----------
          const ENABLED = true;
          const BASE_URL = "https://silvastg.service-now.com";
          const USERNAME = "Tech_DynatraceJP_WS";
          const PASSWORD = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
          // Tag value (trigram, system) -> exact SILVA business service name. Wins over every search.
          const SERVICE_MAP = {
            // ALJ: "<exact business service name in SILVA>"
          };
          // Domains tried for fqdn=<host>.<domain> (the AGO_DOMAIN tag is tried first)
          const DOMAINS = ["axa-id.intraxa", "hk.intraxa", "jp.intraxa", "intraxa"];
          // Best candidate must reach this score and beat the second one
          const MIN_SCORE = 5;
          const SERVICE_FIELDS = [
            "sys_id", "name", "number", "category", "service_classification",
            "assignment_group", "support_group", "company", "managed_by",
            "u_bbsa_id", "u_business_range", "business_criticality", "u_cmdb_properties", "comments",
            "operational_status", "sys_class_name"
          ];
          // service / business_service exist on SILVA CIs (query.sh); missing fields are simply not returned
          const CI_FIELDS = ["sys_id", "name", "fqdn", "sys_class_name", "install_status", "operational_status",
            "company", "support_group", "assignment_group", "service", "business_service"];
          // -------------------------------------

          const headers = {
            Authorization: "Basic " + Buffer.from(USERNAME + ":" + PASSWORD).toString("base64"),
            Accept: "application/json"
          };
          const steps = [];

          async function getRows(label, table, query, fields, limit) {
            const url = BASE_URL + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent(query) +
              "&sysparm_fields=" + fields.join(",") +
              "&sysparm_display_value=all&sysparm_exclude_reference_link=true&sysparm_limit=" + limit;
            let out;
            try {
              const res = await fetch(url, { method: "GET", headers: headers });
              const text = await res.text();
              let json = {};
              try { json = JSON.parse(text); } catch (e) { json = {}; }
              out = { status: res.status, rows: json.result || [], error: res.ok ? "" : text.slice(0, 200) };
            } catch (e) {
              out = { status: 0, rows: [], error: String((e && e.message) || e).slice(0, 200) };
            }
            steps.push({ step: label, table: table, query: query, status: out.status, matches: out.rows.length, error: out.error });
            return out;
          }

          // sysparm_display_value=all returns { display_value, value } per field
          const dv = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].display_value || "") : String((row && row[f]) || "");
          const val = (row, f) => (row && row[f] && typeof row[f] === "object") ? String(row[f].value || "") : String((row && row[f]) || "");
          const active = rows => rows.find(r => val(r, "operational_status") === "1" || val(r, "install_status") === "1") || rows[0];

          async function serviceById(id, label) {
            const r = await getRows(label, "cmdb_ci_service", "sys_id=" + id, SERVICE_FIELDS, 1);
            return r.rows[0] || null;
          }

          // Host: name / fqdn with each domain, then "starts with host."; DB names: exact, then contains
          async function findCis(hosts, names, domains) {
            const found = [];
            const add = row => { if (row && !found.some(f => val(f, "sys_id") === val(row, "sys_id"))) found.push(row); };
            for (const h of hosts) {
              const full = String(h).toLowerCase();
              const short = full.split(".")[0];
              const q = ["name=" + h, "name=" + full, "name=" + short, "fqdn=" + full]
                .concat(domains.map(d => "fqdn=" + short + "." + d), domains.map(d => "name=" + short + "." + d))
                .join("^OR");
              let r = await getRows("host by name or fqdn", "cmdb_ci", q, CI_FIELDS, 10);
              if (!r.rows.length) {
                r = await getRows("host starts with", "cmdb_ci",
                  "nameSTARTSWITH" + short + ".^ORfqdnSTARTSWITH" + short + ".", CI_FIELDS, 10);
              }
              add(active(r.rows));
            }
            for (const n of names) {
              let r = await getRows("ci name exact", "cmdb_ci", "name=" + n, CI_FIELDS, 5);
              if (!r.rows.length) r = await getRows("ci name contains", "cmdb_ci", "nameLIKE" + n, CI_FIELDS, 5);
              add(active(r.rows));
            }
            return found.slice(0, 4);
          }

          // CI -> service: its own business_service / service field, then svc_ci_assoc, then cmdb_rel_ci
          async function serviceForCi(ci) {
            const isSysId = v => /^[0-9a-f]{32}$/.test(v);
            const ownField = ["business_service", "service"].find(f => isSysId(val(ci, f)));
            if (ownField) return { id: val(ci, ownField), via: "CI " + ownField + " field" };
            const id = val(ci, "sys_id");
            const a = await getRows("svc_ci_assoc", "svc_ci_assoc", "ci_id=" + id, ["service_id"], 5);
            const sid = a.rows.map(x => val(x, "service_id")).find(Boolean);
            if (sid) return { id: sid, via: "svc_ci_assoc" };
            const rel = await getRows("cmdb_rel_ci", "cmdb_rel_ci", "child=" + id,
              ["parent", "parent.sys_class_name", "type"], 50);
            const hit = rel.rows.find(x => /service/i.test(val(x, "parent.sys_class_name") || dv(x, "parent.sys_class_name")));
            if (hit) return { id: val(hit, "parent"), via: "cmdb_rel_ci (" + dv(hit, "type") + ")" };
            return null;
          }

          const has = (text, word) => !!word && String(text).toUpperCase().includes(String(word).toUpperCase());

          function score(row, t) {
            const name = dv(row, "name");
            const reasons = [];
            let s = 0;
            if (t.group && (dv(row, "assignment_group").toUpperCase() === t.group.toUpperCase() ||
                dv(row, "support_group").toUpperCase() === t.group.toUpperCase())) { s += 3; reasons.push("group " + t.group); }
            if (has(name, t.dbType)) { s += 2; reasons.push("name has " + t.dbType); }
            if (has(name, t.envTag)) { s += 2; reasons.push("name has " + t.envTag); }
            if (has(name, t.regionPrefix)) { s += 1; reasons.push("name has " + t.regionPrefix); }
            if (t.trigram && new RegExp("(^|[^A-Z0-9])" + t.trigram + "([^A-Z0-9]|$)", "i").test(name)) { s += 2; reasons.push("name has trigram " + t.trigram); }
            if (val(row, "operational_status") === "1") { s += 1; reasons.push("operational"); }
            if (val(row, "sys_class_name") === "cmdb_ci_service" || /business/i.test(dv(row, "service_classification"))) { s += 1; reasons.push("business service"); }
            return { score: s, reasons: reasons };
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("extract-event-tags");
            const hints = (p.tags && p.tags.hints) || {};
            const a = p.dynatrace_alert || {};
            const envLabel = a.environment || "";

            if (!ENABLED) return { found: false, method: "", reason: "SILVA lookup disabled", steps: steps };

            const t = {
              group: hints.assignment_group ? hints.assignment_group.value : "",
              dbType: a.db_type || "",
              envTag: a.environment_tag || "",
              regionPrefix: (a.region || "").replace(/-\d+$/, ""),
              trigram: a.trigram || ""
            };

            let service = null;
            let method = "";
            let best = null;
            let ranked = [];

            // A) SERVICE_MAP or business service tag -> exact name
            const mapped = [hints.trigram, hints.business_service].filter(Boolean)
              .map(h => SERVICE_MAP[h.value] || SERVICE_MAP[String(h.value).toUpperCase()]).find(Boolean);
            const wanted = mapped || (hints.business_service && hints.business_service.value) || "";
            if (wanted) {
              const r = await getRows("service by name", "cmdb_ci_service", "name=" + wanted, SERVICE_FIELDS, 10);
              if (r.rows.length) { service = active(r.rows); method = mapped ? "SERVICE_MAP" : "tag " + hints.business_service.key; }
            }

            // B) Host / DB CI -> service
            const domains = [hints.domain && hints.domain.value].concat(DOMAINS).filter((v, i, x) => v && x.indexOf(v) === i);
            const cis = await findCis(p.hostCandidates || [], p.ciCandidates || [], domains);
            if (!service) {
              for (const ci of cis) {
                const s = await serviceForCi(ci);
                if (s) {
                  service = await serviceById(s.id, "service by sys_id");
                  if (service) { method = "CI " + dv(ci, "name") + " -> " + s.via; break; }
                }
              }
            }

            // C) Tag-based searches (query.sh style), merged and scored
            if (!service) {
              const searches = [];
              if (t.group) searches.push(["search 1 by assignment group", "cmdb_ci_service",
                "assignment_group.nameLIKE" + t.group + "^ORsupport_group.nameLIKE" + t.group]);
              if (t.dbType && t.envTag) searches.push(["search 2 by db type + environment", "cmdb_ci_service",
                "nameLIKE" + t.dbType + "^nameLIKE" + t.envTag]);
              if (t.dbType && t.regionPrefix) searches.push(["search 3 by db type + region", "cmdb_ci_service",
                "nameLIKE" + t.dbType + "^nameLIKE" + t.regionPrefix]);
              if (t.trigram) searches.push(["search 4 by trigram", "cmdb_ci_service", "nameLIKE" + t.trigram]);
              if (t.dbType && t.envTag) searches.push(["search 5 technical by db type + environment", "cmdb_ci_service_technical",
                "nameLIKE" + t.dbType + "^nameLIKE" + t.envTag]);

              const pool = {};
              for (const [label, table, q] of searches) {
                const r = await getRows(label, table, q, SERVICE_FIELDS, 50);
                for (const row of r.rows) {
                  const id = val(row, "sys_id");
                  if (!pool[id]) pool[id] = { row: row, found_by: [] };
                  pool[id].found_by.push(label.split(" by ")[0]);
                }
              }
              ranked = Object.values(pool)
                .map(x => Object.assign({ row: x.row, found_by: x.found_by }, score(x.row, t)))
                .map(x => Object.assign(x, { score: x.score + (x.found_by.length - 1) }))
                .sort((x, y) => y.score - x.score);
              best = ranked[0] || null;
              const second = ranked[1] || null;
              if (best && best.score >= MIN_SCORE && (!second || best.score > second.score)) {
                service = best.row;
                method = "tag search (score " + best.score + ": " + best.reasons.join(", ") + ")";
              }
            }

            // D) Offering under the service, matching the environment
            let offering = null;
            if (service) {
              const r = await getRows("offerings of service", "service_offering",
                "parent=" + val(service, "sys_id"), ["sys_id", "name", "u_environment", "operational_status"], 20);
              offering = r.rows.find(o => dv(o, "u_environment") === envLabel) ||
                r.rows.find(o => envLabel && dv(o, "name").includes(envLabel)) ||
                (r.rows.length === 1 ? r.rows[0] : null);
            }

            // E) Group from the tag
            let tagGroup = null;
            if (t.group) {
              const g = await getRows("group by name", "sys_user_group", "name=" + t.group, ["sys_id", "name", "active"], 1);
              tagGroup = {
                from_tag: hints.assignment_group.key,
                name: t.group,
                sys_id: g.rows.length ? val(g.rows[0], "sys_id") : "",
                exists_in_silva: g.rows.length > 0,
                active: g.rows.length ? val(g.rows[0], "active") : ""
              };
            }

            const ci = cis[0] || null;
            const enrichment = {
              found: !!service,
              match_method: method || "not found",
              sys_id: val(service, "sys_id"),
              business_service: dv(service, "name"),
              number: dv(service, "number"),
              category: dv(service, "category"),
              service_classification: dv(service, "service_classification"),
              assignment_group: dv(service, "assignment_group"),
              assignment_group_id: val(service, "assignment_group"),
              support_group: dv(service, "support_group"),
              support_group_id: val(service, "support_group"),
              company: dv(service, "company"),
              company_id: val(service, "company"),
              managed_by: val(service, "managed_by"),
              u_bbsa_id: dv(service, "u_bbsa_id"),
              u_business_range: dv(service, "u_business_range"),
              business_criticality: val(service, "business_criticality"),
              u_cmdb_properties: dv(service, "u_cmdb_properties"),
              comments: dv(service, "comments"),
              service_offering: dv(offering, "name"),
              service_offering_id: val(offering, "sys_id"),
              configuration_item: dv(ci, "name"),
              configuration_item_id: val(ci, "sys_id"),
              configuration_item_class: dv(ci, "sys_class_name"),
              configuration_item_fqdn: dv(ci, "fqdn"),
              ci_support_group: dv(ci, "support_group"),
              ci_support_group_id: val(ci, "support_group")
            };

            return {
              found: !!service,
              method: method,
              servicenow_enrichment: enrichment,
              tag_assignment_group: tagGroup,
              search_terms: t,
              service_candidates: ranked.slice(0, 10).map(x => ({
                score: x.score,
                name: dv(x.row, "name"),
                number: dv(x.row, "number"),
                sys_id: val(x.row, "sys_id"),
                class: val(x.row, "sys_class_name"),
                assignment_group: dv(x.row, "assignment_group"),
                support_group: dv(x.row, "support_group"),
                found_by: x.found_by,
                reasons: x.reasons
              })),
              cis_found: cis.map(c => ({ name: dv(c, "name"), fqdn: dv(c, "fqdn"), sys_id: val(c, "sys_id"), class: dv(c, "sys_class_name") })),
              steps: steps
            };
          }

    display-result:
      name: display-result
      description: Final output like correctoutput.sh plus the SNOW and PagerDuty bodies (preview only, nothing sent).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - lookup-silva
      conditions:
        states:
          lookup-silva: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          // ---------- settings (edit, keep the same as OPEN) ----------
          const SHORT_PREFIX = "[DYNATRACE JAPAN]";
          const DEFAULT_GROUP = "Ops_Middleware_Monitoring_AXAJP";
          const SKIP_WHEN_MAINTENANCE = true;
          const IMPACT = "4 - Low";
          const URGENCY = "4 - Low";
          // ------------------------------------------------------------

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const e = await ex.result("extract-event-tags");
            const s = await ex.result("lookup-silva");
            const a = e.dynatrace_alert;
            const en = s.servicenow_enrichment || {};
            const tg = s.tag_assignment_group;

            // Group: tag (if it exists in SILVA) -> service support group -> CI support group -> default
            const group = (tg && tg.exists_in_silva) ? { name: tg.name, id: tg.sys_id, from: "tag " + tg.from_tag }
              : en.support_group_id ? { name: en.support_group, id: en.support_group_id, from: "business service support group" }
              : en.ci_support_group_id ? { name: en.ci_support_group, id: en.ci_support_group_id, from: "CI support group" }
              : { name: DEFAULT_GROUP, id: "", from: "default" };

            const skip = SKIP_WHEN_MAINTENANCE && a.maintenance;
            const where = a.service_name + (a.host && a.host !== a.service_name ? " on " + a.host : "");
            const shortDescription = (SHORT_PREFIX + "[" + where + "] - " + a.event_name).slice(0, 160);
            const additional = {
              correlation_id: a.entity_id,
              discovered_name: a.service_name,
              host: a.host,
              dynatrace_severity: a.severity,
              impact_level: a.impact_level,
              environment_tag: a.environment_tag,
              db_type: a.db_type,
              trigram: a.trigram,
              platform: a.platform,
              region: a.region,
              problem_displayId: a.problem_id,
              u_business_service: en.business_service || "<<UNKNOWN>>",
              u_external_url: a.problem_url || "<<UNKNOWN>>",
              tags: e.tags.raw
            };

            const snowIncident = {
              short_description: shortDescription,
              description: a.event_name + "\nAdditional Information:\n" + JSON.stringify(additional, null, 2),
              correlation_id: a.problem_id,
              impact: IMPACT,
              urgency: URGENCY,
              contact_type: "Event",
              u_environment: a.environment,
              u_host: a.host,
              assignment_group: group.id || group.name,
              business_service: en.sys_id || undefined,
              service_offering: en.service_offering_id || undefined,
              cmdb_ci: en.configuration_item_id || undefined,
              company: en.company_id || undefined
            };

            const pagerduty = {
              routing_key: "__PD_ROUTING_KEY__",
              event_action: "trigger",
              dedup_key: "dt-problem-" + a.problem_id,
              client: "Dynatrace",
              client_url: a.problem_url,
              payload: {
                summary: shortDescription,
                source: a.host || a.service_name || "dynatrace",
                severity: a.impact_level === "Infrastructure" ? "error" : "warning",
                group: a.environment,
                component: a.trigram || a.service_name,
                custom_details: {
                  problem_id: a.problem_id,
                  event_name: a.event_name,
                  service_name: a.service_name,
                  host: a.host,
                  entity_id: a.entity_id,
                  environment: a.environment,
                  business_service: en.business_service || "unknown",
                  assignment_group: group.name,
                  db_type: a.db_type,
                  trigram: a.trigram,
                  platform: a.platform,
                  region: a.region,
                  snow_correlation_id: a.problem_id
                }
              }
            };

            const output = {
              dynatrace_alert: {
                service_name: a.service_name,
                alerting_profile: a.alerting_profile,
                severity: a.severity,
                event_name: a.event_name,
                error_rate: a.error_rate,
                problem_id: a.problem_id,
                problem_url: a.problem_url,
                impact_level: a.impact_level,
                host: a.host,
                entity_id: a.entity_id,
                entity_type: a.entity_type,
                environment: a.environment,
                environment_tag: a.environment_tag,
                db_type: a.db_type,
                trigram: a.trigram,
                platform: a.platform,
                region: a.region,
                maintenance: a.maintenance
              },
              servicenow_enrichment: en,
              decision: {
                create_incident: !skip,
                reason: skip ? "Maintenance tag is True (SKIP_WHEN_MAINTENANCE)" : "ok",
                assignment_group: group.name,
                assignment_group_id: group.id,
                assignment_group_from: group.from,
                environment: a.environment,
                business_service_from: en.match_method
              },
              snow_incident_payload: snowIncident,
              pagerduty_payload: pagerduty,
              tags: { count: e.tags.count, ago: e.tags.ago, other: e.tags.other, raw: e.tags.raw },
              lookup: {
                found: s.found,
                method: s.method,
                search_terms: s.search_terms,
                service_candidates: s.service_candidates,
                cis_found: s.cis_found,
                steps: s.steps,
                used_sample_event: e.usedSample,
                problem_api: e.problemApi
              }
            };

            console.log(JSON.stringify(output, null, 2));
            return output;
          }
