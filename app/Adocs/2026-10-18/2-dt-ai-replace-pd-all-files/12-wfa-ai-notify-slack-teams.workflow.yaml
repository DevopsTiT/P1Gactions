# WF-A: Davis problem Active → extract → (optional Copilot in UI) → Slack + Teams notify
# TEMPLATE — no secrets. After import:
#   1) Set Slack connection + channel on task notify-slack
#   2) Set Teams connection + channel on task notify-teams
#   3) Optional: insert Hub action "Prompt generative AI" between extract and build-chat-message
#   4) Narrow filterQuery / categories before production
#   5) Invite Dynatrace Slack/Teams apps into the target channels
# Never commit real tokens or webhook URLs.
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: WF-A AI notify Slack and Teams (template)
  description: >-
    On Davis problem CREATED/ACTIVE, extract fields, build a chat message (template or Copilot text),
    then send to Slack and Teams. Bind connector connections in the UI after import.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: false
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        event.status_transition == "CREATED"
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
            custom: false
          entityTags: {}
          onProblemClose: false
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 200
  tasks:
    extract-problem:
      name: extract-problem
      description: Read problem id, title, description, url from the trigger event.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          export default async function () {
            const ex = execution();
            const event = ex.params?.event || {};
            const envUrl = (getEnvironmentUrl() || "").replace(/\/$/, "");
            const problemId =
              event.display_id ||
              event["display_id"] ||
              event.event?.id ||
              "UNKNOWN";
            const title =
              event["event.name"] ||
              event.event?.name ||
              "Dynatrace problem";
            const description =
              event["event.description"] ||
              event.event?.description ||
              "";
            const severity =
              event["event.category"] ||
              event.event?.category ||
              "";
            const problemUrl = envUrl
              ? `${envUrl}/ui/problems/${encodeURIComponent(problemId)}`
              : `(open problem ${problemId} in Dynatrace)`;

            return {
              problem_id: String(problemId),
              title: String(title),
              description: String(description).slice(0, 4000),
              severity: String(severity),
              problem_url: problemUrl,
              // After you add a Copilot task, map its text into ai_summary in build-chat-message.
              ai_summary: ""
            };
          }
    build-chat-message:
      name: build-chat-message
      description: Build plain-text Slack/Teams body. Uses Copilot text when present; else a safe template.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - extract-problem
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function () {
            const ex = execution();
            const p = await ex.result("extract-problem");
            const ai = (p.ai_summary || "").trim();
            const body = ai
              ? `[Dynatrace AI] ${p.problem_id}\n${p.title}\n${p.problem_url}\n\n${ai}`
              : `[Dynatrace] New problem ${p.problem_id}\n` +
                `Title: ${p.title}\n` +
                `Severity: ${p.severity}\n` +
                `URL: ${p.problem_url}\n\n` +
                `Context:\n${p.description}\n\n` +
                `(Insert Prompt generative AI task before this step for AI summary.)`;
            return {
              ...p,
              chat_message: body.slice(0, 3500)
            };
          }
    # --- Bind these in the UI after import (action IDs depend on installed Hub apps) ---
    # notify-slack:
    #   action: <your Slack connector send-message action>
    #   predecessors: [build-chat-message]
    #   input: connection, channel=#test-channel, message={{ result("build-chat-message").chat_message }}
    # notify-teams:
    #   action: <your Teams connector send-message action>
    #   predecessors: [build-chat-message]
    #   input: connection, channel=<test team channel>, message={{ result("build-chat-message").chat_message }}
    emit-chat-payload:
      name: emit-chat-payload
      description: >-
        Placeholder deliverable until Slack/Teams connector tasks are added in the UI.
        Shows the exact message to post. Replace with real notify-slack and notify-teams tasks.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - build-chat-message
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function () {
            const ex = execution();
            const m = await ex.result("build-chat-message");
            return {
              ready_for_slack: true,
              ready_for_teams: true,
              slack_channel_hint: "#test-channel",
              teams_channel_hint: "<set test Teams channel>",
              message: m.chat_message,
              problem_id: m.problem_id,
              problem_url: m.problem_url
            };
          }
