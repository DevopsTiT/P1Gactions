# Monaco / Monitoring as Code — classic Problem notification (NOT a Workflow Connection)
# Schema: builtin:problem.notifications
# Matches UI: Settings → Integration → Problem notifications → silvastg
#
# BEFORE APPLY:
#   1) Replace __ALERTING_PROFILE_ID__ (Default profile object id)
#   2) Replace __SNOW_PASSWORD__ (or use secret reference your Monaco setup supports)
#   3) Confirm username matches UI exactly (Tech_DynatraceINC_WS)
#   4) External requests allowlist still needs: silvastg.service-now.com

configs:
  - id: problem-notification-silvastg
    type:
      settings:
        schema: builtin:problem.notifications
        scope: environment
    config:
      template: silvastg-problem-notification.template.json
      parameters:
        alertingProfile:
          type: value
          value: "__ALERTING_PROFILE_ID__"
        snowPassword:
          type: value
          value: "__SNOW_PASSWORD__"
