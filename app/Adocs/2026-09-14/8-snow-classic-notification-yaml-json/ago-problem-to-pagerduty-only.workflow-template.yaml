# Dynatrace Automation — Problem OPEN → PagerDuty only
# ServiceNow is handled by classic Problem notification "silvastg" (ITOM events).
# Do NOT map ServiceNow Connection / snow-create-incident here.
# BEFORE IMPORT: replace __PD_ROUTING_KEY__
# Allowlist: events.pagerduty.com
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem to PagerDuty (SNOW via classic notification)
  description: >-
    On Dynatrace Problem open, create PagerDuty only. ServiceNow ITOM events
    come from Settings → Problem notifications → silvastg (not this workflow).
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
        event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-payload:
      name: prepare-payload
      description: Map Problem fields to PagerDuty payload (app, severity, runbook).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};

            const title =
              ev["event.name"] ||
              ev["problem.title"] ||
              ev.title ||
              "Dynatrace Problem";
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              "";
            const severity = String(
              ev["problem.severity"] ||
                ev["event.severity"] ||
                ev.severity ||
                "ERROR"
            ).toUpperCase();

            const tags = ev["entity_tags"] || ev.tags || [];
            const tagList = Array.isArray(tags) ? tags : [tags];

            function tagValue(key) {
              for (const t of tagList) {
                const s = String(t);
                if (s.startsWith(key + ":")) return s.slice(key.length + 1);
                if (typeof t === "object" && t && t.key === key) return t.value;
              }
              return null;
            }

            const app = tagValue("app") || tagValue("AGO_GLOBAL_APP") || "unknown-app";

            const assignMap = {
              EIP: {
                groupName: "EIP-Support",
                l1: "EIP-L1",
                l2: "EIP-L2",
                l3: "EIP-L3",
                runbook: "https://confluence.example/runbooks/eip"
              },
              CCI: {
                groupName: "CCI-Support",
                l1: "CCI-L1",
                l2: "CCI-L2",
                l3: "CCI-L3",
                runbook: "https://confluence.example/runbooks/cci"
              },
              default: {
                groupName: "Ops-Default",
                l1: "Ops-L1",
                l2: "Ops-L2",
                l3: "Ops-L3",
                runbook: "https://confluence.example/runbooks/default"
              }
            };
            const meta = assignMap[app] || assignMap.default;

            let pLevel = "P4";
            let pdSeverity = "warning";
            if (severity.includes("AVAILABILITY") || severity.includes("CRITICAL")) {
              pLevel = "P3";
              pdSeverity = "critical";
            } else if (severity.includes("ERROR")) {
              pLevel = "P3";
              pdSeverity = "error";
            }

            return {
              app,
              assignmentGroupName: meta.groupName,
              pLevel,
              l1: meta.l1,
              l2: meta.l2,
              l3: meta.l3,
              runbookUrl: meta.runbook,
              problemId,
              problemUrl,
              problemTitle: title,
              pdSeverity,
              dedupKey: "dt-problem-" + problemId,
              shortDescription: "[Dynatrace] " + title + " — " + app,
              snowPath: "classic-problem-notification-silvastg-ITOM-events"
            };
          }

    create-pagerduty-incident:
      name: create-pagerduty-incident
      description: Trigger PagerDuty Events API v2. SNOW is classic notification silvastg.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");

            const routingKey = "__PD_ROUTING_KEY__";

            const body = {
              routing_key: routingKey,
              event_action: "trigger",
              dedup_key: p.dedupKey,
              client: "Dynatrace",
              client_url: p.problemUrl,
              links: [
                { href: p.problemUrl, text: "Open Dynatrace Problem" },
                { href: p.runbookUrl, text: "Runbook" }
              ],
              payload: {
                summary: p.shortDescription,
                source: p.app,
                severity: p.pdSeverity,
                component: p.app,
                group: p.assignmentGroupName,
                class: "dynatrace-problem",
                custom_details: {
                  problem_id: p.problemId,
                  problem_url: p.problemUrl,
                  assignment_group: p.assignmentGroupName,
                  priority_intent: p.pLevel,
                  l1: p.l1,
                  l2: p.l2,
                  l3: p.l3,
                  runbook: p.runbookUrl,
                  snow_path: p.snowPath
                }
              }
            };

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) {
              throw new Error("PagerDuty trigger failed HTTP " + res.status + ": " + text);
            }
            return {
              status: json.status,
              dedupKey: json.dedup_key || p.dedupKey,
              message: json.message,
              raw: json
            };
          }
