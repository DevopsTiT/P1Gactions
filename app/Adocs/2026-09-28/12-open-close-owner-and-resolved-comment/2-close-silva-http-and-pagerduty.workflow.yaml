# CLOSE — Problem CLOSED → resolve SILVA INC + resolve PagerDuty (same sync keys)
# Based on 2026-09-24/2-close-silva-http-and-pagerduty.workflow.yaml — ENRICH ONLY, structure unchanged.
# Enrichment added:
#   close_notes: cause, duration, service, application, dashboard, Dynatrace link
#   comments (Additional comments, customer visible): RESOLVE_COMMENT = "Resolved"
#   work_notes (internal): closing block with cause, duration, links and service
# Business service filled in like test ticket INC30339677: "QA Platforms"
# No ServiceNow connector. FIND INC by correlation_id == problemId, then PATCH Resolved.
# PD resolve uses dedup_key == dt-problem-<problemId>
# SNOW password and PD routing key are filled in, same as OPEN (local copy only — never commit this file)
#   Use the same APPLICATION / BUSINESS_SERVICE / DASHBOARD_URL / PD_SERVICE_URL values as OPEN
# Allowlist: silvastg.service-now.com , events.pagerduty.com
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem CLOSE resolve SILVA HTTP and PagerDuty (sync)
  description: >-
    No ServiceNow connector. On Problem close, HTTP resolve SILVA/SNOW INC by
    correlation_id and resolve PagerDuty with matching dedup_key. Close notes and
    customer notes carry cause, duration, service, application, dashboard and links.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND
        (event.status == "CLOSED" OR event.status_transition == "RESOLVED" OR
        event.status_transition == "CLOSED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-close-ids:
      name: prepare-close-ids
      description: Same sync keys as OPEN (correlationId + dedupKey) plus enriched close notes.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- enrichment settings (keep same as OPEN) ----------
          const RESOLVE_COMMENT = "Resolved";
          const APPLICATION = "EIP";
          const BUSINESS_SERVICE = "QA Platforms";
          const DASHBOARD_URL = "__EIP_DASHBOARD_URL__";
          const PD_SERVICE_URL = "__PD_SERVICE_URL__";
          // -------------------------------------------------------------

          function tagValue(tags, key) {
            const hit = (tags || []).find(t => (t.key || "").toLowerCase() === key);
            return hit ? (hit.value || "") : "";
          }
          function duration(ms) {
            if (!ms || ms < 0) return "unknown";
            const m = Math.round(ms / 60000);
            return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              (ev["event.id"] ? getEnvironmentUrl().replace(/\/$/, "") +
                "/ui/apps/dynatrace.davis.problems/problem/" + ev["event.id"] : "");

            // --- enrichment: problem details ---
            let prob = {};
            try {
              prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
            } catch (e) {
              prob = {};
            }
            const title = prob.title || ev["event.name"] || "Dynatrace Problem";
            const tags = prob.entityTags || [];
            const root = prob.rootCauseEntity || (prob.affectedEntities || [])[0] || {};
            const hostName = ev["host.name"] || ev["dt.entity.host.name"] || "";
            const where = root.name || hostName || "unknown entity";
            const evidence = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .filter(d => d.rootCauseRelevant !== false)
              .map(d => d.displayName)
              .slice(0, 3);
            const application = tagValue(tags, "app") || APPLICATION;
            const businessService = tagValue(tags, "snow-service") || BUSINESS_SERVICE;
            const dashboard = tagValue(tags, "dashboard") || DASHBOARD_URL;
            const start = prob.startTime || 0;
            const end = prob.endTime && prob.endTime > 0 ? prob.endTime : Date.now();
            const dur = start ? duration(end - start) : "unknown";
            const endIso = new Date(end).toISOString();

            const cause = [title + " on " + where].concat(evidence.map(e => "- " + e));

            const closeNotes = [
              "[RESOLVED] Dynatrace Problem closed " + problemId + " at " + endIso,
              "Duration: " + dur,
              "Cause: " + cause.join("\n"),
              "Recovery confirmed by Dynatrace: the problem condition is no longer detected.",
              "Dynatrace: " + problemUrl
            ].join("\n").slice(0, 3900);

            const customerNotes = [
              "=== Dynatrace alert closed " + problemId + " ===",
              "",
              "Cause",
              ...cause.map(c => "  " + c),
              "  Duration          : " + dur,
              "",
              "Links",
              "  Dynatrace problem : " + (problemUrl || "n/a"),
              "  PagerDuty         : " + PD_SERVICE_URL + " (dedup_key dt-problem-" + problemId + ")",
              "  Dashboard         : " + dashboard,
              "",
              "Service",
              "  Business service  : " + businessService,
              "  Application       : " + application,
              "  Affected entity   : " + where + (hostName && hostName !== where ? " on host " + hostName : "")
            ].join("\n").slice(0, 3900);

            return {
              problemId: problemId,
              problemUrl: problemUrl,
              correlationId: problemId,
              dedupKey: "dt-problem-" + problemId,
              closeNotes: closeNotes,
              resolveComment: RESOLVE_COMMENT,
              customerNotes: customerNotes,
              silvaBaseUrl: "https://silvastg.service-now.com",
              silvaUsername: "Tech_DynatraceJP_WS"
            };
          }

    resolve-silva-incident-http:
      name: resolve-silva-incident-http
      description: GET INC by correlation_id then PATCH state Resolved with enriched notes (HTTP, no connector).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-close-ids
      conditions:
        states:
          prepare-close-ids: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-close-ids");

            const baseUrl = String(p.silvaBaseUrl || "https://silvastg.service-now.com").replace(/\/$/, "");
            const username = p.silvaUsername || "Tech_DynatraceJP_WS";
            const password = "__SNOW_PASSWORD__";
            const headers = {
              Authorization: basicAuthHeader(username, password),
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            const q = encodeURIComponent("correlation_id=" + p.correlationId);
            const searchUrl =
              baseUrl +
              "/api/now/v2/table/incident?sysparm_query=" +
              q +
              "&sysparm_limit=1&sysparm_fields=number,sys_id,state,correlation_id";

            const searchRes = await fetch(searchUrl, { method: "GET", headers: headers });
            const searchText = await searchRes.text();
            let searchJson = {};
            try { searchJson = JSON.parse(searchText); } catch (e) { searchJson = { raw: searchText }; }
            if (!searchRes.ok) {
              throw new Error(
                "SILVA search failed HTTP " + searchRes.status + ": " + searchText +
                " | Allowlist silvastg.service-now.com?"
              );
            }

            const rows = searchJson.result || [];
            if (!rows.length) {
              // OPEN may have skipped (retired host) — do not fail CLOSE hard
              return {
                found: false,
                correlationId: p.correlationId,
                note: "No INC for correlation_id (SILVA may have skipped create)"
              };
            }

            const row = rows[0];
            const patchBody = {
              state: "6",
              close_code: "Solved (Permanently)",
              close_notes: p.closeNotes,
              comments: p.resolveComment,
              work_notes: p.customerNotes
            };
            const patchRes = await fetch(baseUrl + "/api/now/v2/table/incident/" + row.sys_id, {
              method: "PATCH",
              headers: headers,
              body: JSON.stringify(patchBody)
            });
            const patchText = await patchRes.text();
            if (!patchRes.ok) {
              throw new Error("SILVA resolve failed HTTP " + patchRes.status + ": " + patchText);
            }

            return {
              found: true,
              number: row.number,
              sysId: row.sys_id,
              comment: p.resolveComment,
              correlationId: p.correlationId,
              dedupKey: p.dedupKey
            };
          }

    resolve-pagerduty:
      name: resolve-pagerduty
      description: HTTP POST PagerDuty resolve with same dedup_key as OPEN.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-close-ids
      conditions:
        states:
          prepare-close-ids: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-close-ids");
            const routingKey = "__PD_ROUTING_KEY__";

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                routing_key: routingKey,
                event_action: "resolve",
                dedup_key: p.dedupKey
              })
            });
            const text = await res.text();
            if (!res.ok) {
              throw new Error(
                "PD resolve failed HTTP " + res.status + ": " + text +
                " | Allowlist events.pagerduty.com?"
              );
            }
            return { dedupKey: p.dedupKey, correlationId: p.correlationId, raw: text };
          }
