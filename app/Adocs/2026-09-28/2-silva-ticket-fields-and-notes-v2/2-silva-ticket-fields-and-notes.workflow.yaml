# OPEN v2 — Dynatrace Problem → SILVA INC with clear fields + customer notes → PagerDuty
# Requirement (pic 1):
#   Ticket fields must clearly show: env, business service, category, subcategory, priority, impact, assignment group
#   Customer notes must list: cause, Dynatrace link, PagerDuty link, which service, which dashboard to refer to
# Requirement (pic 2): assignment group must be an existing sys_user_group (19,609 groups) → look up exact name
#
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com , events.pagerduty.com , api.pagerduty.com
#   2) Credential vault IDs:
#        __SNOW_CREDENTIAL_ID__   Username/Password  (Tech_DynatraceJP_WS)
#        __PD_ROUTING_CREDENTIAL_ID__  Token  (Events API v2 integration key)
#        __PD_API_CREDENTIAL_ID__      Token  (PagerDuty REST API read-only key, to get the incident link)
#   3) Replace __PD_SUBDOMAIN__ (e.g. axa-jp) and confirm FIELD names / choice labels with 1.sh of seq 1
#   4) Dynatrace tags: env, app, owner, runbook, snow-group, snow-service, snow-offering, dashboard
#   5) NOTES_FIELD: 'comments' = Additional comments (Customer visible); 'work_notes' = internal only
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem OPEN to SILVA v2 (clear fields + notes with DT and PD links)
  description: >-
    Fill env, business service, category, subcategory, impact, urgency (priority), and a
    verified assignment group; then page PagerDuty, fetch the PagerDuty incident link, and
    write a notes block with cause, Dynatrace link, PagerDuty link, service, and dashboard.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    enrich-problem:
      name: enrich-problem
      description: Problem facts, tags, cause evidence, top error log, dashboard link.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { queryExecutionClient } from '@dynatrace-sdk/client-query';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // Fallback dashboards when the entity has no "dashboard" tag
          const DASHBOARD_BY_APP = {
            'policy-db': 'https://abc12345.apps.dynatrace.com/ui/apps/dynatrace.dashboards/dashboard/__POLICY_DB_DASHBOARD_ID__',
            'checkout':  'https://abc12345.apps.dynatrace.com/ui/apps/dynatrace.dashboards/dashboard/__CHECKOUT_DASHBOARD_ID__'
          };
          const DASHBOARD_BY_ZONE = {
            'JP-Prod': 'https://abc12345.apps.dynatrace.com/ui/apps/dynatrace.dashboards/dashboard/__JP_PROD_OVERVIEW_ID__'
          };

          async function runDql(query) {
            const start = await queryExecutionClient.queryExecute({
              body: { query, requestTimeoutMilliseconds: 30000, maxResultRecords: 50 }
            });
            if (start.result) return start.result.records || [];
            let poll = await queryExecutionClient.queryPoll({ requestToken: start.requestToken });
            while (poll.state === 'RUNNING' || poll.state === 'NOT_STARTED') {
              await new Promise(r => setTimeout(r, 1000));
              poll = await queryExecutionClient.queryPoll({ requestToken: start.requestToken });
            }
            return (poll.result && poll.result.records) || [];
          }

          function tagValue(tags, key) {
            const hit = (tags || []).find(t => (t.key || '').toLowerCase() === key);
            return hit ? (hit.value || '') : '';
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};
            const internalId = ev['event.id'];
            const displayId = ev['display_id'] || internalId;
            const prob = await problemsClient.getProblem({ problemId: internalId });
            const base = getEnvironmentUrl().replace(/\/$/, '');

            const root = prob.rootCauseEntity || (prob.affectedEntities || [])[0] || {};
            const rootId = root.entityId ? root.entityId.id : '';
            const rootType = root.entityId ? root.entityId.type : '';
            const all = [root, ...(prob.affectedEntities || []), ...(prob.impactedEntities || [])];
            const hostEntity = all.find(e => e.entityId && e.entityId.type === 'HOST');
            const serviceEntity = all.find(e => e.entityId && e.entityId.type === 'SERVICE');
            const hostName = hostEntity ? hostEntity.name : (rootType === 'HOST' ? root.name : '');
            const tags = prob.entityTags || [];
            const zones = (prob.managementZones || []).map(z => z.name);
            const app = tagValue(tags, 'app');

            const evidence = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .filter(d => d.rootCauseRelevant !== false)
              .map(d => d.displayName).slice(0, 3);

            const logs = rootId ? await runDql(
              `fetch logs, from:now()-30m
               | filter dt.source_entity == "${rootId}" or host.name == "${hostName}"
               | filter loglevel == "ERROR" or loglevel == "SEVERE"
               | summarize count = count(), by:{content}
               | sort count desc
               | limit 1`
            ) : [];

            const zoneDash = zones.map(z => DASHBOARD_BY_ZONE[z]).find(Boolean);
            const dashboard = tagValue(tags, 'dashboard') || DASHBOARD_BY_APP[app] || zoneDash || '';

            return {
              problemId: displayId,
              internalId,
              title: prob.title,
              problemUrl: `${base}/ui/apps/dynatrace.davis.problems/problem/${internalId}`,
              startTime: new Date(prob.startTime).toISOString(),
              severity: prob.severityLevel || 'ERROR',
              impactLevel: prob.impactLevel || 'INFRASTRUCTURE',
              rootName: root.name || '',
              rootType,
              hostName,
              dtService: serviceEntity ? serviceEntity.name : '',
              env: tagValue(tags, 'env').toLowerCase(),
              app,
              owner: tagValue(tags, 'owner'),
              runbook: tagValue(tags, 'runbook'),
              snowGroup: tagValue(tags, 'snow-group'),
              snowService: tagValue(tags, 'snow-service'),
              snowOffering: tagValue(tags, 'snow-offering'),
              dashboard,
              zones,
              evidence,
              topLog: logs.length ? { count: logs[0].count, content: String(logs[0].content).slice(0, 250) } : null
            };
          }

    cmdb-lookup:
      name: cmdb-lookup
      description: CI, support group, business service. Retired CI means skip.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - enrich-problem
      conditions:
        states:
          enrich-problem: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result('enrich-problem');
            const name = p.hostName || p.rootName;
            if (!name) return { found: false, skip: false };

            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__SNOW_CREDENTIAL_ID__' });
            const auth = 'Basic ' + Buffer.from(cred.username + ':' + cred.password).toString('base64');
            const short = name.split('.')[0];
            const q = encodeURIComponent(`name=${name}^ORname=${short}^ORfqdn=${name}`);
            const res = await fetch(
              `https://silvastg.service-now.com/api/now/v2/table/cmdb_ci?sysparm_query=${q}&sysparm_limit=1` +
              `&sysparm_fields=sys_id,name,install_status,support_group,u_business_service` +
              `&sysparm_display_value=all&sysparm_exclude_reference_link=true`,
              { headers: { Authorization: auth, Accept: 'application/json' } }
            );
            if (!res.ok) throw new Error(`CMDB lookup HTTP ${res.status}: ${await res.text()}`);
            const row = ((await res.json()).result || [])[0];
            if (!row) return { found: false, skip: false };
            const v = f => (row[f] && row[f].value) || '';
            const d = f => (row[f] && row[f].display_value) || '';
            return {
              found: true,
              skip: v('install_status') === '7',
              ciSysId: v('sys_id'),
              ciName: d('name'),
              supportGroup: d('support_group'),
              businessService: d('u_business_service')
            };
          }

    resolve-assignment-group:
      name: resolve-assignment-group
      description: >-
        Pick the group name (CI → tag → zone map → default) and confirm it exists and is
        active in sys_user_group. Returns the sys_id so SNOW cannot silently drop it.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - cmdb-lookup
      conditions:
        states:
          cmdb-lookup: OK
        custom: '{{ result("cmdb-lookup").skip == false }}'
        else: SKIP
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          const GROUP_BY_ZONE = {
            'JP-Prod': 'Dynatrace Support',
            'Payments': 'Payments SRE'
          };
          const DEFAULT_GROUP = 'Dynatrace Support';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result('enrich-problem');
            const ci = await ex.result('cmdb-lookup');
            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__SNOW_CREDENTIAL_ID__' });
            const auth = 'Basic ' + Buffer.from(cred.username + ':' + cred.password).toString('base64');

            const zoneGroup = p.zones.map(z => GROUP_BY_ZONE[z]).find(Boolean);
            const candidates = [
              { name: ci.supportGroup, from: 'CMDB support group' },
              { name: p.snowGroup, from: 'Dynatrace tag snow-group' },
              { name: zoneGroup, from: 'management zone map' },
              { name: DEFAULT_GROUP, from: 'default' }
            ].filter(c => c.name);

            for (const c of candidates) {
              const q = encodeURIComponent(`name=${c.name}^active=true`);
              const res = await fetch(
                `https://silvastg.service-now.com/api/now/v2/table/sys_user_group?sysparm_query=${q}` +
                `&sysparm_fields=sys_id,name,company&sysparm_display_value=true&sysparm_exclude_reference_link=true&sysparm_limit=1`,
                { headers: { Authorization: auth, Accept: 'application/json' } }
              );
              if (!res.ok) throw new Error(`Group lookup HTTP ${res.status}: ${await res.text()}`);
              const row = ((await res.json()).result || [])[0];
              if (row) {
                return { sysId: row.sys_id, name: row.name, company: row.company, from: c.from,
                         tried: candidates.map(x => x.name) };
              }
            }
            throw new Error(`No active sys_user_group matched: ${candidates.map(c => c.name).join(', ')}`);
          }

    build-and-post-silva:
      name: build-and-post-silva
      description: Fill the seven "must show" fields plus mandatory fields, then POST.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 4
      predecessors:
        - resolve-assignment-group
      conditions:
        states:
          resolve-assignment-group: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          const FIELD = {
            caller: 'caller_id', contactType: 'contact_type', company: 'company',
            environment: 'u_environment', businessService: 'business_service', serviceOffering: 'service_offering',
            ci: 'cmdb_ci', category: 'category', subcategory: 'subcategory',
            impact: 'impact', urgency: 'urgency', assignmentGroup: 'assignment_group',
            shortDescription: 'short_description', summary: 'description', externalTicket: 'correlation_id'
          };
          const ENVIRONMENT = { prod: 'Production', stg: 'Staging', uat: 'UAT', dev: 'Development' };
          const OFFERING_BY_ENV = { prod: 'AXA GROUP OPERATIONS - Production', stg: 'AXA GROUP OPERATIONS - Staging' };
          const SERVICE_BY_ZONE = { 'Payments': 'Online Payments' };
          const KEYWORD_CATEGORY = [
            { match: /disk|file space|storage|volume/i, category: 'Capacity', subcategory: 'Disk space' },
            { match: /memory|heap|oom/i,                category: 'Capacity', subcategory: 'Memory' },
            { match: /cpu/i,                            category: 'Capacity', subcategory: 'CPU' }
          ];
          const SEVERITY_CATEGORY = {
            AVAILABILITY: { category: 'Availability', subcategory: 'Outage' },
            ERROR: { category: 'Application', subcategory: 'Error' },
            PERFORMANCE: { category: 'Performance', subcategory: 'Slow response' },
            RESOURCE_CONTENTION: { category: 'Capacity', subcategory: 'Resource usage' }
          };
          const DEFAULT = {
            environment: 'Production',
            businessService: 'AXA GROUP OPERATIONS - Monitoring',
            serviceOffering: 'AXA GROUP OPERATIONS - Production',
            category: { category: 'Monitoring', subcategory: 'Custom alert' }
          };

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result('enrich-problem');
            const ci = await ex.result('cmdb-lookup');
            const grp = await ex.result('resolve-assignment-group');
            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__SNOW_CREDENTIAL_ID__' });
            const auth = 'Basic ' + Buffer.from(cred.username + ':' + cred.password).toString('base64');
            const gaps = [];

            const env = ENVIRONMENT[p.env] || (gaps.push('Environment defaulted'), DEFAULT.environment);
            const zoneService = p.zones.map(z => SERVICE_BY_ZONE[z]).find(Boolean);
            const businessService = ci.businessService || p.snowService || zoneService ||
              (gaps.push('Business service defaulted'), DEFAULT.businessService);
            const serviceOffering = p.snowOffering || OFFERING_BY_ENV[p.env] ||
              (gaps.push('Service offering defaulted'), DEFAULT.serviceOffering);
            const cat = KEYWORD_CATEGORY.find(k => k.match.test(p.title)) || SEVERITY_CATEGORY[p.severity] ||
              (gaps.push('Category defaulted'), DEFAULT.category);

            const isProd = env === 'Production';
            const impact = p.impactLevel === 'APPLICATION' ? '1' : p.impactLevel === 'SERVICES' ? '2' : (isProd ? '2' : '3');
            const urgency = !isProd ? '3' : p.severity === 'AVAILABILITY' ? '1' :
              (p.severity === 'ERROR' || p.severity === 'PERFORMANCE') ? '2' : '3';

            const where = p.rootName || p.hostName || 'unknown entity';
            const body = {
              [FIELD.caller]: 'Dynatrace JP',
              [FIELD.contactType]: 'Monitoring',
              [FIELD.company]: 'AXA GROUP OPERATIONS',
              [FIELD.environment]: env,
              [FIELD.businessService]: businessService,
              [FIELD.serviceOffering]: serviceOffering,
              [FIELD.category]: cat.category,
              [FIELD.subcategory]: cat.subcategory,
              [FIELD.impact]: impact,
              [FIELD.urgency]: urgency,
              [FIELD.assignmentGroup]: grp.sysId,
              [FIELD.shortDescription]: `[Dynatrace][${env}] ${p.title} - ${where}`.slice(0, 160),
              [FIELD.summary]: `[OPEN] ${p.problemId} | Problem ${p.title}\nRoot cause entity: ${where}\nDynatrace: ${p.problemUrl}`,
              [FIELD.externalTicket]: p.problemId
            };
            if (ci.found) body[FIELD.ci] = ci.ciSysId;

            const res = await fetch('https://silvastg.service-now.com/api/now/v2/table/incident?sysparm_input_display_value=true', {
              method: 'POST',
              headers: { Authorization: auth, 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`SILVA POST HTTP ${res.status}: ${text}`);
            const row = JSON.parse(text).result || {};
            return { number: row.number, sysId: row.sys_id, body, gaps, field: FIELD, where, urgency,
                     groupName: grp.name, groupFrom: grp.from };
          }

    trigger-pagerduty:
      name: trigger-pagerduty
      description: Page on-call; dedup_key keeps sync with CLOSE workflow.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 5
      predecessors:
        - build-and-post-silva
      conditions:
        states:
          build-and-post-silva: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result('enrich-problem');
            const inc = await ex.result('build-and-post-silva');
            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__PD_ROUTING_CREDENTIAL_ID__' });
            const dedupKey = 'dt-problem-' + p.problemId;

            const res = await fetch('https://events.pagerduty.com/v2/enqueue', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                routing_key: cred.token,
                event_action: 'trigger',
                dedup_key: dedupKey,
                client: 'Dynatrace',
                client_url: p.problemUrl,
                payload: {
                  summary: `${inc.number} ${p.title} - ${inc.where}`.slice(0, 1000),
                  source: inc.where,
                  severity: inc.urgency === '1' ? 'critical' : inc.urgency === '2' ? 'error' : 'warning',
                  custom_details: {
                    snow_incident: inc.number,
                    assignment_group: inc.groupName,
                    business_service: inc.body[inc.field.businessService],
                    dashboard: p.dashboard,
                    runbook: p.runbook
                  }
                },
                links: [
                  { href: p.problemUrl, text: 'Dynatrace problem' },
                  { href: `https://silvastg.service-now.com/nav_to.do?uri=incident.do?sys_id=${inc.sysId}`, text: inc.number }
                ].concat(p.dashboard ? [{ href: p.dashboard, text: 'Dashboard' }] : [])
              })
            });
            if (!res.ok) throw new Error(`PagerDuty HTTP ${res.status}: ${await res.text()}`);
            return { dedupKey };
          }

    get-pagerduty-link:
      name: get-pagerduty-link
      description: >-
        The Events API does not return the incident URL. Ask the PagerDuty REST API for the
        incident with this dedup_key (incident_key) and return its html_url. Retries while PD creates it.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 6
      predecessors:
        - trigger-pagerduty
      conditions:
        states:
          trigger-pagerduty: OK
      retry:
        count: 5
        delay: 10
        failedLoopIterationsOnly: true
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const pd = await ex.result('trigger-pagerduty');
            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__PD_API_CREDENTIAL_ID__' });

            const res = await fetch(
              `https://api.pagerduty.com/incidents?incident_key=${encodeURIComponent(pd.dedupKey)}&statuses[]=triggered&statuses[]=acknowledged`,
              { headers: { Authorization: `Token token=${cred.token}`, Accept: 'application/vnd.pagerduty+json;version=2' } }
            );
            if (!res.ok) throw new Error(`PagerDuty REST HTTP ${res.status}: ${await res.text()}`);
            const incident = ((await res.json()).incidents || [])[0];
            if (!incident) throw new Error(`PagerDuty incident not created yet for ${pd.dedupKey}`);
            return { url: incident.html_url, number: incident.incident_number, service: incident.service && incident.service.summary };
          }

    write-ticket-notes:
      name: write-ticket-notes
      description: >-
        Read the saved field values (including calculated priority) and write one notes block:
        ticket fields, cause, Dynatrace link, PagerDuty link, service, dashboard.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 7
      predecessors:
        - get-pagerduty-link
      conditions:
        states:
          get-pagerduty-link: ANY
          build-and-post-silva: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { credentialVaultClient } from '@dynatrace-sdk/client-classic-environment-v2';

          const NOTES_FIELD = 'comments';
          const PD_FALLBACK = 'https://__PD_SUBDOMAIN__.pagerduty.com/incidents';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result('enrich-problem');
            const inc = await ex.result('build-and-post-silva');
            let pd = {};
            try { pd = await ex.result('get-pagerduty-link'); } catch (e) { pd = {}; }
            const cred = await credentialVaultClient.getCredentialsDetails({ id: '__SNOW_CREDENTIAL_ID__' });
            const auth = 'Basic ' + Buffer.from(cred.username + ':' + cred.password).toString('base64');
            const base = 'https://silvastg.service-now.com';
            const F = inc.field;

            const cols = [F.environment, F.businessService, F.category, F.subcategory, 'priority', F.impact, F.urgency, F.assignmentGroup].join(',');
            const r = await fetch(`${base}/api/now/v2/table/incident/${inc.sysId}?sysparm_fields=${cols}&sysparm_display_value=true&sysparm_exclude_reference_link=true`,
              { headers: { Authorization: auth, Accept: 'application/json' } });
            if (!r.ok) throw new Error(`Read-back HTTP ${r.status}: ${await r.text()}`);
            const t = (await r.json()).result || {};
            const show = v => v || 'NOT SET - please fill';

            const cause = [
              p.rootName ? `${p.title} on ${p.rootName}` : p.title,
              ...p.evidence.map(e => `  - ${e}`),
              p.topLog ? `  - Top error (${p.topLog.count}x in 30 min): ${p.topLog.content}` : null
            ].filter(Boolean);

            const note = [
              `=== Dynatrace alert summary (${p.problemId}) ===`,
              '',
              'Ticket classification',
              `  Environment      : ${show(t[F.environment])}`,
              `  Business service : ${show(t[F.businessService])}`,
              `  Category         : ${show(t[F.category])}`,
              `  Subcategory      : ${show(t[F.subcategory])}`,
              `  Priority         : ${show(t.priority)}`,
              `  Impact           : ${show(t[F.impact])}`,
              `  Urgency          : ${show(t[F.urgency])}`,
              `  Assignment group : ${show(t[F.assignmentGroup])}`,
              '',
              'Cause',
              ...cause.map(c => (c.startsWith('  ') ? c : `  ${c}`)),
              '',
              'Links',
              `  Dynatrace problem : ${p.problemUrl}`,
              `  PagerDuty incident: ${pd.url || PD_FALLBACK + ' (search ' + 'dt-problem-' + p.problemId + ')'}`,
              '',
              'Which service',
              `  Business service  : ${show(t[F.businessService])}`,
              `  Dynatrace service : ${p.dtService || 'n/a'}`,
              `  Affected entity   : ${inc.where}${p.hostName && p.hostName !== inc.where ? ' on host ' + p.hostName : ''}`,
              `  Application       : ${p.app || 'n/a'}`,
              '',
              'Dashboard to refer to',
              `  ${p.dashboard || 'None tagged - add Dynatrace tag "dashboard:<url>" to this entity'}`,
              p.runbook ? `  Runbook: ${p.runbook}` : null,
              '',
              inc.gaps.length ? `Defaults used (please review): ${inc.gaps.join('; ')}` : null
            ].filter(x => x !== null).join('\n').slice(0, 3900);

            const res = await fetch(`${base}/api/now/v2/table/incident/${inc.sysId}`, {
              method: 'PATCH',
              headers: { Authorization: auth, 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ [NOTES_FIELD]: note })
            });
            if (!res.ok) throw new Error(`Notes PATCH HTTP ${res.status}: ${await res.text()}`);

            const missing = Object.entries({
              environment: t[F.environment], business_service: t[F.businessService], category: t[F.category],
              subcategory: t[F.subcategory], priority: t.priority, impact: t[F.impact], assignment_group: t[F.assignmentGroup]
            }).filter(([, v]) => !v).map(([k]) => k);

            return { number: inc.number, notesField: NOTES_FIELD, missing, pdLink: pd.url || '' };
          }
