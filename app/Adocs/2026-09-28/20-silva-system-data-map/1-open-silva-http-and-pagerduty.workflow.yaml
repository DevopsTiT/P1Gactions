# OPEN — Problem ACTIVE → SILVA (HTTP, no SNOW connector) + PagerDuty (parallel)
# Based on 2026-09-24/1-open-silva-http-and-pagerduty.workflow.yaml — ENRICH ONLY, structure unchanged.
# Field values filled in like test ticket INC30339677:
#   Short description "[DYNATRACE JAPAN][<host>] - <problem title>" (FIXED_SHORT_DESCRIPTION = "")
#   Summary "<title> + Additional Information {json}"
#   Contact type Event, Company AXA GROUP OPERATIONS
#   Environment "Development" (FIXED_ENVIRONMENT; set "" to read tag AGO_AXAENVIRONMENTNAME)
#   SYSTEM_MAP (data map, per Abhay): system found in the problem -> SILVA business service,
#     offering and L1/L2 groups. Example EIP -> ALJ_EIP_PRD. When business service changes,
#     edit SYSTEM_MAP only.
#   System is detected from tags system / app / dt.cost.product, then dt.security.context,
#     then the affected entity names (whole word match, e.g. "ALJ_EIP_PRD" matches EIP).
#   No system match -> defaults: business service "uk-sap-fscd-dev",
#     offering "uk-sap-fscd-dev - AXA GROUP OPERATIONS - Development - Standard"
#     (full record Name; the form shows only "uk-sap-fscd-dev - AXA GROUP OPERATIONS")
#   Category / Subcategory Other
#   Impact / Urgency "4 - Low" (FIXED_IMPACT / FIXED_URGENCY), so Priority "4 - Low"
#   Business service and offering are sent by sys_id (looked up by name), then PATCHed again
#   after create, because SILVA ignored the names and swapped in a default offering.
# Assignment group: L2 group by default (DEFAULT_TIER = "L2").
#   Order: TEST_ASSIGNMENT_GROUP (if set) -> tag AGO_AXA_SUPPORTGROUP -> SYSTEM_MAP group -> DEFAULT_GROUPS.
#   DEFAULT_GROUPS.L2 = "Ops_Middleware_Monitoring_AXAJP", so unmapped systems route as before.
# Assigned to: ASSIGNED_TO = "Shuge KUI", only when the ticket lands in DEFAULT_GROUPS.L2
#   (a person must be a member of the group, so mapped groups stay unassigned).
# Customer notes (comments): Cause, Links, Service, Dashboard, Application, Dynatrace link
# Sync keys:
#   SNOW correlation_id = <problemId>
#   PD  dedup_key       = dt-problem-<problemId>
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com , events.pagerduty.com
#   2) SNOW password and PD routing key are filled in (local copy only — never commit this file)
#   3) Fill SYSTEM_MAP rows from SILVA (names must match exactly); replace __L3_GROUP__,
#      __EIP_DASHBOARD_URL__, __PD_SERVICE_URL__
#   4) Keep classic SNOW Problem notification ITSM OFF (avoid duplicate INC)
#   5) SILVA may skip INC if CMDB says host retired — that is expected gatekeeper logic
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem OPEN to SILVA HTTP and PagerDuty (sync)
  description: >-
    No ServiceNow connector. On Problem open, HTTP POST to SILVA/SNOW Table API
    and PagerDuty Events API in parallel. Same problemId syncs both sides.
    Ticket is enriched with environment, business service, category, impact,
    assignment group and a customer notes block.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "UPDATED" OR
        event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-payload:
      name: prepare-payload
      description: Build shared fields for SILVA INC and PagerDuty trigger (sync keys) plus enrichment.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- enrichment settings (edit) ----------
          // Any group name here overrides all routing (testing only); "" uses the data map
          const TEST_ASSIGNMENT_GROUP = "";
          // Display name must match exactly one active member of DEFAULT_GROUPS.L2
          const ASSIGNED_TO = "Shuge KUI";
          // "" → "[DYNATRACE JAPAN][<host>] - <problem title>"; any text here replaces it for every ticket
          const FIXED_SHORT_DESCRIPTION = "";
          const SHORT_PREFIX = "[DYNATRACE JAPAN]";
          const CONTACT_TYPE = "Event";
          const COMPANY = "AXA GROUP OPERATIONS";
          const APPLICATION = "EIP";
          // Defaults when no SYSTEM_MAP row matches
          const BUSINESS_SERVICE = "uk-sap-fscd-dev";
          // Must be the offering's full Name; SNOW matches the whole label, not the short text in the form
          const SERVICE_OFFERING = "uk-sap-fscd-dev - AXA GROUP OPERATIONS - Development - Standard";
          // Data map: system -> SILVA values. Key is matched as a whole word (EIP matches ALJ_EIP_PRD,
          // not RECEIPT). Leave a value "" to fall back to the default. When SILVA changes, edit here only.
          const SYSTEM_MAP = {
            EIP: {
              businessService: "ALJ_EIP_PRD",
              serviceOffering: "",
              l1Group: "",
              l2Group: "",
              environment: "Production"
            }
            // COMPASSPROXY: {
            //   businessService: "<exact cmdb_ci_service name>",
            //   serviceOffering: "<exact service_offering name>",
            //   l1Group: "",
            //   l2Group: "<exact sys_user_group name>",
            //   environment: "Test"
            // }
          };
          // Tag keys searched for the system name, in this order
          const SYSTEM_TAG_KEYS = ["system", "app", "dt.cost.product"];
          const FIXED_ENVIRONMENT = "Development";
          // "4" + "4" gives Priority "4 - Low"; set "" to derive impact / urgency from problem severity
          const FIXED_IMPACT = "4";
          const FIXED_URGENCY = "4";
          // SILVA rules may re-derive business service from the CI; set false if the service still comes out blank
          const SEND_CONFIGURATION_ITEM = true;
          const ENVIRONMENT = {
            prod: "Production", prd: "Production", acc: "Acceptance", pre: "Pre-Production",
            stg: "Staging", uat: "UAT", tst: "Test", dev: "Development"
          };
          const DEFAULT_ENVIRONMENT = "Development";
          const DEFAULT_GROUPS = {
            L1: "Dynatrace Support",
            L2: "Ops_Middleware_Monitoring_AXAJP",
            L3: "__L3_GROUP__"
          };
          // L2 is passed by default; "L1" sends first-line tickets to the L1 group instead
          const DEFAULT_TIER = "L2";
          const IMPACT_LABEL = { "1": "1 - Critical", "2": "2 - High", "3": "3 - Medium", "4": "4 - Low" };
          // Only "Other / Other" is confirmed on SILVA; turn rules on after checking sys_choice labels
          const USE_CATEGORY_RULES = false;
          const CATEGORY_BY_KEYWORD = [
            { match: /disk|file space|storage|volume/i, category: "Capacity", subcategory: "Disk space" },
            { match: /memory|heap|oom/i, category: "Capacity", subcategory: "Memory" },
            { match: /cpu/i, category: "Capacity", subcategory: "CPU" }
          ];
          const CATEGORY_BY_SEVERITY = {
            AVAILABILITY: { category: "Availability", subcategory: "Outage" },
            ERROR: { category: "Application", subcategory: "Error" },
            PERFORMANCE: { category: "Performance", subcategory: "Slow response" },
            RESOURCE_CONTENTION: { category: "Capacity", subcategory: "Resource usage" }
          };
          const DEFAULT_CATEGORY = { category: "Other", subcategory: "Other" };
          const DASHBOARD_URL = "__EIP_DASHBOARD_URL__";
          const PD_SERVICE_URL = "__PD_SERVICE_URL__";
          // -----------------------------------------------

          function tagValue(tags, key) {
            const hit = (tags || []).find(t => (t.key || "").toLowerCase() === key);
            return hit ? (hit.value || "") : "";
          }

          // Problem API tags are {key, value}; trigger event tags are "[Context]key:value" strings
          function systemCandidates(ev, tags) {
            const out = [];
            for (const key of SYSTEM_TAG_KEYS) {
              for (const t of tags || []) {
                if ((t.key || "").toLowerCase() === key && t.value) out.push(t.value);
              }
              for (const s of ev["entity_tags"] || []) {
                const x = String(s).replace(/^\[[^\]]+\]/, "");
                const i = x.indexOf(":");
                if (i > 0 && x.slice(0, i).toLowerCase() === key) out.push(x.slice(i + 1));
              }
            }
            return out
              .concat(ev["dt.security.context"] || [])
              .concat(ev["root_cause_entity_name"] || [])
              .concat(ev["affected_entity_names"] || [])
              .filter(Boolean);
          }

          function findSystem(candidates) {
            const keys = Object.keys(SYSTEM_MAP);
            for (const v of candidates) {
              const whole = String(v).toUpperCase();
              const words = whole.split(/[^A-Z0-9]+/);
              const key = keys.find(k => whole === k.toUpperCase() || words.includes(k.toUpperCase()));
              if (key) return Object.assign({ key: key, matchedOn: String(v) }, SYSTEM_MAP[key]);
            }
            return null;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};

            const problemTitle =
              ev["event.name"] ||
              ev["problem.title"] ||
              ev.title ||
              "Dynatrace Problem";
            const problemId =
              ev["display_id"] ||
              ev["problem.id"] ||
              ev["event.id"] ||
              ev.pid ||
              "unknown-problem";
            const problemUrl =
              ev["problem.url"] ||
              ev["event.url"] ||
              ev.url ||
              (ev["event.id"] ? getEnvironmentUrl().replace(/\/$/, "") +
                "/ui/apps/dynatrace.davis.problems/problem/" + ev["event.id"] : "");
            const severity = String(
              ev["problem.severity"] ||
                ev["event.severity"] ||
                ev["event.category"] ||
                ev.severity ||
                "ERROR"
            ).toUpperCase();
            const hostName =
              ev["host.name"] ||
              ev["dt.entity.host.name"] ||
              ev["affected_entity_name"] ||
              "";

            let pdSeverity = "warning";
            let snowImpact = "3";
            let snowUrgency = "3";
            if (severity.includes("AVAILABILITY") || severity.includes("CRITICAL")) {
              pdSeverity = "critical";
              snowImpact = "1";
              snowUrgency = "1";
            } else if (severity.includes("ERROR")) {
              pdSeverity = "error";
              snowImpact = "2";
              snowUrgency = "2";
            } else if (severity.includes("CUSTOM") || severity.includes("INFO")) {
              pdSeverity = "info";
              snowImpact = "4";
              snowUrgency = "4";
            }
            if (FIXED_IMPACT) snowImpact = FIXED_IMPACT;
            if (FIXED_URGENCY) snowUrgency = FIXED_URGENCY;

            // --- enrichment: problem details (tags, root cause, evidence) ---
            let prob = {};
            try {
              prob = await problemsClient.getProblem({ problemId: ev["event.id"] });
            } catch (e) {
              prob = {};
            }
            const tags = prob.entityTags || [];
            const zones = (prob.managementZones || []).map(z => z.name);
            const root = prob.rootCauseEntity || (prob.affectedEntities || [])[0] || {};
            const where = root.name || hostName || "unknown entity";
            const ciName = hostName || root.name || "";
            const evidence = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .filter(d => d.rootCauseRelevant !== false)
              .map(d => d.displayName)
              .slice(0, 3);

            const system = findSystem(systemCandidates(ev, tags));
            const environment =
              (system && system.environment) ||
              FIXED_ENVIRONMENT ||
              tagValue(tags, "ago_axaenvironmentname") ||
              ENVIRONMENT[tagValue(tags, "env").toLowerCase()] ||
              DEFAULT_ENVIRONMENT;
            const application = (system && system.key) || tagValue(tags, "app") || APPLICATION;
            const businessService =
              (system && system.businessService) || tagValue(tags, "snow-service") || BUSINESS_SERVICE;
            // A default offering belongs to the default business service, so a mapped system without
            // its own offering sends none and lets SILVA pick one for that service
            const serviceOffering = system ? (system.serviceOffering || "") : SERVICE_OFFERING;
            const dashboard = tagValue(tags, "dashboard") || DASHBOARD_URL;
            const cat = USE_CATEGORY_RULES
              ? (CATEGORY_BY_KEYWORD.find(k => k.match.test(problemTitle)) ||
                  CATEGORY_BY_SEVERITY[severity] || DEFAULT_CATEGORY)
              : DEFAULT_CATEGORY;

            // Routing: support-group tag, else the system's group from the data map, else the default group.
            // Production outages always go to L2.
            const groups = {
              L1: (system && system.l1Group) || DEFAULT_GROUPS.L1,
              L2: (system && system.l2Group) || DEFAULT_GROUPS.L2,
              L3: DEFAULT_GROUPS.L3
            };
            const tier = snowImpact === "1" && environment === "Production" ? "L2" : DEFAULT_TIER;
            const routedGroup = tagValue(tags, "ago_axa_supportgroup") || groups[tier];
            const assignmentGroup = TEST_ASSIGNMENT_GROUP || routedGroup;
            const assignedTo = assignmentGroup === DEFAULT_GROUPS.L2 ? ASSIGNED_TO : "";
            const groupNote = TEST_ASSIGNMENT_GROUP
              ? assignmentGroup + " (fixed; normal routing: " + routedGroup + ")"
              : assignmentGroup;
            const escalation = "L1 " + groups.L1 + " -> L2 " + groups.L2 + " -> L3 " + groups.L3;
            const systemNote = system
              ? system.key + " (matched on " + system.matchedOn + ")"
              : "no SYSTEM_MAP match, defaults used";

            const cause = [problemTitle + " on " + where].concat(evidence.map(e => "- " + e));

            const customerNotes = [
              "=== Dynatrace alert " + problemId + " ===",
              "",
              "Cause",
              ...cause.map(c => "  " + c),
              "",
              "Links",
              "  Dynatrace problem : " + (problemUrl || "n/a"),
              "  PagerDuty         : " + PD_SERVICE_URL + " (dedup_key dt-problem-" + problemId + ")",
              "  Dashboard         : " + dashboard,
              "",
              "Service",
              "  System (data map) : " + systemNote,
              "  Business service  : " + businessService,
              "  Service offering  : " + (serviceOffering || "SILVA default for the service"),
              "  Application       : " + application,
              "  Environment       : " + environment,
              "  Affected entity   : " + where + (hostName && hostName !== where ? " on host " + hostName : ""),
              "  Management zone   : " + (zones.join(", ") || "n/a"),
              "",
              "Ticket",
              "  Category          : " + cat.category + " / " + cat.subcategory,
              "  Impact / Urgency  : " + IMPACT_LABEL[snowImpact] + " / " + IMPACT_LABEL[snowUrgency],
              "  Assignment group  : " + groupNote,
              "  Assigned to       : " + (assignedTo || "unassigned"),
              "  Escalation path   : " + escalation,
              "  Severity          : " + severity
            ].join("\n").slice(0, 3900);

            const additionalInformation = {
              correlation_id: problemId,
              dynatrace_severity: severity,
              environmentName: environment,
              managementZones: zones,
              problemDescription: "OPEN " + (prob.impactLevel || "") + " Problem " + problemId + ": " + problemTitle,
              problem_displayId: problemId,
              problem_id: ev["event.id"] || "",
              host: ciName,
              tags: tags.map(t => (t.value ? t.key + ":" + t.value : t.key)),
              title: problemTitle,
              system: system ? system.key : "",
              u_business_service: businessService,
              u_external_url: problemUrl
            };
            const notificationDescription = (problemTitle + "\nAdditional Information:\n" +
              JSON.stringify(additionalInformation, null, 1)).slice(0, 3900);

            return {
              problemId: problemId,
              problemUrl: problemUrl,
              problemTitle: problemTitle,
              hostName: hostName,
              ciName: ciName,
              sendConfigurationItem: SEND_CONFIGURATION_ITEM,
              severity: severity,
              pdSeverity: pdSeverity,
              snowImpact: snowImpact,
              snowUrgency: snowUrgency,
              impactLabel: IMPACT_LABEL[snowImpact],
              urgencyLabel: IMPACT_LABEL[snowUrgency],
              contactType: CONTACT_TYPE,
              company: COMPANY,
              environment: environment,
              system: system ? system.key : "",
              systemNote: systemNote,
              businessService: businessService,
              serviceOffering: serviceOffering,
              application: application,
              category: cat.category,
              subcategory: cat.subcategory,
              assignmentGroup: assignmentGroup,
              assignedTo: assignedTo,
              groupNote: groupNote,
              tier: tier,
              escalation: escalation,
              where: where,
              cause: cause,
              dashboard: dashboard,
              customerNotes: customerNotes,
              notificationDescription: notificationDescription,
              shortDescription: (FIXED_SHORT_DESCRIPTION ||
                SHORT_PREFIX + "[" + (ciName || where) + "] - " + problemTitle).slice(0, 160),
              // SYNC KEYS — must match CLOSE workflow
              correlationId: problemId,
              dedupKey: "dt-problem-" + problemId,
              silvaBaseUrl: "https://silvastg.service-now.com",
              silvaUsername: "Tech_DynatraceJP_WS"
            };
          }

    post-silva-incident-http:
      name: post-silva-incident-http
      description: >-
        HTTP POST to SILVA/SNOW (no snow connector) with enriched fields and customer notes.
        SILVA/CMDB may skip retired hosts.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          async function lookupSysId(baseUrl, headers, table, name) {
            if (!name) return { sysId: "", status: 0, matches: 0 };
            const url = baseUrl + "/api/now/v2/table/" + table +
              "?sysparm_query=" + encodeURIComponent("name=" + name) +
              "&sysparm_fields=sys_id,name&sysparm_limit=2";
            const res = await fetch(url, { method: "GET", headers: headers });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = {}; }
            const rows = json.result || [];
            return {
              sysId: rows.length === 1 ? rows[0].sys_id : "",
              status: res.status,
              matches: rows.length
            };
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");

            const baseUrl = String(p.silvaBaseUrl || "https://silvastg.service-now.com").replace(/\/$/, "");
            const username = p.silvaUsername || "Tech_DynatraceJP_WS";
            const password = "JGyUG4XW^h^zCaW.U*(_Wnt0{+=XIqwNkL(pF*Z}";
            const headers = {
              Authorization: basicAuthHeader(username, password),
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            // Names are not reliable for these reference fields: SILVA leaves business service blank
            // and swaps in a default offering. Resolve sys_ids first and send those.
            const bsLookup = await lookupSysId(baseUrl, headers, "cmdb_ci_service", p.businessService);
            const soLookup = await lookupSysId(baseUrl, headers, "service_offering", p.serviceOffering);

            // Table API create — same sync field CLOSE will search.
            // Values are display labels (sysparm_input_display_value=true); a label that does
            // not match a SILVA choice or record is dropped silently, so the result lists blanks.
            const body = {
              short_description: p.shortDescription,
              description: p.notificationDescription,
              correlation_id: p.correlationId,
              impact: p.impactLabel,
              urgency: p.urgencyLabel,
              caller_id: username,
              contact_type: p.contactType,
              company: p.company,
              u_host: p.hostName,
              u_environment: p.environment,
              business_service: bsLookup.sysId || p.businessService,
              category: p.category,
              subcategory: p.subcategory,
              assignment_group: p.assignmentGroup,
              comments: p.customerNotes,
              work_notes:
                "Opened by Dynatrace workflow (HTTP, no SNOW connector). " +
                "Sync correlation_id=" + p.correlationId +
                " PD dedup_key=" + p.dedupKey +
                " problem_url=" + p.problemUrl
            };
            if (p.serviceOffering) body.service_offering = soLookup.sysId || p.serviceOffering;
            if (p.ciName && p.sendConfigurationItem) body.cmdb_ci = p.ciName;
            if (p.assignedTo) body.assigned_to = p.assignedTo;

            const res = await fetch(
              baseUrl + "/api/now/v2/table/incident" +
                "?sysparm_input_display_value=true&sysparm_display_value=true&sysparm_exclude_reference_link=true",
              {
                method: "POST",
                headers: headers,
                body: JSON.stringify(body)
              }
            );
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }

            // SILVA gatekeeper: retired host / policy skip may return non-create
            if (!res.ok) {
              throw new Error(
                "SILVA/SNOW HTTP create failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for silvastg.service-now.com"
              );
            }

            const row = json.result || json;

            // Insert-time rules can still overwrite the service fields, so set them again by sys_id
            // (raw values, no display-value flag) now that the record exists.
            let serviceFix = { attempted: false };
            if (row.sys_id && (bsLookup.sysId || soLookup.sysId)) {
              const fixBody = {};
              if (bsLookup.sysId) fixBody.business_service = bsLookup.sysId;
              if (soLookup.sysId) fixBody.service_offering = soLookup.sysId;
              const fixRes = await fetch(
                baseUrl + "/api/now/v2/table/incident/" + row.sys_id +
                  "?sysparm_display_value=true&sysparm_exclude_reference_link=true",
                { method: "PATCH", headers: headers, body: JSON.stringify(fixBody) }
              );
              const fixText = await fixRes.text();
              let fixJson = {};
              try { fixJson = JSON.parse(fixText); } catch (e) { fixJson = { raw: fixText }; }
              const fixRow = fixJson.result || {};
              serviceFix = {
                attempted: true,
                status: fixRes.status,
                businessService: fixRow.business_service || "",
                serviceOffering: fixRow.service_offering || ""
              };
              if (fixRes.ok) {
                row.business_service = serviceFix.businessService;
                row.service_offering = serviceFix.serviceOffering;
              }
            }

            const stored = {
              contactType: row.contact_type || "",
              company: row.company || "",
              environment: row.u_environment || "",
              businessService: row.business_service || "",
              serviceOffering: row.service_offering || "",
              configurationItem: row.cmdb_ci || "",
              category: row.category || "",
              subcategory: row.subcategory || "",
              impact: row.impact || "",
              urgency: row.urgency || "",
              priority: row.priority || "",
              assignmentGroup: row.assignment_group || "",
              assignedTo: row.assigned_to || ""
            };
            return {
              created: true,
              incidentNumber: row.number || "",
              incidentSysId: row.sys_id || "",
              stored: stored,
              notFilled: Object.keys(stored).filter(k => !stored[k]),
              system: p.systemNote,
              serviceLookup: { businessService: bsLookup, serviceOffering: soLookup },
              serviceFix: serviceFix,
              correlationId: p.correlationId,
              dedupKey: p.dedupKey,
              raw: json
            };
          }

    trigger-pagerduty:
      name: trigger-pagerduty
      description: HTTP POST PagerDuty Events API v2 trigger (parallel with SILVA) with enriched details.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const routingKey = "222651dbacb04403c0bf52d3b48499e8";

            const links = [];
            if (p.problemUrl) links.push({ href: p.problemUrl, text: "Dynatrace problem" });
            if (/^https?:\/\//.test(p.dashboard)) links.push({ href: p.dashboard, text: "Dashboard" });

            const body = {
              routing_key: routingKey,
              event_action: "trigger",
              dedup_key: p.dedupKey,
              client: "Dynatrace",
              client_url: p.problemUrl,
              payload: {
                summary: p.shortDescription,
                source: "dynatrace",
                severity: p.pdSeverity,
                group: p.environment,
                component: p.application,
                custom_details: {
                  problem_id: p.problemId,
                  problem_url: p.problemUrl,
                  host_name: p.hostName,
                  affected_entity: p.where,
                  environment: p.environment,
                  system: p.systemNote,
                  business_service: p.businessService,
                  application: p.application,
                  category: p.category + " / " + p.subcategory,
                  impact: p.impactLabel,
                  urgency: p.urgencyLabel,
                  assignment_group: p.groupNote,
                  assigned_to: p.assignedTo || "unassigned",
                  escalation_path: p.escalation,
                  cause: p.cause.join("\n"),
                  dashboard: p.dashboard,
                  snow_correlation_id: p.correlationId,
                  silva_path: "HTTP Table API (no snow connector)",
                  sync_note: "CLOSE uses same dedup_key + correlation_id"
                }
              },
              links: links
            };

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) {
              throw new Error(
                "PagerDuty trigger failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for events.pagerduty.com"
              );
            }
            return {
              status: json.status || "ok",
              dedupKey: json.dedup_key || p.dedupKey,
              correlationId: p.correlationId,
              raw: json
            };
          }
