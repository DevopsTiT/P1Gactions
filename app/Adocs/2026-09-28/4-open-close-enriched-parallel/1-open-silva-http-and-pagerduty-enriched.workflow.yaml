# OPEN (enriched) — Problem ACTIVE → SILVA (HTTP) + PagerDuty IN PARALLEL, then cross-link notes
# Based on: 2026-09-24/1-silva-http-snow-pd-sync-workflows/1-open-silva-http-and-pagerduty.workflow.yaml
# Same shape as before:
#   prepare-payload ──► post-silva-incident-http   (x:0, y:2)
#                  └──► trigger-pagerduty          (x:1, y:2)   ← same time
#   then add-cross-links (waits for both) writes the notes block with the real PagerDuty link
#
# Enrichment requirements:
#   Ticket fields clearly show: env, business service, category, subcategory, priority, impact, assignment group
#   Notes list: cause, Dynatrace link, PagerDuty link, which service, which dashboard
#   Assignment group must be an existing, active sys_user_group (sent as sys_id)
#
# Sync keys (unchanged — CLOSE depends on them):
#   SNOW correlation_id (External Ticket Number) = <problemId>
#   PD   dedup_key                               = dt-problem-<problemId>
#
# BEFORE ACTIVATE:
#   1) External requests allowlist: silvastg.service-now.com , events.pagerduty.com , api.pagerduty.com
#   2) Replace __SNOW_PASSWORD__, __PD_ROUTING_KEY__, __PD_API_KEY__ (REST, read + notes), __PD_FROM_EMAIL__
#   3) Confirm FIELD names and choice labels (2026-09-28/1-silva-post-mandatory-fields-enrich/1.sh)
#   4) Fill GROUP_BY_ZONE, SERVICE_BY_ZONE, DASHBOARD_BY_APP, DASHBOARD_BY_ZONE, DEFAULT
#   5) Keep classic SNOW Problem notification ITSM OFF (avoid duplicate INC)
#   6) SILVA may skip INC if CMDB says host retired — expected gatekeeper logic
#
metadata:
  version: "1"
  dependencies:
    apps:
      - id: dynatrace.automations
        version: ^1.3301.5
  inputs: []
workflow:
  title: AGO - Problem OPEN to SILVA HTTP and PagerDuty (sync, enriched)
  description: >-
    No ServiceNow connector. On Problem open, enrich (fields, CMDB, verified group, cause,
    dashboard), then HTTP POST to SILVA and PagerDuty in parallel. A final task adds a notes
    block to the INC with cause, Dynatrace link, PagerDuty link, service, and dashboard, and
    adds the INC number as a note on the PagerDuty incident.
  schemaVersion: 3
  trigger:
    eventTrigger:
      isActive: true
      filterQuery: >-
        event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND
        (event.status_transition == "CREATED" OR event.status_transition == "REOPENED")
      triggerConfiguration:
        type: davis-problem
        value:
          categories:
            error: true
            resource: true
            slowdown: true
            availability: true
          entityTags: {}
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  tasks:
    prepare-payload:
      name: prepare-payload
      description: >-
        Build shared fields for SILVA INC and PagerDuty trigger (sync keys) plus enrichment:
        problem details, tags, cause, dashboard, CMDB lookup, verified assignment group.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 1
      predecessors: []
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';
          import { problemsClient } from '@dynatrace-sdk/client-classic-environment-v2';
          import { queryExecutionClient } from '@dynatrace-sdk/client-query';
          import { getEnvironmentUrl } from '@dynatrace-sdk/app-environment';

          // ---------- edit these maps ----------
          const SILVA_BASE = "https://silvastg.service-now.com";
          const SILVA_USER = "Tech_DynatraceJP_WS";
          const SILVA_PASS = "__SNOW_PASSWORD__";

          const FIELD = {
            caller: "caller_id",
            contactType: "contact_type",
            company: "company",
            environment: "u_environment",
            businessService: "business_service",
            serviceOffering: "service_offering",
            ci: "cmdb_ci",
            category: "category",
            subcategory: "subcategory",
            impact: "impact",
            urgency: "urgency",
            assignmentGroup: "assignment_group",
            shortDescription: "short_description",
            summary: "description",
            externalTicket: "correlation_id"
          };
          const ENVIRONMENT = { prod: "Production", stg: "Staging", uat: "UAT", dev: "Development" };
          const OFFERING_BY_ENV = {
            prod: "AXA GROUP OPERATIONS - Production",
            stg: "AXA GROUP OPERATIONS - Staging"
          };
          const KEYWORD_CATEGORY = [
            { match: /disk|file space|storage|volume/i, category: "Capacity", subcategory: "Disk space" },
            { match: /memory|heap|oom/i, category: "Capacity", subcategory: "Memory" },
            { match: /cpu/i, category: "Capacity", subcategory: "CPU" }
          ];
          const SEVERITY_CATEGORY = {
            AVAILABILITY: { category: "Availability", subcategory: "Outage" },
            ERROR: { category: "Application", subcategory: "Error" },
            PERFORMANCE: { category: "Performance", subcategory: "Slow response" },
            RESOURCE_CONTENTION: { category: "Capacity", subcategory: "Resource usage" }
          };
          const GROUP_BY_ZONE = { "JP-Prod": "Dynatrace Support", "Payments": "Payments SRE" };
          const SERVICE_BY_ZONE = { "Payments": "Online Payments" };
          const DASHBOARD_BY_APP = {
            "policy-db": "https://abc12345.apps.dynatrace.com/ui/apps/dynatrace.dashboards/dashboard/__POLICY_DB_DASHBOARD_ID__"
          };
          const DASHBOARD_BY_ZONE = {
            "JP-Prod": "https://abc12345.apps.dynatrace.com/ui/apps/dynatrace.dashboards/dashboard/__JP_PROD_OVERVIEW_ID__"
          };
          const DEFAULT = {
            environment: "Production",
            businessService: "AXA GROUP OPERATIONS - Monitoring",
            serviceOffering: "AXA GROUP OPERATIONS - Production",
            category: { category: "Monitoring", subcategory: "Custom alert" },
            group: "Dynatrace Support"
          };
          // -------------------------------------

          function basicAuthHeader(user, pass) {
            return "Basic " + Buffer.from(String(user) + ":" + String(pass)).toString("base64");
          }
          function tagValue(tags, key) {
            const hit = (tags || []).find(t => (t.key || "").toLowerCase() === key);
            return hit ? (hit.value || "") : "";
          }
          async function snowGet(path) {
            const res = await fetch(SILVA_BASE + path, {
              headers: { Authorization: basicAuthHeader(SILVA_USER, SILVA_PASS), Accept: "application/json" }
            });
            if (!res.ok) throw new Error("SILVA GET " + path + " HTTP " + res.status + ": " + (await res.text()) +
              " | Allowlist silvastg.service-now.com?");
            return (await res.json()).result || [];
          }
          async function runDql(query) {
            const start = await queryExecutionClient.queryExecute({
              body: { query, requestTimeoutMilliseconds: 30000, maxResultRecords: 50 }
            });
            if (start.result) return start.result.records || [];
            let poll = await queryExecutionClient.queryPoll({ requestToken: start.requestToken });
            while (poll.state === "RUNNING" || poll.state === "NOT_STARTED") {
              await new Promise(r => setTimeout(r, 1000));
              poll = await queryExecutionClient.queryPoll({ requestToken: start.requestToken });
            }
            return (poll.result && poll.result.records) || [];
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const ev = ex.event() || {};
            const internalId = ev["event.id"];
            const problemId = ev["display_id"] || ev["problem.id"] || internalId || "unknown-problem";

            // --- Dynatrace side ---
            const prob = await problemsClient.getProblem({ problemId: internalId });
            const problemTitle = prob.title || ev["event.name"] || "Dynatrace Problem";
            const problemUrl = getEnvironmentUrl().replace(/\/$/, "") +
              "/ui/apps/dynatrace.davis.problems/problem/" + internalId;
            const severity = String(prob.severityLevel || ev["event.category"] || "ERROR").toUpperCase();
            const impactLevel = prob.impactLevel || "INFRASTRUCTURE";

            const root = prob.rootCauseEntity || (prob.affectedEntities || [])[0] || {};
            const rootId = root.entityId ? root.entityId.id : "";
            const all = [root, ...(prob.affectedEntities || []), ...(prob.impactedEntities || [])];
            const hostEntity = all.find(e => e.entityId && e.entityId.type === "HOST");
            const serviceEntity = all.find(e => e.entityId && e.entityId.type === "SERVICE");
            const hostName = hostEntity ? hostEntity.name : (ev["host.name"] || ev["affected_entity_name"] || "");
            const where = root.name || hostName || "unknown entity";
            const tags = prob.entityTags || [];
            const zones = (prob.managementZones || []).map(z => z.name);
            const env = tagValue(tags, "env").toLowerCase();
            const app = tagValue(tags, "app");
            const evidence = ((prob.evidenceDetails && prob.evidenceDetails.details) || [])
              .filter(d => d.rootCauseRelevant !== false).map(d => d.displayName).slice(0, 3);

            const logs = rootId ? await runDql(
              `fetch logs, from:now()-30m
               | filter dt.source_entity == "${rootId}" or host.name == "${hostName}"
               | filter loglevel == "ERROR" or loglevel == "SEVERE"
               | summarize count = count(), by:{content}
               | sort count desc
               | limit 1`
            ) : [];
            const topLog = logs.length ? "(" + logs[0].count + "x in 30 min) " + String(logs[0].content).slice(0, 250) : "";
            const dashboard = tagValue(tags, "dashboard") || DASHBOARD_BY_APP[app] ||
              zones.map(z => DASHBOARD_BY_ZONE[z]).find(Boolean) || "";

            // --- SILVA side: CMDB + verified group ---
            const gaps = [];
            let ci = null;
            if (hostName || root.name) {
              const name = hostName || root.name;
              const q = encodeURIComponent("name=" + name + "^ORname=" + name.split(".")[0] + "^ORfqdn=" + name);
              const rows = await snowGet("/api/now/v2/table/cmdb_ci?sysparm_query=" + q +
                "&sysparm_limit=1&sysparm_fields=sys_id,name,install_status,support_group,u_business_service" +
                "&sysparm_display_value=all&sysparm_exclude_reference_link=true");
              if (rows[0]) {
                const r = rows[0];
                ci = {
                  sysId: r.sys_id.value,
                  name: r.name.display_value,
                  retired: r.install_status && r.install_status.value === "7",
                  supportGroup: r.support_group ? r.support_group.display_value : "",
                  businessService: r.u_business_service ? r.u_business_service.display_value : ""
                };
              }
            }
            if (!ci) gaps.push("Configuration item not found in CMDB");

            const groupCandidates = [
              ci && ci.supportGroup, tagValue(tags, "snow-group"),
              zones.map(z => GROUP_BY_ZONE[z]).find(Boolean), DEFAULT.group
            ].filter(Boolean);
            let group = null;
            for (const name of groupCandidates) {
              const rows = await snowGet("/api/now/v2/table/sys_user_group?sysparm_query=" +
                encodeURIComponent("name=" + name + "^active=true") + "&sysparm_fields=sys_id,name&sysparm_limit=1");
              if (rows[0]) { group = rows[0]; break; }
            }
            if (!group) throw new Error("No active sys_user_group matched: " + groupCandidates.join(", "));
            if (group.name === DEFAULT.group && groupCandidates[0] !== DEFAULT.group) gaps.push("Assignment group defaulted");

            // --- classification ---
            const envLabel = ENVIRONMENT[env] || (gaps.push("Environment defaulted"), DEFAULT.environment);
            const businessService = (ci && ci.businessService) || tagValue(tags, "snow-service") ||
              zones.map(z => SERVICE_BY_ZONE[z]).find(Boolean) ||
              (gaps.push("Business service defaulted"), DEFAULT.businessService);
            const serviceOffering = tagValue(tags, "snow-offering") || OFFERING_BY_ENV[env] ||
              (gaps.push("Service offering defaulted"), DEFAULT.serviceOffering);
            const cat = KEYWORD_CATEGORY.find(k => k.match.test(problemTitle)) || SEVERITY_CATEGORY[severity] ||
              (gaps.push("Category defaulted"), DEFAULT.category);

            const isProd = envLabel === "Production";
            const snowImpact = impactLevel === "APPLICATION" ? "1" : impactLevel === "SERVICES" ? "2" : (isProd ? "2" : "3");
            const snowUrgency = !isProd ? "3" : severity === "AVAILABILITY" ? "1" :
              (severity === "ERROR" || severity === "PERFORMANCE") ? "2" : "3";
            const pdSeverity = snowUrgency === "1" ? "critical" : snowUrgency === "2" ? "error" : "warning";

            const notificationDescription =
              "[OPEN] " + problemId + " | Problem " + problemTitle + "\n" +
              "Root cause entity: " + where + "\n" +
              "Dynatrace: " + problemUrl;

            return {
              problemId: problemId,
              internalId: internalId,
              problemUrl: problemUrl,
              problemTitle: problemTitle,
              hostName: hostName,
              where: where,
              dtService: serviceEntity ? serviceEntity.name : "",
              app: app,
              severity: severity,
              pdSeverity: pdSeverity,
              snowImpact: snowImpact,
              snowUrgency: snowUrgency,
              envLabel: envLabel,
              businessService: businessService,
              serviceOffering: serviceOffering,
              category: cat.category,
              subcategory: cat.subcategory,
              groupSysId: group.sys_id,
              groupName: group.name,
              ciSysId: ci ? ci.sysId : "",
              ciRetired: ci ? ci.retired : false,
              cause: [problemTitle + " on " + where].concat(evidence.map(e => "- " + e)).concat(topLog ? ["- Top error " + topLog] : []),
              dashboard: dashboard,
              runbook: tagValue(tags, "runbook"),
              gaps: gaps,
              field: FIELD,
              notificationDescription: notificationDescription,
              shortDescription: ("[Dynatrace][" + envLabel + "] " + problemTitle + " - " + where).slice(0, 160),
              // SYNC KEYS — must match CLOSE workflow
              correlationId: problemId,
              dedupKey: "dt-problem-" + problemId,
              silvaBaseUrl: SILVA_BASE,
              silvaUsername: SILVA_USER
            };
          }

    post-silva-incident-http:
      name: post-silva-incident-http
      description: >-
        HTTP POST to SILVA/SNOW (no snow connector) with all enriched fields.
        Runs at the same time as trigger-pagerduty. Retired CI → skipped (no INC).
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
        custom: '{{ result("prepare-payload").ciRetired == false }}'
        else: SKIP
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          function basicAuthHeader(user, pass) {
            const token = Buffer.from(String(user) + ":" + String(pass)).toString("base64");
            return "Basic " + token;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const F = p.field;

            const baseUrl = String(p.silvaBaseUrl).replace(/\/$/, "");
            const headers = {
              Authorization: basicAuthHeader(p.silvaUsername, "__SNOW_PASSWORD__"),
              "Content-Type": "application/json",
              Accept: "application/json"
            };

            const body = {
              [F.caller]: "Dynatrace JP",
              [F.contactType]: "Monitoring",
              [F.company]: "AXA GROUP OPERATIONS",
              [F.environment]: p.envLabel,
              [F.businessService]: p.businessService,
              [F.serviceOffering]: p.serviceOffering,
              [F.category]: p.category,
              [F.subcategory]: p.subcategory,
              [F.impact]: p.snowImpact,
              [F.urgency]: p.snowUrgency,
              [F.assignmentGroup]: p.groupSysId,
              [F.shortDescription]: p.shortDescription,
              [F.summary]: p.notificationDescription,
              [F.externalTicket]: p.correlationId
            };
            if (p.ciSysId) body[F.ci] = p.ciSysId;

            const res = await fetch(
              baseUrl + "/api/now/v2/table/incident?sysparm_input_display_value=true&sysparm_display_value=true&sysparm_exclude_reference_link=true",
              { method: "POST", headers: headers, body: JSON.stringify(body) }
            );
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) {
              throw new Error(
                "SILVA/SNOW HTTP create failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for silvastg.service-now.com"
              );
            }

            const row = json.result || {};
            return {
              created: true,
              incidentNumber: row.number || "",
              incidentSysId: row.sys_id || "",
              stored: {
                environment: row[F.environment] || "",
                businessService: row[F.businessService] || "",
                category: row[F.category] || "",
                subcategory: row[F.subcategory] || "",
                priority: row.priority || "",
                impact: row[F.impact] || "",
                urgency: row[F.urgency] || "",
                assignmentGroup: row[F.assignmentGroup] || ""
              },
              correlationId: p.correlationId,
              dedupKey: p.dedupKey
            };
          }

    trigger-pagerduty:
      name: trigger-pagerduty
      description: HTTP POST PagerDuty Events API v2 trigger (parallel with SILVA), enriched details.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 1
        y: 2
      predecessors:
        - prepare-payload
      conditions:
        states:
          prepare-payload: OK
        custom: '{{ result("prepare-payload").ciRetired == false }}'
        else: SKIP
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const routingKey = "__PD_ROUTING_KEY__";
            const snowSearch = p.silvaBaseUrl + "/incident_list.do?sysparm_query=" +
              encodeURIComponent(p.field.externalTicket + "=" + p.correlationId);

            const body = {
              routing_key: routingKey,
              event_action: "trigger",
              dedup_key: p.dedupKey,
              client: "Dynatrace",
              client_url: p.problemUrl,
              payload: {
                summary: p.shortDescription,
                source: p.where,
                severity: p.pdSeverity,
                group: p.envLabel,
                component: p.app || undefined,
                custom_details: {
                  problem_id: p.problemId,
                  environment: p.envLabel,
                  business_service: p.businessService,
                  category: p.category + " / " + p.subcategory,
                  impact: p.snowImpact,
                  urgency: p.snowUrgency,
                  assignment_group: p.groupName,
                  cause: p.cause.join("\n"),
                  dashboard: p.dashboard || "none tagged",
                  runbook: p.runbook || "none tagged",
                  snow_correlation_id: p.correlationId,
                  sync_note: "CLOSE uses same dedup_key + correlation_id"
                }
              },
              links: [
                { href: p.problemUrl, text: "Dynatrace problem" },
                { href: snowSearch, text: "SILVA incident (search by problem id)" }
              ].concat(p.dashboard ? [{ href: p.dashboard, text: "Dashboard" }] : [])
            };

            const res = await fetch("https://events.pagerduty.com/v2/enqueue", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch (e) { json = { raw: text }; }
            if (!res.ok) {
              throw new Error(
                "PagerDuty trigger failed HTTP " + res.status + ": " + text +
                " | Check External requests allowlist for events.pagerduty.com"
              );
            }
            return {
              status: json.status || "ok",
              dedupKey: json.dedup_key || p.dedupKey,
              correlationId: p.correlationId
            };
          }

    add-cross-links:
      name: add-cross-links
      description: >-
        After both parallel posts: get the PagerDuty incident link, write the notes block on the
        INC (classification, cause, Dynatrace link, PagerDuty link, service, dashboard), and add
        the INC number as a note on the PagerDuty incident.
      action: dynatrace.automations:run-javascript
      active: true
      position:
        x: 0
        y: 3
      predecessors:
        - post-silva-incident-http
        - trigger-pagerduty
      conditions:
        states:
          post-silva-incident-http: OK
          trigger-pagerduty: ANY
      input:
        script: |
          import { execution } from '@dynatrace-sdk/automation-utils';

          const NOTES_FIELD = "comments";
          const PD_API_KEY = "__PD_API_KEY__";
          const PD_FROM_EMAIL = "__PD_FROM_EMAIL__";

          function basicAuthHeader(user, pass) {
            return "Basic " + Buffer.from(String(user) + ":" + String(pass)).toString("base64");
          }
          const pdHeaders = {
            Authorization: "Token token=" + PD_API_KEY,
            Accept: "application/vnd.pagerduty+json;version=2",
            "Content-Type": "application/json"
          };

          async function findPdIncident(dedupKey) {
            for (let i = 0; i < 6; i++) {
              const res = await fetch("https://api.pagerduty.com/incidents?incident_key=" + encodeURIComponent(dedupKey) +
                "&statuses[]=triggered&statuses[]=acknowledged", { headers: pdHeaders });
              if (res.ok) {
                const inc = ((await res.json()).incidents || [])[0];
                if (inc) return inc;
              }
              await new Promise(r => setTimeout(r, 5000));
            }
            return null;
          }

          export default async function ({ executionId }) {
            const ex = await execution(executionId);
            const p = await ex.result("prepare-payload");
            const snow = await ex.result("post-silva-incident-http");
            const s = snow.stored;
            const show = v => v || "NOT SET - please fill";

            const pdInc = await findPdIncident(p.dedupKey);
            const pdLink = pdInc ? pdInc.html_url : "not found yet (dedup_key " + p.dedupKey + ")";

            const note = [
              "=== Dynatrace alert summary (" + p.problemId + ") ===",
              "",
              "Ticket classification",
              "  Environment      : " + show(s.environment),
              "  Business service : " + show(s.businessService),
              "  Category         : " + show(s.category),
              "  Subcategory      : " + show(s.subcategory),
              "  Priority         : " + show(s.priority),
              "  Impact           : " + show(s.impact),
              "  Urgency          : " + show(s.urgency),
              "  Assignment group : " + show(s.assignmentGroup),
              "",
              "Cause",
              ...p.cause.map(c => "  " + c),
              "",
              "Links",
              "  Dynatrace problem : " + p.problemUrl,
              "  PagerDuty incident: " + pdLink,
              "",
              "Which service",
              "  Business service  : " + show(s.businessService),
              "  Dynatrace service : " + (p.dtService || "n/a"),
              "  Affected entity   : " + p.where + (p.hostName && p.hostName !== p.where ? " on host " + p.hostName : ""),
              "  Application       : " + (p.app || "n/a"),
              "",
              "Dashboard to refer to",
              "  " + (p.dashboard || "None tagged - add Dynatrace tag \"dashboard:<url>\""),
              p.runbook ? "  Runbook: " + p.runbook : null,
              "",
              p.gaps.length ? "Defaults used (please review): " + p.gaps.join("; ") : null
            ].filter(x => x !== null).join("\n").slice(0, 3900);

            const patch = await fetch(p.silvaBaseUrl + "/api/now/v2/table/incident/" + snow.incidentSysId, {
              method: "PATCH",
              headers: {
                Authorization: basicAuthHeader(p.silvaUsername, "__SNOW_PASSWORD__"),
                "Content-Type": "application/json",
                Accept: "application/json"
              },
              body: JSON.stringify({ [NOTES_FIELD]: note })
            });
            if (!patch.ok) throw new Error("SILVA notes PATCH HTTP " + patch.status + ": " + (await patch.text()));

            let pdNoted = false;
            if (pdInc) {
              const snowLink = p.silvaBaseUrl + "/nav_to.do?uri=incident.do?sys_id=" + snow.incidentSysId;
              const r = await fetch("https://api.pagerduty.com/incidents/" + pdInc.id + "/notes", {
                method: "POST",
                headers: Object.assign({ From: PD_FROM_EMAIL }, pdHeaders),
                body: JSON.stringify({ note: { content: "SILVA " + snow.incidentNumber + " (" + show(s.priority) + ", " +
                  show(s.assignmentGroup) + "): " + snowLink } })
              });
              pdNoted = r.ok;
            }

            const missing = Object.entries(s).filter(([, v]) => !v).map(([k]) => k);
            return { incidentNumber: snow.incidentNumber, pdLink: pdInc ? pdInc.html_url : "", pdNoted, missing };
          }
