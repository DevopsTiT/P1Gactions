name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  # Ephemeral Minikube on the GitHub runner (NOT your Mac Minikube).
  # Matches docs/minikube.md: build/load image → apply deploy/ → smoke test.
  deploy-minikube:
    name: Deploy to Minikube
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          driver: docker
          kubernetes-version: stable

      - name: Build app image
        run: docker build -t ghcr.io/devopstit/p1gactions:latest ./app

      - name: Load image into Minikube
        run: minikube image load ghcr.io/devopstit/p1gactions:latest

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f deploy/deployment.yaml
          kubectl apply -f deploy/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/p1gactions --timeout=180s
          kubectl get pods,svc -l app=p1gactions

      - name: Smoke test /health
        run: |
          kubectl wait --for=condition=ready pod -l app=p1gactions --timeout=120s
          kubectl port-forward svc/p1gactions 8080:80 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          kubectl describe pod -l app=p1gactions
          kubectl logs -l app=p1gactions --tail=100
          exit 1
